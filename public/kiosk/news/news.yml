    body: >-
      The commission was asked to endorse two-way traffic on College Avenue and Walnut Street in the city's long-range plan. A consultant study puts the two-way redesign at $109.4 million, against $103.1 million for one-way safety improvements. Mayor Kerry Thomson opposes the two-way plan. Any commission vote would not fund construction; the plan commission and City Council would still have to act.
