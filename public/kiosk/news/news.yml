  - section: Local News
    title: Early voting starts Tuesday in Monroe County
    body: >-
      In-person early voting runs Oct 6-31 at Election Central in the North
      Showers Building, generally 8am-6pm, with shorter hours Oct 24 and 31
      (9am-4pm) and Nov 2 (8am-noon). Voter registration closes Oct 5 and
      absentee ballot requests are due Oct 22.

      The county had issued 1,348 absentee ballots and received 265 back as
      of Thursday, well ahead of the 2022 midterm pace of 154 returned. The
      election is Nov 3.
    source: B Square Bulletin
    url: https://bsquarebulletin.com/monroe-county-early-in-person-voting-starts-tuesday-absentee-ballot-pace-ahead-of-2022/
  - section: Local News
    title: Council president floats communications and development staff cuts
    body: >-
      Council President Isak Asare proposed eliminating the mayor's public
      engagement director, communications coordinator and legislative affairs
      specialist positions, and defunding Economic and Sustainable
      Development staff for part of 2027 to force a restructuring.
      Councilmembers also lean toward trimming a $600,000 sanitation subsidy
      and cutting a vacant transportation demand manager job.

      The council votes on amendments Oct 7. If big changes pass, final
      adoption would likely slip to Oct 14.
    source: B Square Bulletin
    url: https://bsquarebulletin.com/2027-budget-talks-for-bloomington-city-council-turn-to-potential-staffing-cuts/
  - section: Local News
    title: Duke Energy picks 87-acre Fullerton Pike site for industrial marketing
    body: >-
      The site at 3100 W. Fullerton Pike sits along I-69 with direct ramp
      access and major utilities. Its inclusion in Duke's 2026 Site
      Readiness Program does not mean any project or construction is planned.
      Since 2013 the program has prepared 53 Indiana properties.
    source: The Bloomingtonian
    url: https://bloomingtonian.com/2026/10/01/duke-energy-selects-87-acre-fullerton-pike-site-for-industrial-development-marketing/
  - section: Local News
    title: IU suspends Sigma Nu over hazing
    body: >-
      The suspension took effect Sept 29. IU has not said what conduct was
      involved or whether individual students face discipline. Sigma Nu had
      earlier agreed to alcohol and risk-management measures with the
      university. Beta Theta Pi, Delta Tau Delta, Pi Kappa Phi and Theta Chi
      also face restrictions this year, with hazing cited in each case.
    source: The Bloomingtonian
    url: https://bloomingtonian.com/2026/10/01/iu-suspends-sigma-nu-over-hazing/
  - section: US News
    title: Second judge blocks Trump's $100,000 H-1B visa fee
    body: >-
      Judge Haywood Gilliam in Oakland ruled Wednesday that USCIS and the
      State Department skipped the notice-and-comment rulemaking required
      before imposing the fee on new H-1B visas. A Massachusetts judge struck
      down the same fee in June in a suit by 20 states, and an appeals court
      has refused to let the administration resume collecting it while that
      case is appealed. Unions, employers and nonprofits brought the Oakland
      suit last October.
    source: U.S. News
    url: https://www.usnews.com/news/politics/articles/2026-09-30/second-judge-blocks-trumps-100-000-fee-for-new-h-1b-worker-visas
  - section: US News
    title: Hegseth creates autonomous warfare command, taps Musk for Project Meridian
    body: >-
      In a speech at Quantico, Defense Secretary Pete Hegseth announced a new
      four-star Autonomous Warfare Command for robotic, AI and drone systems,
      the first new US military command since Space Command in 2019. He also
      named Elon Musk, Newt Gingrich and Palmer Luckey to lead Project
      Meridian, a study of future warfare covering AI, autonomy, directed
      energy, robotics and biotechnology. Findings are due Jan 28, 2027, with
      a public unclassified report and a classified annex.
    source: The Next Web
    url: https://thenextweb.com/news/pentagon-project-meridian-musk-luckey-gingrich
  - section: World News
    title: US orders Iran's UN delegation out as Qatar-mediated talks stall
    body: >-
      Secretary of State Marco Rubio told Iran's delegation, led by Foreign
      Minister Abbas Araghchi, to leave New York after the US rejected Iranian
      demands to change the format and location of upcoming talks. The
      delegation flew to Doha Tuesday; Iran says the trip was planned weeks
      earlier and denies an expulsion. Iran has since received a US reply to
      its ceasefire proposal, and the sides agree on the needed steps but not
      their order. Qatari mediators are still pushing compromises.
    source: The Media Line
    url: https://themedialine.org/headlines/rubio-orders-iranian-un-delegation-to-leave-us-after-talks-stall/
  - section: World News
    title: Russia warns NATO of nuclear response over any Kaliningrad cutoff
    body: >-
      Moscow said it could use nuclear weapons if NATO tried to cut off the
      Kaliningrad enclave. Separately, Ukraine is giving the Trump
      administration and Congress a list of Russian companies it wants
      sanctioned under the new Graham sanctions act, topped by makers of
      components for a Russian Starlink equivalent. President Zelenskyy
      visited a command post near Lyman and praised gains in a counteroffensive.
    source: Just Security
    url: https://www.justsecurity.org/159415/early-edition-october-1-2026/
