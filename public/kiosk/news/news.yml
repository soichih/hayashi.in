  - section: US News
    title: Jensen Huang resigns as Nvidia CEO; CFO Colette Kress takes over on an interim basis
    body: >-
      Nvidia said Nov. 12 that Huang resigned as president, CEO and board member, effective immediately, days after the board opened an investigation into his relationship with an executive at a Chinese AI company suspected by the Trump administration of passing information to China. The espionage claims are unverified.

      Kress, the chief financial officer, will serve as interim CEO while the board searches inside and outside the company. Harvey Jones becomes the board's first chair. Nvidia says operations and its product roadmap will continue uninterrupted, and it still plans to report quarterly results on Tuesday, Nov. 17.
    source: Nvidia SEC filing
    url: https://www.sec.gov/Archives/edgar/data/0001045810/000104581026000082/nvidiaannouncesceotransiti.htm
  - section: US News
    title: Supreme Court lets Big Bend border wall construction resume
    body: >-
      In an unsigned opinion on Nov. 9, the Court paused a federal judge's order that had halted wall construction in West Texas's Big Bend region while the case continues. The justices said the government is exceedingly likely to prevail on the argument that the judge could not weigh the challengers' major-questions claim. Justice Ketanji Brown Jackson would have denied the request.

      Opponents include environmental groups and Republican Sen. John Cornyn. The administration says the wall is needed to stop cartel activity, and says no steel walls are planned inside Big Bend National Park.
    source: SCOTUSblog
    url: https://www.scotusblog.com/2026/11/supreme-court-allows-trump-administration-to-continue-border-wall-construction/
