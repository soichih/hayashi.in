  - section: Local News
    title: Temporary all-way stop starts Monday at Second and Walker
    body: >-
      The stop goes in Nov. 9 and stays about 30 days while crews prepare a new traffic signal as part of the Second Street Improvement Project. Eastbound traffic is already detoured to First Street.
