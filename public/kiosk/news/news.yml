  - section: Local News
    title: Council votes tonight on dispatch tax increase
    body: >-
      The Bloomington City Council holds a hearing and vote on raising the dispatch share of the public safety income tax from 0.0631% to 0.1%. That would lift the county's total local income tax rate from 2.14% to 2.2419% in 2027, about $50.95 more a year on $50,000 of taxable income, of which $18.45 is the dispatch part. Supporters say it closes a gap of roughly $1.57 million between 2026 dispatch costs and tax revenue without tapping about $3.2 million in reserves. Nine votes in favor would adopt it.
    when: Mon Oct 26, 6:30pm
    where: City Hall, McCloskey Conference Room
    source: The B Square Bulletin
    url: https://bsquarebulletin.com/raise-taxes-or-tap-reserves-bloomington-council-weighs-911-dispatch-funding-gap-on-monday/
  - section: Local News
    title: Health department stays closed to walk-ins as interim officer awaits approval
    body: >-
      Morgan County health officer Paul Broderick was chosen unanimously by the Monroe County Board of Health on Oct. 22 as interim health officer after Dr. Sarah Ryterband resigned. The county commissioners and the Morgan County board must still approve. Until then, permits, birth and death certificates, and STI testing and treatment are suspended, and there is no date for walk-ins to resume. Other services are by appointment at 812-349-2543.
    source: The B Square Bulletin
    url: https://bsquarebulletin.com/monroe-county-health-department-stays-closed-to-walk-ins-monday-as-interim-officer-awaits-final-ok/
  - section: Local News
    title: Mother jailed in Bloomington case of 14-year-old's death
    body: >-
      A 32-year-old woman was booked into the Monroe County Jail Saturday evening on a felony neglect of a dependent warrant, with bond set at $250,000. The girl's father was booked Oct. 20 on a similar warrant. A probable cause affidavit alleges months of restricted food and confinement before the girl died July 2, 2025. Both defendants are presumed innocent.
    source: The Bloomingtonian
    url: https://bloomingtonian.com/2026/10/25/toris-mayfield-jailed-on-neglect-warrant-in-14-year-old-daughters-death/
