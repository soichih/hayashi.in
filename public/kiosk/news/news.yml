  - section: AI News
    title: OpenAI launches GPT-6 Sol and Luna
    body: >-
      The new models cost half as much as the 5.6 series. Sol handles
      complex work such as coding, and Luna handles clerical tasks like
      summarizing. OpenAI says Sol makes about half as many factual mistakes
      as its predecessor. They are rolling out in ChatGPT Work, Codex and the
      API, with Luna free for Free and Go users. Anthropic released Opus 5.5
      about 90 minutes earlier.
    source: TechCrunch
    url: https://techcrunch.com/2026/09/22/openai-launches-gpt-6-sol-and-luna/
