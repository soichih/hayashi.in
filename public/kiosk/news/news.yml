    title: Democrats win sweeping midterm victory, ending unified Republican control
    body: >-
      NPR calls it a historic night for Democrats, who will be in the majority and plan a long list of investigations of the Trump administration. Senate Democratic leader Chuck Schumer called the result a generational remake of the Senate, and Hakeem Jeffries is poised to become the first Black House speaker.

