  - section: Local News
    title: Bloomington Transit warns of cuts if $3.8 million in tax support ends
    body: >-
      The transit board says service and staffing could be reduced if the city's $3.8 million a year in local income tax support is not preserved under Indiana's revised tax system, which takes effect in 2029. About $1.1 million pays for operations, including Sunday service, microtransit and two staff positions; the rest goes to capital costs such as fleet upgrades. Agency representatives made their case Friday to the county's Municipal Unit Strategic Task Force. No specific cuts or replacement funding have been named.
    source: The Bloomingtonian
    url: https://bloomingtonian.com/2026/10/26/bloomington-transit-warns-of-possible-cuts-if-3-8-million-in-tax-support-is-not-preserved/
  - section: Local News
    title: IU Health urges planning as Halloween and game day collide Saturday
    body: >-
      With Halloween and an IU home game on the same day, Oct. 31, IU Health's Dr. Robert Adams advises drivers to watch for people stepping into streets and pedestrians to use crosswalks. Groups should agree on a meeting spot, anyone drinking should arrange a designated driver, and trick-or-treaters should carry reflective tape or glow sticks and a contact card.
    source: The Bloomingtonian
    url: https://bloomingtonian.com/2026/10/26/iu-health-urges-safety-as-halloween-iu-football-festivities-coincide-saturday/
  - section: Local News
    title: Health department stays closed to walk-ins as interim officer awaits approval
    body: >-
      The Monroe County Health Department remained closed to walk-ins Monday while the interim health officer appointment moves through approvals. Permits, birth and death certificates, and STI testing and treatment are suspended, and there is no date for walk-ins to resume. Other services are by appointment at 812-349-2543.
    source: The Bloomingtonian
    url: https://bloomingtonian.com/2026/10/26/monroe-county-health-department-remains-closed-to-walk-ins-monday-as-interim-appointment-proceeds/
