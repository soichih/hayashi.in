  - section: Local News
    title: Democrats sweep contested Monroe County races
    body: >-
      In unofficial results with 30 of 31 polling places reporting and 47% turnout, Democrat Tree Martin Lucas leads Republican Julie Hays 69.8% to 30.2% for county clerk. Democrat Judith Sharp leads independent Jenee Trimble 75.6% to 24.5% for assessor. In the 9th District US House race, Democrat Brad Meyer carried the county with 70.9% to Republican Erin Houchin's 27.3%.

      Locally, voters rejected Public Question 1 on denying bail to some defendants, 59% to 41%, and approved Public Question 2 on city and town judge residency, 55% to 45%. The county totals don't show how the statewide amendments fared. The tightest local contests were the Richland school board, where Dennis Adams leads by 77 votes, and the Clear Creek Township trustee race, where Democrat Susan Luther leads by 71.
    source: The Bloomingtonian
    url: https://bloomingtonian.com/2026/11/04/democrats-lead-monroe-county-races/
  - section: Local News
    title: Ellettsville-Richland merger passes by 35 votes outside town limits
    body: >-
      Countywide the reorganization passed 3,007 to 2,480, but Indiana law requires a majority both inside and outside the town. Inside Ellettsville it passed 1,493 to 1,001; outside, 1,514 to 1,479. The plan folds Richland Township government into a larger Town of Ellettsville of about 35 square miles on Jan. 1, 2027.

      A recount isn't automatic. A voter would need petition signatures equal to 10% of voters on the question, 300 to 549 depending on how the district is defined, plus a $100 deposit, filed by noon Tuesday, Nov. 17.
    source: The B Square Bulletin
    url: https://bsquarebulletin.com/ellettsville-richland-township-reorganization-passes-by-narrow-margin-outside-town-limits/
    image: img/ellettsville-vote.jpg
    image_credit: The B Square Bulletin
