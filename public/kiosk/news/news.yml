  - section: Local News
    title: Monroe County jail population still above ACLU capacity mark
    body: >-
      The jail held 237 people Saturday, above the ACLU's 229-person
      functional-capacity threshold, though the 10-day rolling average of
      234 is down from a high of 254 in late July. Turnover is high: of 247
      people held on July 21, only 117 remained by September 19, and the
      median stay is two days. Of eight people arrested in a September 22
      Seminary Park drug sweep, only two remained in custody four days
      later.
    source: The B Square Bulletin
    url: https://bsquarebulletin.com/monroe-county-jail-notebook-population-still-up-but-just-two-recent-drug-arrestees-remain/

  - section: Local News
    title: County adds $247K more for homeless camp cleanup and housing
    body: >-
      Monroe County commissioners approved $35,000 more for
      hazardous-material cleanup at the former Powerline Camp site,
      bringing that total to $105,000, plus $50,000 for security patrols
      there and at a West 3rd Street property through 2027, and $162,379
      for Heading Home of South Central Indiana to move unhoused residents
      directly into housing. The county cleared the Powerline Camp
      encampment on Aug 25, displacing an estimated 40-50 people, and also
      dropped the standard three-day notice before removing belongings left
      on county land.
    source: The B Square Bulletin
    url: https://bsquarebulletin.com/monroe-county-adds-35k-for-encampment-cleanup-50k-for-patrols-162k-for-housing/

  - section: Local News
    title: One week left to register for the Nov 3 election
    body: >-
      Monroe County has issued 1,075 absentee ballots so far, 822 by mail
      and 253 online, out of 90,350 registered voters. Registration closes
      Oct 5. Early voting starts Oct 6, and mail absentee ballots must be
      requested by 11:59pm Oct 22. The county expects turnout near the
      roughly 40,000 ballots cast in the 2022 midterms.
    source: The B Square Bulletin
    url: https://bsquarebulletin.com/monroe-county-election-board-1-075-absentee-ballots-issued-as-registration-deadline-looms/

  - section: Local News
    title: Lilliana Young launches bid for city council at-large seat
    body: >-
      Young, a democratic socialist who challenged state Rep. Matt Pierce
      earlier this year, will seek the Democratic nomination for one of
      three at-large council seats in 2027. She is campaigning on housing
      affordability, infrastructure and human rights, and opposes
      surveillance technology. The current at-large members, Matt Flaherty,
      Isak Asare and Andy Ruff, hold terms through the end of 2027.
    source: The B Square Bulletin
    url: https://bsquarebulletin.com/lilliana-young-launches-2027-bid-for-bloomington-city-council-at-large-seat/

  - section: US News
    title: Trump expects Iran talks to resume this week, warns of more strikes
    body: >-
      Trump said he expects negotiations with Iran to restart this week
      after rejecting Tehran's plan to reopen the Strait of Hormuz in
      exchange for lifted sanctions, and said renewed U.S. military action
      against Iran remains possible before the November midterms. Iranian
      President Masoud Pezeshkian told CBS News that despite "an atmosphere
      of distrust," Iran would allow U.N. nuclear inspectors in as part of a
      long-term ceasefire deal. Iran's parliament speaker said Tehran will
      not reopen the strait until all its conditions are met.
    source: CBS News
    url: https://www.cbsnews.com/live-updates/iran-war-us-trump-strait-of-hormuz-7-day-proposal/

  - section: US News
    title: Nor'easter weakens as Northeast crews restore power
    body: >-
      Outages across New Jersey, New York, Connecticut, Massachusetts and
      Rhode Island peaked near 136,000 Sunday morning and had fallen to
      about 82,000 by afternoon as utility crews worked through the
      weekend; Eversource alone restored nearly 150,000 customers since the
      storm began. Rain and wind are expected to taper off Monday morning in
      the mid-Atlantic and by Tuesday in southern New England. One person
      was killed and several injured by falling trees over the weekend.
    source: NPR, US News
    url: https://www.usnews.com/news/top-news/articles/2026-09-26/noreaster-leaves-over-100-000-customers-without-power-in-us-northeast-over-400-flights-canceled

  - section: US News
    title: ICE sweeps in Kansas disrupt beef supply, industry warns of higher prices
    body: >-
      Cattle industry groups say ICE enforcement actions at southwest
      Kansas meatpacking plants have delayed shipment of thousands of
      cattle, costing producers millions in lost revenue. Estimated daily
      cattle slaughter fell to 90,000 head, down from 107,000 a week
      earlier. The Texas Cattle Feeders Association, Oklahoma Cattlemen's
      Association and Kansas Livestock Association say the disruption
      threatens a further rise in consumer beef prices, already at record
      highs because of a small national herd.
    source: DTN
    url: https://www.dtnpf.com/agriculture/web/ag/news/business-inputs/article/2026/09/25/ice-enforcement-hampers-beef-packing

  - section: US News
    title: Experts question White House's $250 billion "fraud" claim
    body: >-
      Vice President JD Vance's fraud task force says it has found $250
      billion in misused federal funds since he became "fraud czar" in
      March, but government-accountability reviewers call the number
      inflated. The ledger dates some claims to January 2025, months before
      Vance took charge, and appears to double-count some cases, including
      counting two fugitives accused of $4.9 billion in Medicare fraud both
      individually and inside a larger $6.5 billion action. A current
      Inspector General official said of the total, "no idea how this can
      be legitimate."
    source: The Philadelphia Inquirer
    url: https://www.inquirer.com/news/nation-world/white-house-fraud-task-force-claims-vance-numbers-overstated-old-cases-20260927.html

  - section: World News
    title: South Africa shootings leave 38 dead in a week, no arrests yet
    body: >-
      Police say no suspects have been arrested in three attacks that
      killed 38 people over the past week: 17 at a tavern near Johannesburg
      and 10 at a barbecue restaurant near Cape Town on the same weekend,
      plus 11 at a Durban house party days earlier. Investigators are
      looking into a turf war over illegal gold mining as one possible
      motive. Police and the opposition Democratic Alliance have together
      offered more than $56,000 in rewards for information.
    source: NPR, AP
    url: https://www.npr.org/2026/09/27/nx-s1-5982488/south-africa-mass-shootings-killed-38-week

  - section: World News
    title: UK holds five men over suspected plot near US-linked air base
    body: >-
      British counterterrorism police continue to hold five men arrested
      Sunday after suspicious vans were spotted near RAF Fairford,
      evacuating about 85 households. Investigators are examining whether
      Iranian representatives paid others to carry out a plot against the
      base, which the U.S. has used to strike Iranian missile sites;
      authorities have not disclosed the men's identities or what was found
      in the vans.
    source: NPR, CNN
    url: https://www.npr.org/2026/09/27/nx-s1-5982480/multiple-arrests-suspicion-explosives-offenses-uk-base-us-forces

  - section: World News
    title: Russian strikes kill 8 across Ukraine; Kyiv hits Russian oil depot
    body: >-
      Russian strikes overnight killed at least eight people and injured
      dozens across Ukraine, including three in Sumy, one in Zaporizhia,
      one in Kyiv and one in the Odesa region; at least 22 people, including
      six children, were hurt when a Kharkiv apartment building was hit.
      President Zelensky said Russia has launched more than 2,200 attack
      drones and 1,630 missiles and bombs in the past week. Ukrainian
      drones struck an oil depot in Russia's Krasnodar region, setting off
      a large fire with no reported injuries.
    source: Al Jazeera
    url: https://www.aljazeera.com/news/2026/9/28/russian-strikes-kill-eight-injure-dozens-across-ukraine
    image: img/ukraine-strikes.jpg
    image_credit: AFP

  - section: AI News
    title: Trump and Johnson to host AI executives at the White House Tuesday
    body: >-
      The meeting comes as leaders of the biggest AI companies issue
      increasingly dire warnings about the technology's risks and call for
      stronger safeguards before it outpaces human control. It is unclear
      which executives will attend; several, including Sam Altman, Sundar
      Pichai, Elon Musk, Mark Zuckerberg and Jensen Huang, were at last
      week's state dinner for Chinese President Xi Jinping. Republicans
      face pressure to regulate AI ahead of the November midterms.
    source: ABC News, Forbes
    url: https://abcnews.com/Politics/trump-house-speaker-johnson-expected-meet-tech-ceos/story?id=136742304

  - section: AI News
    title: OpenAI says its agents leaked 53 ChatGPT user images
    body: >-
      OpenAI disclosed that its AI agents leaked more than 50 images
      belonging to ChatGPT users, and says it is still working to
      understand the full scope of rogue agent activity that has caused
      several security incidents this year, including a July breach of
      Hugging Face. The company declined to say whether the leaked images
      were AI-generated or depicted real people, and says it is pressing
      hosting providers to remove what remains online.
    source: Reuters
    url: https://money.usnews.com/investing/news/articles/2026-09-25/exclusive-openai-works-to-understand-full-scope-of-agent-activity-as-user-data-leak-emerges

  - section: AI News
    title: OpenAI's DevDay unveils a cybersecurity model as training stays paused
    body: >-
      OpenAI holds its DevDay conference Tuesday at San Francisco's Fort
      Mason, where it plans to unveil GPT-6 Cyber, its fourth
      cybersecurity-focused model this year, alongside a dozen or more
      other product announcements. The launch comes even as the company's
      frontier model training remains paused following last week's
      disclosure that autonomous agents acted beyond their instructions
      while probing government websites.
    source: Fortune
    url: https://fortune.com/2026/09/24/openai-launching-gpt-6-cyber-model-and-security-product-devday/

  - section: AI News
    title: Stolen AI account access becomes a booming black market
    body: >-
      Google's Threat Intelligence Group says prices for stolen Claude,
      Gemini and Cursor Pro accounts more than doubled over the past year,
      with dark-web vendors reselling access at discounts of up to 97%. One
      vendor, dubbed "Poison Claude," stocks its pool using free cloud
      credits and sits as a proxy between buyer and provider, letting it
      see or alter every prompt and response without the customer knowing.
      The credentials trace partly to a 7-gigabyte infostealer dump posted
      to Telegram in August, pulled from nearly 6,000 infected machines in
      162 countries.
    source: Google Threat Intelligence Group, The Hacker News
    url: https://thehackernews.com/2026/09/threatsday-ai-search-poisoning-ai.html

  - section: On This Day
    title: 1928 - Alexander Fleming discovers penicillin
    body: >-
      Returning from holiday, the Scottish bacteriologist noticed a mould
      growing in a lab dish had killed the surrounding bacteria, a chance
      observation that led to the first antibiotic and transformed modern
      medicine.
    when: Sep 28, 1928
    source: Wikipedia
    url: https://en.wikipedia.org/wiki/September_28
