  - section: US News
    title: Six presumed dead after medical jet crashes off Nantucket
    body: >-
      The Coast Guard suspended its search for the Boston-bound air ambulance,
      which left Bermuda late Friday with four Canadian crew members, a patient
      and the patient's family escort. The pilot reported electrical problems
      and declared an emergency after the plane fell about 13,000 feet in two
      minutes. Debris was found off Nantucket, and the operator says no one is
      likely to have survived.
    source: Boston Globe
    url: https://www.bostonglobe.com/2026/10/03/metro/debris-found-medical-plane-boston/

  - section: US News
    title: Nobel physics prize goes to IceCube neutrino pioneer Francis Halzen
    body: >-
      The Belgian-American physicist was honored for his decisive contributions
      to the IceCube Neutrino Observatory and the discovery of high-energy
      neutrinos of astrophysical origin. IceCube turned a cubic kilometer of
      South Pole ice into a neutrino telescope and made the first detection in
      2013. The prize is worth 12 million Swedish crowns and will be presented
      in Stockholm on December 10.
    source: Physics World
    url: https://physicsworld.com/a/francis-halzen-wins-nobel-prize-in-physics/

