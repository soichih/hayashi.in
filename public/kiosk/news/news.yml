  - section: Local News
    title: Transit board chair's Florida vote draws mayor's scrutiny of his eligibility
    body: >-
      Bloomington Transit board chair James McLary voted in Florida's Nov. 3 election, and Florida property records show homestead tax benefits. Mayor Kerry Thomson says that, if accurate, the records present a conflict with board membership.

      The board has postponed its vote on cutting four bus routes to Dec. 8.
    source: The B Square Bulletin
    url: https://bsquarebulletin.com/bloomington-transit-board-chairs-florida-vote-raises-new-questions-about-residency-eligibility-to-serve/
  - section: Local News
    title: Mayor's refusal to sign superintelligence ban sets up Dec. 2 override vote
    body: >-
      Mayor Kerry Thomson said she will not sign Ordinance 2026-29, which the City Council passed 7-0 on Nov. 4, citing enforcement, the city's legal authority, privacy and the local innovation economy. Under Indiana law, an unsigned ordinance counts as vetoed.

      The council could attempt an override at its Dec. 2 meeting at 6:30pm; it takes six of nine votes. Sponsor Dave Rollo says he would rather work with the mayor on a revised version than force an override.
    source: The B Square Bulletin
    url: https://bsquarebulletin.com/bloomington-mayor-vetoes-ai-superintelligence-ban-citing-research-enforcement-and-surveillance-concerns/
  - section: Local News
    title: Council voted 6-3 for 2.7% raises; 8-1 to loosen housing rules
    body: >-
      The raises for the mayor, clerk and council members take effect in 2027; two alternatives failed, leaving the broader pay question unresolved before the 2027 election.

      On housing, the council loosened rules for accessory dwelling units, cottage developments, triplexes and fourplexes, but kept the annual cap and spacing limits on duplexes in some neighborhoods.
    source: The B Square Bulletin
    url: https://bsquarebulletin.com/bloomington-council-eases-housing-rules-but-keeps-limits-on-duplexes/
