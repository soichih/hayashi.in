    title: Google unveils Gemini 4 Carbon, limited to vetted cyber defenders
    body: >-
      Google says Carbon ranks first on the Artificial Analysis Intelligence Index with 59 points, one ahead of Claude Opus 5.5. Access is restricted to selected defenders through its Fairwind program; there is no public date. Most figures are Google's own tests and have not been independently reproduced.
