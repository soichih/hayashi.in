  - section: Local News
    title: Hilly Hundred puts thousands of cyclists on county roads
    body: >-
      The first riders leave around 7am Saturday, passing Lake Lemon, Chambers Pike and Hindustan; Sunday's route covers eastern and southern Monroe County. Expect slowdowns at intersections where traffic control stops cars to let big groups cross. County Highway Director Lisa Ridge asks drivers to stay off their phones and make sure it is clear before passing.
