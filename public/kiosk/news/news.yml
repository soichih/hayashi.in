    title: Flydubai copilot had been banned from flying by Oman over radicalization concerns
    body: >-
      Reports citing the Wall Street Journal say the copilot who tried to crash a Dubai-Tel Aviv flight earlier this week was barred from flying by Oman over suspected radicalization. An Arkia flight carrying stranded Israelis left Dubai for Tel Aviv on Friday, the first since the attack, with more flights planned for the weekend.
