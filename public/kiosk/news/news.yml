  - section: Local Events
    title: Waitress wraps its 10th anniversary tour tonight and Wednesday
    body: >-
      Broadway musical with music and lyrics by Sara Bareilles, about a
      small-town waitress and pie-maker who sees a baking contest as a way
      to start over. Final two performances of the run, both at 7:30pm,
      running about 2 hours 35 minutes with intermission; recommended for
      ages 13+. A pre-show talk by theatre professor Rich Roland precedes
      both performances, 6:30-7:15pm.
