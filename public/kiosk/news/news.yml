    title: Griffy Lake closed this weekend and next for deer hunts
    body: >-
      Controlled hunts run Nov. 14-15 and Nov. 21-22. All trails, shoreline and the lake are closed until 5am Monday, Nov. 16, and again from 11pm Friday, Nov. 20 to 5am Monday, Nov. 23. No watercraft may launch either weekend.
    source: City of Bloomington
    url: https://bloomington.in.gov/news/2026/11/04/6687
  - section: Local News
    title: Street resurfacing starts Monday on Kirkwood, Rogers, Grimes and Patterson
    body: >-
      The two-week project begins Nov. 16 and could run past Thanksgiving week if weather interferes. Patterson Drive is fully closed between Second and Third streets from Nov. 16 through Nov. 18. Elsewhere expect lane restrictions, flaggers and delays.

      Work goes Kirkwood between Maple and Rogers first, then Rogers between Second and Third, Rogers between First and Patterson, and finally Grimes Lane and Patterson from Walnut to Third.
    source: City of Bloomington
    url: https://bloomington.in.gov/news/2026/11/12/6696
  - section: Local News
    title: Bloomington Transit hearing on four-route cuts is Tuesday
    body: >-
      The proposal would remove about 237 driver hours a week from Dec. 6 through May 2027 because of a driver shortage. Routes 2 West and 2 South would merge into one hourly weekday route, Route 11 loses weekend service, and Route 16 drops from three buses to two.

      The hearing is 4:30-5:30pm at the downtown Transit Center, with a final vote expected that day. Comments are open through Dec. 5.
    when: Tue Nov 17, 4:30pm
    where: Downtown Transit Center
    source: The B Square Bulletin
    url: https://bsquarebulletin.com/possible-bus-service-cuts-bloomington-transit-board-sets-public-hearing/
  - section: Local News
    title: Ellettsville-Richland merger recount deadline is Tuesday
    body: >-
      The merger passed 1,493 to 1,001 inside Ellettsville and 1,514 to 1,479 outside, a 35-vote margin where Indiana law requires a majority in both areas. A recount needs petition signatures from 10% of voters on the question plus a $100 deposit, filed by noon Nov. 17. Otherwise Richland Township government folds into the Town of Ellettsville on Jan. 1, 2027.
    source: The B Square Bulletin
    url: https://bsquarebulletin.com/ellettsville-richland-township-reorganization-passes-by-narrow-margin-outside-town-limits/
