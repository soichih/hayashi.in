  - section: Local News
    title: Council to hear proposed ban on superintelligent AI in Bloomington
    body: >-
      Councilmember Dave Rollo's ordinance would bar deploying superintelligent AI systems within city limits, including access through a local browser or API, with fines up to $2,500 and possible daily penalties. It is introduced Wednesday, Oct. 14, with no vote; final action could come Nov. 4.


      The ordinance sets no test for what counts as superintelligence. Analysis raises questions about whether a city can regulate technology hosted elsewhere, and notes that lifting the ban would require approval from over 95% of registered voters, which Indiana law may not allow.
    source: The B Square Bulletin
    url: https://bsquarebulletin.com/analysis-bloomingtons-proposed-superintelligence-ban-raises-questions-about-authority-enforcement/
    image: img/rollo-superintelligence.jpg
    image_credit: The B Square Bulletin
  - section: Local News
    title: Council trims 2027 budget; final vote Wednesday
    body: >-
      Bloomington's council rejected a proposed $2.5 million general fund cut 2-5, but amendments removed more than $6 million in appropriations. They include $3 million withheld from the housing development fund and $2.5 million in parking improvements; both can be restored later with a new appropriation. The sanitation transfer drops $600,000, which assumes higher trash cart fees not yet approved. The final budget vote is Oct. 14.
    source: The B Square Bulletin
    url: https://bsquarebulletin.com/2027-budget-bloomington-council-rejects-2-5m-general-fund-cut-still-withholds-millions-for-housing-parking-projects/
