    body: >-
      JPMorgan and Schwab have blocked agents, and Citigroup and Bank of America have restricted them. Schwab's CEO said agents try to log in 30 to 50 times a week. Wells Fargo's rule treating agent orders as the customer's own takes effect Nov. 24. Who bears liability for agent errors is unresolved.
