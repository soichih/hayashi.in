    title: Indiana measles cases reach 86 in 12 counties; none in Monroe
    body: >-
      The state health department's Oct. 29 update counts 86 cases this year, with LaGrange (20), Wayne (15), Adams (13) and Miami (10) counties hardest hit. Figures are provisional. The department says two doses of MMR vaccine are the best protection, and anyone who suspects measles should call a provider before going in.
    source: The Bloomingtonian
    url: https://bloomingtonian.com/2026/10/29/indiana-reports-86-measles-cases-across-12-counties-in-2026-none-listed-in-monroe-county/
