  - section: Local News
    title: County inspector visits Bryan Street deck collapse site Wednesday
    body: >-
      A deck pulled away from a rental home on North Bryan Street at about 10:29pm Friday, and at least five people were taken to IU Health Bloomington. A city housing compliance officer ordered a porch railing where the deck separated; property management said it was being installed Monday.

      The city does not investigate the cause and has no deck-specific code enforcement, but says the collapse may prompt a review of added safety standards.
    source: The Bloomingtonian
    url: https://bloomingtonian.com/2026/10/20/city-calls-for-porch-railing-after-bryan-street-deck-collapse-at-least-five-transported-to-hospital/
  - section: Local News
    title: Second Street goes one-way westbound today
    body: >-
      Starting Oct. 21, eastbound Second Street is closed and the street is open to westbound traffic only, with eastbound drivers detoured to First Street. Crews are replacing asphalt, adding stormwater infrastructure and paving the south side. Two-way traffic is scheduled to return before Thanksgiving, weather permitting.
    source: City of Bloomington
    url: https://bloomington.in.gov/news/2026/10/14/6677
  - section: Local News
    title: City shifts $20,000 of stormwater grants to household projects
    body: >-
      The Utilities Service Board moved $20,000 of the roughly $100,000 annual grant pool to the economic and sustainable development department for smaller projects such as rain gardens. About $80,000 stays with Utilities for larger work, including neglected detention ponds.

      Inspections have found some private ponds silted or deteriorated so they no longer work as designed. Maintenance falls on owners such as apartment complexes, businesses and homeowners associations. The city is considering requiring cost sharing for future grants.
    source: The Bloomingtonian
    url: https://bloomingtonian.com/2026/10/20/bloomington-shifts-stormwater-grants-as-inspections-expose-neglected-private-ponds/
  - section: Local News
    title: Monroe County cited over chemical safety at Justice Building
    body: >-
      Indiana's workplace safety agency issued a serious citation Oct. 15 because the county had no written hazard-communication program for employees handling hazardous chemicals, including a corrosive drain cleaner. The proposed $3,000 penalty is deferred for public entities while the agency awaits proof of correction. The county has until Nov. 12 to fix the problem and document it.
    source: The Bloomingtonian
    url: https://bloomingtonian.com/2026/10/20/monroe-county-cited-for-serious-chemical-safety-violation-at-justice-building/
  - section: Local News
    title: Bird flu found in wild ducks in Greene County
    body: >-
      Indiana DNR says highly pathogenic avian influenza was confirmed in wild blue-winged teal in Greene County, and has killed geese in Hamilton County. The CDC rates the public risk as low. Report sick or dead waterfowl at on.IN.gov/sickwildlife and avoid touching them. Hunters should cook waterfowl to 165 degrees.
    source: The Bloomingtonian
    url: https://bloomingtonian.com/2026/10/20/bird-flu-detected-in-wild-ducks-in-greene-county-geese-in-hamilton-county/
  - section: Local News
    title: City proposes $6.87 million bond for aerial fire truck and street safety
    body: >-
      The package includes $2.5 million to replace the city's only aerial platform truck, out of service for more than four months, and $4.23 million for transportation, including $1.7 million for 10th Street between College and Park and $1.5 million for 3rd Street safety.

      Repayment would take a little over six years and cost about $33.70 a year per $100,000 of taxable assessed value, before credits. The council holds a public hearing and possible final vote Nov. 4.
    source: The B Square Bulletin
    url: https://bsquarebulletin.com/bloomington-proposes-6-87m-bond-issue-for-fire-truck-street-safety-plans-for-regular-borrowing/
