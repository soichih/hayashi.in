    title: City council votes tonight on duplex zoning and $6.87 million bond
    body: >-
      The council's Nov. 4 agenda includes loosening development standards for duplexes and cottage developments and updating accessory dwelling unit rules, which it can enact in one meeting by simple majority. It also takes final votes on bonds: $2.5 million to replace the only aerial platform fire truck, out of service for over four months, and $4.23 million for transportation work including 10th Street and 3rd Street safety.
    when: Wed Nov 4
    source: The B Square Bulletin
    url: https://bsquarebulletin.com/bloomington-reviews-housing-barriers-under-new-state-law-more-zoning-changes-on-council-agenda/
  - section: Local News
    title: FBI and ATF join Kirkwood shooting investigation; one victim still hospitalized
    body: >-
      Federal agents are helping Bloomington police collect evidence and witness statements and process seized firearms and shell casings. One 27-year-old man remains hospitalized in stable condition. The seven victims, ages 17 to 27, were shot around 1:30am Sunday in the 400 block of East Kirkwood Avenue; police say none were believed to be IU students.

      An 18-year-old Indianapolis man seen running from the scene is jailed on preliminary allegations of resisting law enforcement and unlawful gun possession. Police don't know how many people fired. Anyone with information can call Detective Chris Scott at 812-339-4477.
    source: The Bloomingtonian
    url: https://bloomingtonian.com/2026/11/02/fbi-atf-join-investigation-into-kirkwood-shooting-1-remains-hospitalized/
