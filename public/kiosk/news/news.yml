  - section: Local News
    title: Monroe County health officer resigns; walk-in services suspended
    body: >-
      Dr. Sarah Ryterband resigned effective immediately Thursday during the Board of Health meeting; the county gave no reason. The Health Department closed walk-in services Friday. Until an interim health officer is appointed, it cannot issue permits or birth and death certificates or provide STI testing and treatment, and some interruptions will extend beyond Friday. No timeline was given. Residents needing other services can call 812-349-2543 for an appointment.
    source: The Bloomingtonian
    url: https://bloomingtonian.com/2026/10/22/monroe-county-health-officer-resigns-effective-immediately-health-department-suspends-walk-in-services-friday/
  - section: Local News
    title: Georgetown officer arrested over alleged misuse of Flock camera database
    body: >-
      Indiana State Police arrested Georgetown officer Justin Craig Thursday on one Level 6 felony count of official misconduct and two misdemeanor fraud counts. He is accused of making many unauthorized searches of the department's Flock license plate reader system in 2026, citing offenses for which investigators found no matching cases. Police have not said whose plates were searched. The article counts at least eight Indiana officers publicly identified in Flock misuse cases this year. He is presumed innocent.
    source: The Bloomingtonian
    url: https://bloomingtonian.com/2026/10/22/georgetown-police-officer-arrested-accused-of-improperly-searching-flock-surveillance-camera-database/
  - section: Local News
    title: Federal judge bars state investigator from threatening Bloomington man over "86" post
    body: >-
      U.S. District Judge Sarah Evans Barker issued a preliminary injunction Oct. 20 in a suit by Bloomington resident Lee Lawmaster against Kurt Spivey, director of investigations for the Indiana Attorney General's office. Spivey may not coerce or threaten legal sanctions to suppress Lawmaster's past or future political posts, including those using the "86" phrase. The case continues, and the order does not stop the office from assessing reported threats.
    source: The Bloomingtonian
    url: https://bloomingtonian.com/2026/10/22/federal-judge-blocks-indiana-attorney-general-investigator-from-threatening-bloomington-man-over-political-posts/
