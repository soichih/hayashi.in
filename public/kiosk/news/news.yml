    title: Israel's partial count shows no majority as soldiers' votes remain
    body: >-
      With about 77% of ballots counted, Netanyahu's bloc has 54 seats and Eisenkot's bloc 47, with Arab-led parties at a combined 19. Neither side reaches the 61 needed. Roughly 600,000 double-envelope votes, mostly soldiers', are still being tallied and could shift the result, with counting expected to run until Friday.

      Joint List chair Yousef Jabareen says any party seeking to replace Netanyahu will have to engage his faction. Markets fell, with the Tel Aviv benchmark down about 1.7%.
    source: Times of Israel
