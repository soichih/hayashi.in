    title: Bloomington Transit warns of cuts if $3.8 million in tax support ends
    body: >-
      The transit board says service and staffing could be reduced if the city's $3.8 million a year in local income tax support is not preserved under Indiana's revised tax system, which takes effect in 2029. About $1.1 million pays for operations, including Sunday service, microtransit and two staff positions; the rest goes to capital costs such as fleet upgrades. No specific cuts or replacement funding have been named.
