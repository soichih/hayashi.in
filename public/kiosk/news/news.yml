  - section: Local News
    title: Five of seven council members oppose the 2027 budget as written
    body: >-
      Five council members voted against recommending the $171 million
      civil city budget ordinance, which raises the property tax levy from
      $46.1 million to $49.5 million and includes a 2.7% raise for civil
      employees and 3% for police, fire and union workers. Isak Nti Asare
      is preparing amendments to cut about $7 million, including a 25% cut
      to non-required travel. The B Square Bulletin found that the cuts in
      the current package save only about $452,000 in actual policy
      changes. The transit corporation's capital budget, nearly doubling to
      $37.6 million, won unanimous support. The council meets tonight for a
      work session and votes on final adoption Oct 7.
    when: Work session Wed Sep 30; final vote Wed Oct 7
    source: Indiana Daily Student, The B Square Bulletin
    url: https://www.idsnews.com/article/2026/09/bloomington-city-council-proposed-2027-budget-employee-salary

  - section: Local News
    title: Bloomington parks eyes $10 million Lilly-backed grant
    body: >-
      A new Lilly Endowment-backed state initiative could make the city
      eligible for up to $10 million toward parks projects, on top of about
      $7 million already planned in bonds. Priorities include a Bryan Park
      Pool renovation, an inclusive playground at Olcott Park, pickleball
      courts at RCA Community Park and trail repairs. The city must apply
      for a $200,000 planning grant by the end of October to compete for
      the larger implementation grant.
    source: The B Square Bulletin, The Bloomingtonian
    url: https://bsquarebulletin.com/new-grant-opportunity-with-10m-in-play-could-reshape-bloomington-parks-capital-plan/

  - section: Local News
    title: State picks three Bloomington census tracts for Opportunity Zone push
    body: >-
      Indiana selected the Trades District's west side, the former Hopewell
      hospital campus, and Seminary Park - the area linking downtown,
      Switchyard Park and the B-Line Trail - for nomination as federal
      Opportunity Zones. The designation uses tax incentives to draw private
      investment. If approved, the zones would open to investment starting
      Jan 1, 2027.
    source: City of Bloomington
    url: https://bloomington.in.gov/news/2026/09/28/6661

