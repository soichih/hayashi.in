  - section: US News
    title: FAA says contractor's telecom upgrade set off Friday's nationwide ground stop
    body: >-
      Transportation Secretary Sean Duffy said an FAA contractor, L3Harris, was converting copper lines to fiber at a remote site when an error spread to other routers in the air traffic control system. Investigators are still sorting out whether it was operator error, an installation mistake or a faulty router.

      FAA Administrator Bryan Bedford said there is no evidence of anything nefarious or AI-related. The four-hour stop on Friday canceled about 7,000 flights.
    source: NPR
    url: https://www.npr.org/nx-s1-6040952
  - section: US News
    title: US loses measles elimination status
    body: >-
      The Pan American Health Organization concluded that measles transmission is re-established in the US, ending a status reached about 25 years ago, researchers told KFF Health News. A public announcement had been planned for Nov. 17.

      Outbreaks in the past two years sickened more than 8,000 people and hospitalized more than 830. States report 13 measles-associated deaths. Two doses of MMR vaccine prevent about 97% of infections.
    source: NPR
    url: https://www.npr.org/nx-s1-6041119
  - section: US News
    title: SpaceX catches a returning Starship for the first time
    body: >-
      Mechanical arms at the Texas launch site caught the spacecraft about 22 hours after liftoff. It reached orbit, released 26 Starlink satellites and circled Earth 14 times, and SpaceX said its heat shield appeared to work well.

      The first-stage booster exploded after Friday's launch, so a planned double catch did not happen. Engineers are investigating.
    source: NPR
    url: https://www.npr.org/g-s1-153786
