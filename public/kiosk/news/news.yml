    title: OpenAI's Brockman forecasts major biology progress within 18 months
    body: >-
      Greg Brockman told WSJ Tech that AI could bring significant strides in biology and disease cures in 12 to 18 months, and that death becoming a choice is possible, with no timeline or method given. Concrete results so far are modest: a GPT-4b micro model built with Retro Biosciences raised reprogramming markers in lab cells, and an AI-discovered drug, rentosertib, finished a 71-patient phase 2a trial focused mainly on safety.
