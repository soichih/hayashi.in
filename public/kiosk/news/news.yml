  - section: US News
    title: Four-hour nationwide ground stop leaves 7,000 flights canceled
    body: >-
      The FAA halted flights at every U.S. airport Friday after intermittent radar and communications outages at its high-altitude air route traffic control centers. The stop lasted about four hours and has ended. By 9pm ET, FlightAware counted more than 8,000 delays and 7,000 cancellations.

      Transportation Secretary Sean Duffy blamed outdated equipment that "got overloaded." Homeland Security Secretary Markwayne Mullin said there is no evidence of a cyberattack. It was only the second nationwide ground stop since Sept. 11, 2001, and Sen. Richard Blumenthal called for a thorough investigation.
    source: NPR
    url: https://www.npr.org/nx-s1-6040403
  - section: US News
    title: Democrat Jonathan Kreiss-Tomkins wins Alaska governor's race
    body: >-
      The AP called the ranked-choice race for the former Sitka state representative, 37, who will be the state's youngest governor. He replaces term-limited Republican Mike Dunleavy and takes office Dec. 7. Counting took over a week, and a measure to scrap ranked-choice voting failed.

      Democrats will hold 30 governorships nationwide, up from 24.
    source: NPR
    url: https://www.npr.org/g-s1-151719
