  - section: Local News
    title: Council defeats 911 dispatch tax increase after four members miss vote
    body: >-
      The Bloomington council voted 1-4 Monday on raising the countywide dispatch tax rate from 0.0631% to 0.1%, which would have brought in about $4.9 million a year. Four members were absent, and under state law absences count as no votes, so the measure failed even if every other member had backed it. Only Isabel Piedmont-Smith voted yes.

      The county income tax rate will be 2.205% for 2027. The city expects to cover the gap against the $4.81 million 2027 dispatch budget from reserves. Any increase approved after Oct. 31 would not take effect until October 2027.
    source: The B Square Bulletin
    url: https://bsquarebulletin.com/bloomington-council-votes-down-dispatch-tax-increase-absences-seal-defeat/
