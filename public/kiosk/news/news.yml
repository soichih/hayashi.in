  - section: World News
    title: Nigeria's first Ebola case raises questions about a Kenya link
    body: >-
      Nigeria confirmed its first Ebola case Oct. 20, in a woman in Abuja who arrived from Uganda; officials are tracing 44 contacts. Kenya has reported nine cases this month, all in one known cluster. The outbreak is the Bundibugyo strain, centered in the DRC, and is the world's second largest ever. Authorities are investigating whether the Kenya and Nigeria cases crossed paths.
    source: NPR
    url: https://www.npr.org/g-s1-149515
  - section: AI News
    title: Fired OpenAI safety researchers give first interview
    body: >-
      Mikita Balesni, Tomek Korbak and Jasmine Wang were dismissed in early October. They say they were let go for putting safety ahead of the company's near-term interests. OpenAI denies it, saying they violated policies on handling sensitive information and that an investigation found a significant breach of trust.
    source: NPR
    url: https://www.npr.org/nx-s1-6012298
