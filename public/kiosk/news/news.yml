  - section: World News
    title: Indian pilot praised after foiling flydubai crash attempt
    body: >-
      Netanyahu and Modi called pilot Smit Machchhar a hero. Reports say his co-pilot stabbed him on Wednesday's Tel Aviv-bound flight and the jet dropped nearly 14,000 feet in under 30 seconds. Machchhar opened the cockpit door, passengers and crew overpowered the co-pilot, and a second pair of pilots landed the plane in Tabuk, Saudi Arabia. All 174 aboard survived. Flydubai has halted Israel flights.
    source: Al Jazeera
