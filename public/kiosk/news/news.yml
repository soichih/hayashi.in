  - section: Local News
    title: City drops lawsuits over Crawford Apartments in settlement
    body: >-
      Bloomington dismissed its $685,000 breach-of-contract suit over federal HOME funds against the Crawford Apartments owners and the nonprofit Beacon, Inc., plus two rental-code enforcement cases filed in June 2025. The contract dismissal is with prejudice, so the city cannot refile.

      The city issued temporary occupancy permits for the 61-unit complex. Management must keep round-the-clock staffing or surveillance, and Beacon must file regular resident-service reports. A non-disparagement clause limits public statements about the litigation.
    source: The B Square Bulletin
    url: https://bsquarebulletin.com/bloomington-drops-lawsuit-against-owners-of-crawford-apartments-local-nonprofit/
  - section: Local News
    title: Ellettsville merger would leave Monroe County with none of a new income tax
    body: >-
      Under the state formula, if the Ellettsville-Richland Township merger approved Nov. 3 takes effect, Monroe County government would get $0 from the proposed municipal-services income tax, down from a projected $3.93 million. Ellettsville's share would rise sharply, and Bloomington would fall short of its target.

      Collections begin in 2029 and the legislature could change the rules in its 2027 session, so the county task force declined on Oct. 23 to recommend rates.
    source: The B Square Bulletin
    url: https://bsquarebulletin.com/ellettsville-merger-would-erase-monroe-countys-share-of-municipal-income-tax/
  - section: Local News
    title: Transit board chair's Florida vote draws mayor's scrutiny of his eligibility
    body: >-
      Bloomington Transit board chair James McLary voted in Florida's Nov. 3 election, and Florida property records show homestead tax benefits. Mayor Kerry Thomson says that, if accurate, the records present a conflict with board membership.

      The board has postponed its vote on cutting four bus routes to Dec. 8.
    source: The B Square Bulletin
    url: https://bsquarebulletin.com/bloomington-transit-board-chairs-florida-vote-raises-new-questions-about-residency-eligibility-to-serve/
  - section: Local News
    title: Mayor's refusal to sign superintelligence ban sets up Dec. 2 override vote
    body: >-
      Mayor Kerry Thomson will not sign Ordinance 2026-29, which the City Council passed 7-0 on Nov. 4. Under Indiana law, an unsigned ordinance counts as vetoed.

      The council could attempt an override at its Dec. 2 meeting at 6:30pm; it takes six of nine votes. Sponsor Dave Rollo says he would rather work with the mayor on a revised version.
    source: The B Square Bulletin
    url: https://bsquarebulletin.com/bloomington-mayor-vetoes-ai-superintelligence-ban-citing-research-enforcement-and-surveillance-concerns/
