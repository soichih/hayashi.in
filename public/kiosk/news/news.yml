  - section: Local News
    title: Council weighs 2027 budget cuts and a $10 million parks grant
    body: >-
      City councilmembers are reviewing proposed 2027 budget amendments;
      the policy-driven cuts total about $452,000. Separately, a grant
      opportunity of up to $10 million could reshape the parks capital plan,
      with priorities including pools, ice, pickleball, baseball, trails and
      a possible sale of the South Walnut Street property.
    source: B Square Bulletin
    url: https://bsquarebulletin.com/oct-1-2026-possible-cuts-to-2027-bloomington-budget-new-money-for-parks-capital-planning/
