  - section: Local News
    title: Mayor's refusal to sign superintelligence ban sets up Dec. 2 override vote
    body: >-
      Mayor Kerry Thomson said she will not sign Ordinance 2026-29, which the City Council passed 7-0 on Nov. 4, citing enforcement, the city's legal authority, privacy and the local innovation economy. Under Indiana law, an unsigned ordinance counts as vetoed.

      The council could attempt an override at its Dec. 2 meeting at 6:30pm; it takes six of nine votes. Sponsor Dave Rollo says he would rather work with the mayor on a revised version than force an override.
    source: The B Square Bulletin
    url: https://bsquarebulletin.com/bloomington-mayor-vetoes-ai-superintelligence-ban-citing-research-enforcement-and-surveillance-concerns/
  - section: Local News
    title: Council eases housing rules but keeps limits on duplexes
    body: >-
      The council voted 8-1 for changes to the Unified Development Ordinance covering accessory dwelling units, cottage developments, duplexes, triplexes and fourplexes. Attached ADUs can now be up to 1,000 square feet, up from 840.

      The administration wanted to drop two duplex limits: a cap of 15 approvals a year and a 150-foot buffer between duplexes. An amendment keeping both passed 7-2.
    source: The B Square Bulletin
    url: https://bsquarebulletin.com/bloomington-council-eases-housing-rules-but-keeps-limits-on-duplexes/
    image: img/housing-rules.jpg
    image_credit: The B Square Bulletin
  - section: Local News
    title: Council approves 2.7% raises for mayor, clerk and councilmembers
    body: >-
      The 6-3 vote sets 2027 pay at $149,953 for the mayor, $94,926 for the clerk and $26,368 for each councilmember, matching the raise given other city employees. Rosenbarger, Flaherty and Stosberg voted no. Amendments for a flat increase and a salary freeze both failed.

      The larger question of elected-official pay is left for another study, with candidate filing opening Jan. 6, 2027.
    source: The B Square Bulletin
    url: https://bsquarebulletin.com/bloomington-council-oks-2-7-elected-official-raises-leaves-bigger-pay-issue-for-election-year/
