  - section: US News
    title: Flight disruptions expected to last into Monday after FAA ground stop
    body: >-
      As of Sunday evening more than 2,300 flights were canceled and over 8,000 delayed, with Dallas-Fort Worth and Atlanta hit hardest. Transportation Secretary Sean Duffy expects operations to normalize within about two days as airlines reposition crews and aircraft.

      Duffy blamed faulty work by contractor L3Harris, which is replacing copper lines with fiber; investigators are focused on a radar site in Amarillo, Texas, and a radio site in El Dorado, Arkansas. L3Harris says it has finished over 70% of the conversion. The administration has asked Congress for $50 billion in emergency air traffic control funding.
    source: NPR
    url: https://www.npr.org/nx-s1-6041683
  - section: US News
    title: Trump heads to Asia to meet Xi and Putin as Nvidia scandal looms
    body: >-
      Trump stops in Manila for the ASEAN summit, where he meets Quad leaders, then goes to China. The White House confirmed he is expected to meet Xi Jinping and Vladimir Putin together, though neither side expects major deals. Ukraine is not expected to come up, and no separate Trump-Putin meeting is planned.

      Nvidia CEO Jensen Huang resigned after admitting an affair with a woman U.S. officials believe China recruited, according to The New York Times; NPR has not confirmed that. Commerce Secretary Howard Lutnick faces questions and agreed to appear before the Senate Banking Committee. The trade truce with China expires in January.
    source: NPR
    url: https://www.npr.org/nx-s1-6041738
