    title: "2014: NASA's MAVEN spacecraft enters Mars orbit"
    body: >-
      The Mars Atmosphere and Volatile Evolution mission arrived to study
      how the Red Planet's atmosphere has changed over billions of years,
      helping explain why Mars lost most of its once-thicker atmosphere.
    source: Wikipedia
    url: https://en.wikipedia.org/wiki/MAVEN
