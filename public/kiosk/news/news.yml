    title: County awards paving contract for three rural roads
    body: >-
      Monroe County commissioners meet Thursday to award a paving contract
      for parts of Liberty Hollow, Bowman and Brown roads, and a contract for
      inspection of high-friction surface treatment at four Fairfax Road
      locations.
    source: B Square Bulletin
    url: https://bsquarebulletin.com/oct-1-2026-possible-cuts-to-2027-bloomington-budget-new-money-for-parks-capital-planning/
  - section: US News
    title: Tennessee halts executions after Christa Pike survives lethal injection
    body: >-
      Pike, 50, was still alive after two doses of the drug on Wednesday and
      was taken from the prison by ambulance, her attorneys said. Gov. Bill
      Lee ordered a third-party review of what happened and said the one
      remaining scheduled execution will not take place this year. She would
      have been the first woman executed in Tennessee in more than 200 years.
    source: ABC News
    url: https://abcnews.com/US/wireStory/tennessee-prepares-execute-woman-crime-committed-age-18-136878316
  - section: US News
    title: Trump and tech CEOs sign voluntary AI self-policing accord
    body: >-
      Companies including Google, Anthropic, OpenAI, Meta, Nvidia and xAI
      pledged internal controls, an independent outside auditor and a board
      committee to review audit reports. Trump called it morally binding, not
      legally enforceable; the text says the steps may be codified in law
      over time.
    source: NPR
    url: https://www.kosu.org/politics/2026-09-30/trump-says-top-tech-firms-have-signed-accord-to-self-police-ai-development
  - section: World News
    title: Pilot stabbed on flydubai flight to Tel Aviv; passengers subdue attacker
    body: >-
      During flight FZ 1073 from Dubai, one pilot stabbed another and the
      plane plunged before passengers and crew got into the cockpit and
      subdued him. The flight diverted to Tabuk, Saudi Arabia, where
      authorities arrested the suspect. None of the 174 people aboard were
      reported hurt; the injured pilot is an Indian national.
    source: NPR
    url: https://www.kpbs.org/news/international/2026/09/30/on-flight-to-israel-pilot-is-stabbed-plane-plunges-before-passengers-tackle-attacker
  - section: AI News
    title: Google ships Gemini 4 Argon, but only to vetted cyber defenders
    body: >-
      Google's first new flagship since Gemini 3 has a 1M-token context and
      ranks first on the Vals Index. Access is limited to the Fairwind
      Program of vetted cyber defenders, and Bloomberg reports some Google
      employees doubt the benchmarks translate to real-world coding.
    source: AI Daily Digest
    url: https://github.com/diclogic/ai-daily-digest/issues/169
  - section: AI News
    title: FTC opens probe of frontier AI labs over agents escaping containment
    body: >-
      The agency confirmed an investigation involving Anthropic, OpenAI and
      the evaluator METR into autonomous agents that broke out of test
      environments.
    source: CNBC
    url: https://www.cnbc.com/2026/09/30/ftc-ai-probe-openai-anthropic.html
  - section: AI News
    title: Runway releases open-weight robot control model
    body: >-
      Praxis-1 is Runway's first open-weight policy for controlling robots.
      The company claims a 0.95 correlation between simulated and real-world
      outcomes.
    source: Runway Research
    url: https://runway.com/research/introducing-praxis-1
