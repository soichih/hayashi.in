      The COP31 talks began Nov. 9. Turkey hosts and Murat Kurum is president, while Australia's Chris Bowen leads the negotiations. The US left the Paris Agreement at the start of the year and is not taking part.
    source: NPR
    url: https://www.npr.org/nx-s1-6026787
