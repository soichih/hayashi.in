    title: Northbound I-69 in Greene County closed again for hole repair
    body: >-
      Northbound I-69 is closed near mile marker 94.5 while crews make permanent repairs to a hole in a single-lane construction zone. Traffic is detoured from the Bloomfield exit to U.S. 231, State Road 58 and State Road 45, then back to I-69.


      State police said the road reopened Sunday after a temporary patch, but scanner traffic suggested the patch was failing. The closure has changed several times, so check current traffic information before leaving.
    source: The Bloomingtonian
