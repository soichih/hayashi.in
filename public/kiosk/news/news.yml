  - section: Local News
    title: City proposes $6.87 million bond for aerial fire truck and street safety
    body: >-
      The package includes $2.5 million to replace the city's only aerial platform truck, which has been out of service for more than four months, and $4.23 million for transportation: $1.7 million for 10th Street between College and Park, $1.5 million for 3rd Street safety, and smaller amounts for sidewalks, crosswalks and lighting.


      Repayment would take a little over six years and cost about $33.70 a year per $100,000 of taxable assessed value, before credits. The council introduced it Oct. 14 and holds a public hearing and possible final vote Nov. 4.
    source: The B Square Bulletin
