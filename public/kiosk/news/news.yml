  - section: US News
    title: Judge orders White House to restore journalists' access
    body: >-
      A federal judge issued a temporary restraining order restoring White
      House press credentials for CNN, MS NOW and Politico after the
      administration revoked them. The judge doubted the national-security
      justification and said the ban looked retaliatory. The outlets argue it
      violates their First Amendment and due process rights, and the case
      continues.
    source: NPR
    url: https://text.npr.org/nx-s1-5979582

  - section: US News
    title: FDA advisory panel backs first multi-cancer blood test
    body: >-
      An FDA advisory committee recommended Grail's Galleri test, which
      screens for up to 50 cancers with a $949 blood draw. Two large trials
      missed their main goal of reducing overall mortality, though Stage IV
      diagnoses fell.
    source: NPR
    url: https://text.npr.org/nx-s1-5978122

  - section: US News
    title: One in five middle-income renters couldn't pay full rent in 2025
    body: >-
      An Urban Institute survey of more than 10,000 adults found 20% of
      middle-income renters fell short on rent, up from 14% the year before.
      Nearly 28% of lower-income renters and about 7% of high earners
      reported the same problem. About 20% of renters also struggled with
      utility bills.
    source: NPR
    url: https://text.npr.org/nx-s1-5977022

