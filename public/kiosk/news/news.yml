  - section: Local News
    title: City council votes Wednesday on 2027 budget after 15 proposed cuts
    body: >-
      The Common Council holds a special session at 6:30pm Wednesday in Room 115
      at City Hall for final votes on the 2027 civil city and transit budgets,
      plus first readings of the water and wastewater utility budgets and
      police and fire salary ordinances.

      The civil city levy is capped at $43.76 million, a 6 percent increase over
      2026, with a $63.75 million general fund. Council members filed 15
      amendments to cut spending, including a $2.5 million parking meter
      appropriation and $3 million in housing grant funding. The meeting is
      streamed on CATS and the city's YouTube channel and open on Zoom.
    source: WBIW
    url: https://www.wbiw.com/2026/10/05/bloomington-common-council-to-vote-on-2027-city-budgets-and-tax-levies-at-october-7-special-session/

