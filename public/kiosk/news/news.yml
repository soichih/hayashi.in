    title: GAO finds Pentagon's responsible-AI office has 3 of 10 positions filled
    body: >-
      A Government Accountability Office report found the office created in 2022 had filled three of its 10 authorized positions as of February, and 29 of 64 efforts in its responsible-AI plan were unfinished as of April. GAO recommended fixing staffing and issuing a formal charter for its working council.
