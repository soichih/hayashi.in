  - section: US News
    title: Justice Department sues to block Alaska from certifying Senate result
    body: >-
      The suit asks a federal court to stop Alaska from automatically certifying its Senate race if Republican Sen. Dan Sullivan loses, until the government investigates whether votes for Daniel J. Sullivan, a retired teacher with a nearly identical name on the Nov. 3 ballot, were meant for the senator. Attorney General Todd Blanche defended the suit on CNN and denied it lays groundwork for challenging the midterms. Sen. Lisa Murkowski said the state had already distinguished the candidates. Sullivan faces Democrat Mary Peltola.
    source: NPR
    url: https://www.npr.org/nx-s1-6016212
  - section: US News
    title: US measles cases top 4,580, more than double all of 2025
    body: >-
      The CDC counts more than 4,580 cases as of Oct. 22, and 96% are unvaccinated or of unknown status. Pennsylvania has at least 1,338 cases, over 250 hospitalizations and 5 deaths, with Amish communities in Lancaster and Mifflin counties hit hard. New York's governor declared a disaster emergency earlier this month. Two MMR doses are nearly 97% effective, per the CDC.
    source: NPR
    url: https://www.npr.org/nx-s1-6016205
