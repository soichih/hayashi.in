    title: Bloomington Transit hearing on four-route cuts is Tuesday, Nov. 17
    body: >-
      The proposal would remove about 237 driver hours a week from Dec. 6 through May 2027 because of a driver shortage. Routes 2 West and 2 South would merge into one hourly weekday route, Route 11 loses weekend service, and Route 16 drops from three buses to two.

      The hearing is 4:30-5:30pm at the downtown Transit Center, with a final vote expected that day. Comments are open through Dec. 5.
