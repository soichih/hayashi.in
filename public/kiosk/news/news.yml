  - section: AI News
    title: Meta expands AI age detection for teens on Instagram worldwide
    body: >-
      Meta announced Nov. 9 that its AI age-estimation system now runs on Instagram in every country. Accounts flagged as likely teens who signed up with adult birthdays are moved into Teen Accounts, which start private, limit direct messages and hide harmful comments. The system is already rolling out on Facebook and is expected on Threads by the end of 2026.

      Meta calls the results encouraging but has published no accuracy figures, and has not explained how flagged users can contest a classification.
    source: AI News Today
    url: https://pasqualepillitteri.it/en/news/31702/meta-ai-age-detection-teens-instagram-worldwide
    image: img/meta-age-detection.jpg
    image_credit: AI News Today
