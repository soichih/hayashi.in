  - section: US News
    title: Nvidia opens investigation into CEO's reported ties to alleged Chinese spy
    body: >-
      The New York Times reported on Oct. 29 that Alice Huang, a former executive at Singapore-based Megaspeed and no relation to Jensen Huang, was a Chinese intelligence asset and had a close relationship with him. Later reports from the Financial Times said the relationship was romantic. Nvidia has denied it was anything beyond a business contact, and Huang called the claims groundless speculation.

      No public evidence shows he passed information to Chinese intelligence or broke export rules. House Republican chairs have asked for a briefing, and Nvidia says it has launched its own investigation.
    source: NPR
    url: https://www.npr.org/nx-s1-6034036
