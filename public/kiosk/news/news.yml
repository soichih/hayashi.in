  - section: Local News
    title: "Bryan Street deck collapse: at least five hospitalized, city wants a railing"
    body: >-
      A deck pulled away from a rental home on North Bryan Street at about 10:29pm Friday, and at least five people were taken to IU Health Bloomington. The fire department has not released their conditions. A city housing compliance officer ordered a porch railing where the deck separated; property management said it was being installed Monday, and the officer planned to return Tuesday to check.


      The city does not investigate the cause and has no deck-specific code enforcement, but says the collapse may prompt a review of added safety standards. A county building inspector is scheduled to visit Wednesday.
    source: The Bloomingtonian
    url: https://bloomingtonian.com/2026/10/20/city-calls-for-porch-railing-after-bryan-street-deck-collapse-at-least-five-transported-to-hospital/
  - section: Local News
    title: Monroe County cited over chemical safety at Justice Building
    body: >-
      Indiana's workplace safety agency issued a serious citation Oct. 15 because the county had no written hazard-communication program for employees handling hazardous chemicals, including a corrosive drain cleaner. The proposed $3,000 penalty is deferred for public entities while the agency awaits proof of correction. The county has until Nov. 12 to fix the problem and document it. The county's response was not included in the records obtained.
    source: The Bloomingtonian
    url: https://bloomingtonian.com/2026/10/20/monroe-county-cited-for-serious-chemical-safety-violation-at-justice-building/
  - section: Local News
    title: Bird flu found in wild ducks in Greene County
    body: >-
      Indiana DNR says highly pathogenic avian influenza was confirmed in wild blue-winged teal in Greene County, and has killed geese in Hamilton County. The CDC rates the public risk as low. Report sick or dead waterfowl at on.IN.gov/sickwildlife, avoid touching them, and use gloves and a mask if you must. Hunters should cook waterfowl to 165 degrees and process birds away from pets and poultry.
    source: The Bloomingtonian
    url: https://bloomingtonian.com/2026/10/20/bird-flu-detected-in-wild-ducks-in-greene-county-geese-in-hamilton-county/
  - section: Local News
    title: Second Street goes one-way westbound Wednesday
    body: >-
      Starting Oct. 21, eastbound Second Street is closed and the street is open to westbound traffic only, with eastbound drivers detoured to First Street. Crews are replacing asphalt, adding stormwater infrastructure and paving the south side. Two-way traffic is scheduled to return before Thanksgiving, weather permitting.
    source: City of Bloomington
