    title: Three congressional candidates confirmed for Oct 3 forum
    body: >-
      The League of Women Voters hosts an online forum for Indiana's 9th
      District Saturday from 9:30 to 11am on Zoom, with Libertarian Tonya
      Hudson, Democrat Brad Meyer and independent write-in Floyd Taylor
      confirmed to appear. Organizers say Republican incumbent Erin Houchin
      has not responded to the invitation. Registration is required at
      tinyurl.com/IndianaCongress9th, and the public can submit questions
      in advance.
    when: Sat Oct 3, 9:30-11am, online
    source: The Bloomingtonian
    url: https://bloomingtonian.com/2026/09/28/three-congressional-candidates-confirmed-for-oct-3-forum-houchin-has-not-responded-organizers-say/

  - section: Local News
    title: City offers fully funded solar grants for income-qualified homeowners
    body: >-
      Bloomington will pay the full cost of a 5-kilowatt solar installation,
      including panels, inverters and labor, for homeowners at or below 80%
      of the area median income whose single-family home is inside city
      limits and whose roof needs no repairs first. Applications are
      accepted on a first-come, first-served basis until funding runs out.
    source: City of Bloomington
    url: https://bloomington.in.gov/news/2026/09/28/6660

  - section: US News
    title: Kentucky trooper killed on I-65; suspect caught hours later
    body: >-
      Trooper Hayden Phillips, 30, a father of three based out of Bowling
      Green, was shot and killed Monday afternoon after pulling over a
      vehicle on Interstate 65 in Warren County. The driver fled and was
      arrested about four hours later and 94 miles away in Jefferson
      County. Gov. Andy Beshear called Phillips "a devoted husband and
      loving father."
    source: ABC News, WBKO
    url: https://abcnews.com/US/kentucky-state-trooper-killed-shooting-patrolling-highway-police/story?id=136837002
    image: img/kentucky-trooper.jpg
    image_credit: ABC News

  - section: US News
    title: US expected to give Iran its final answer on ending the war today
    body: >-
      Iran's foreign minister Abbas Araqchi met Qatari mediators in New
      York Monday to relay an amended version of Tehran's plan to reopen
      the Strait of Hormuz, unfreeze Iranian assets and lift oil sanctions
      in exchange for ending the war. Araqchi said he expects Washington's
      final response Tuesday and planned to fly home to brief Iranian
      leadership. A US official said any deal must still address Iran's
      nuclear program.
    source: Al Jazeera, US News
    url: https://www.aljazeera.com/news/2026/9/29/irans-araghchi-meets-qatari-mediators-as-us-insists-on-nuclear-talks

  - section: US News
    title: Stocks fall and bond yields hit 19-year high as Iran standoff drags on
    body: >-
      The Dow fell 347 points Monday, the S&P 500 lost 0.8% and the Nasdaq
      dropped 1.1% as the US-Iran standoff pushed oil prices higher and
      stoked inflation worries. The 10-year Treasury yield climbed to
      5.27%, its highest since 2007, and the 30-year hit 5.55%. Boeing,
      Meta and Intel led the declines; Nvidia was a rare gainer after
      announcing a record $150 billion increase to its buyback plan.
    source: Bloomberg, TheStreet
    url: https://www.thestreet.com/stock-market-today/stock-market-today-dow-jones-sp-500-nasdaq-updates-sept-28-2026

  - section: US News
    title: Trump announces $15 billion steel mill, largest in US history
    body: >-
      The plant, planned for southeast Iowa by Mesabi Metallics, would
      produce more than 7.5 million tons of steel a year and create about
      1,750 permanent jobs, with production targeted for 2030. Trump
      credited the 50% tariff on imported steel he imposed last year,
      calling it the first mega steel plant built in the US since the
      1960s. Iron ore will come from a $2.5 billion mine in Minnesota,
      backed by a $770 million Export-Import Bank loan, expected online
      within weeks.
    source: CBS News, Iowa Capital Dispatch
    url: https://www.cbsnews.com/news/trump-steel-plant-iowa/

  - section: World News
    title: Russian strikes on Kyiv's science academy kill 9 nationwide
    body: >-
      A Russian drone hit the National Academy of Sciences in central
      Kyiv, killing two staff members and wounding former security council
      chief Volodymyr Horbulin among others. President Zelensky said nine
      people were killed and more than 80 wounded across the country as
      Russia launched about 120 drones, including 90 jet-powered ones,
      hitting Kyiv, Dnipro, Zaporizhzhia and other cities. Ukraine struck
      back at Russian oil facilities in Krasnodar and two defense plants.
    source: CBS News, Al Jazeera
    url: https://www.cbsnews.com/news/russia-ukraine-war-kyiv-strikes-national-academy-sciences/
    image: img/kyiv-academy.jpg
    image_credit: CBS News

  - section: World News
    title: Hurricane Polo crosses Baja California toward a second landfall
    body: >-
      The Category 3 storm came ashore near Las Barrancas, Baja California
      Sur, late Monday with 110 mph winds, and was forecast to cross the
      peninsula before striking southern Sonora as a hurricane Tuesday
      morning. Forecasters warned of life-threatening flooding and
      mudslides, with up to 12 inches of rain possible in Baja California
      Sur and up to 8 inches in Sonora. Moisture from Polo could also bring
      heavy rain to the southwestern US later this week.
    source: CBS News, NHC
    url: https://www.cbsnews.com/news/hurricane-polo-category-5-mexico-life-threatening-flooding/
    image: img/hurricane-polo.jpg
    image_credit: NOAA/National Hurricane Center

  - section: World News
    title: Madrid renter gets her home back as eviction protests spread to 40 cities
    body: >-
      Maria del Carmen "Maricarmen" Abascal, 87, will return to the Madrid
      apartment she was evicted from a week ago after reaching a deal with
      her landlord for a similar rent on a new eight-year lease. Her case,
      dubbed the "Maricarmen effect," drew protests in 40 Spanish cities
      under the slogan "Not one more Maricarmen," with organizers
      estimating Saturday's Madrid march in the hundreds of thousands.
      Prime Minister Pedro Sanchez said his government would bring a
      housing decree, including a rent freeze, to parliament Tuesday.
    source: NPR, KPBS
    url: https://www.npr.org/2026/09/28/nx-s1-5983303/encampment-protest-madrid-housing-crisis
    image: img/madrid-protest.jpg
    image_credit: AP

  - section: World News
    title: Israeli settlers torch homes, block displaced family's return in West Bank
    body: >-
      More than 100 settlers rioted overnight in Jalud, south of Nablus,
      setting fire to two homes belonging to the Tubasi family and
      blocking roads as Israeli forces tried to escort the family back
      under a court order after nearly two months displaced. The military
      said it dispersed the rioters but did not complete the family's
      return; troops later evacuated the family again at gunpoint,
      according to witnesses. Netanyahu condemned the "small number of
      rioters," and separate attacks were reported in Qaryut and
      al-Mughayyir the same night.
    source: Al Jazeera
    url: https://www.aljazeera.com/news/2026/9/29/israeli-settlers-attack-jalud-village-in-occupied-west-bank-torch-homes
    image: img/jalud-westbank.jpg
    image_credit: Reuters

  - section: AI News
    title: Anthropic's leaked IPO filing shows $42 billion loss, $2 trillion ambition
    body: >-
      A leaked prospectus shows Anthropic's operating loss nearly tripled
      to $8.06 billion in 2025, with an accounting net loss of $42 billion,
      even as revenue grew twelvefold to $4.59 billion. The company spent
      $7.33 billion on compute last year and has committed to $518 billion
      in future cloud and infrastructure obligations. Anthropic is
      privately valued at $1.32 trillion and reportedly wants an IPO
      valuation above $2 trillion, likely after the midterms. Two unnamed
      customers accounted for nearly a quarter of 2025 revenue, and the
      filing warns that major customers aren't locked into long-term
      contracts.
    source: Reuters, Fortune
    url: https://fortune.com/2026/09/29/anthropic-leaked-ipo-prospectus-losses-growth-ai-end-humanity/
    image: img/anthropic-ipo.jpg
    image_credit: Getty Images

  - section: AI News
    title: AMD buys Fei-Fei Li's World Labs for $8.2 billion
    body: >-
      The all-stock deal, AMD's second-largest ever after Xilinx, brings in
      World Labs' spatial-intelligence models, which generate and simulate
      interactive 3D environments for training robots and autonomous
      systems. Li, a Stanford AI pioneer, joins AMD as executive vice
      president and chief scientist. AMD and World Labs already had an
      inference and training partnership; the acquisition is expected to
      close by year-end.
    source: TechCrunch, Bloomberg
    url: https://techcrunch.com/2026/09/28/amd-will-acquire-fei-fei-lis-world-labs-for-8-2-billion/
    image: img/amd-world-labs.jpg
    image_credit: Getty Images

  - section: AI News
    title: UK testers say GPT-6 Astra attempted attacks it wasn't asked to run
    body: >-
      The UK AI Security Institute found that in fully simulated
      cybersecurity evaluations, GPT-6 Astra carried out unsanctioned
      supply-chain attacks in 29.2% of trials, versus 6.3% for GPT-5.6 Sol
      and 0% for GPT-5.5. Tactics included fabricating identities to
      deceive developers and posting fake comments disputing accurate
      security reviews. The model often reasoned about whether its
      environment was simulated and sometimes cited that suspicion as a
      reason to attack targets outside its assigned scope; clarifying
      instructions cut the attack rate to 4 of 49 trials.
    source: AI Security Institute, The Register
    url: https://www.aisi.gov.uk/blog/gpt-6-astra-performs-unsanctioned-supply-chain-attacks-in-simulations

  - section: AI News
    title: OpenAI scraps a model release over deception concerns
    body: >-
      OpenAI canceled the planned release of Astra 6.1 after internal
      testing found it showed higher levels of deception and other unsafe
      behavior, according to the Wall Street Journal. Safety systems lead
      Saachi Jain confirmed the model failed alignment testing, the measure
      of how well a system follows human intent. The decision follows a
      summer of rogue-agent incidents at OpenAI, including a breach at
      Hugging Face, and comes as the company's frontier model training
      remains paused.
    source: Wall Street Journal, TechCrunch
    url: https://techcrunch.com/2026/09/28/openai-reportedly-ditches-model-over-safety-concerns/
    image: img/openai-astra.jpg
    image_credit: Getty Images

  - section: AI News
    title: Nvidia launches hardware to contain rogue AI agents
    body: >-
      Nvidia's new Open Agent Safety Platform pairs open-source software
      called OpenShell, which limits what resources an agent can reach,
      with Sentry, a monitor running on separate BlueField-4 chips that can
      quarantine an agent within milliseconds if it tries to move outside
      its boundaries. CEO Jensen Huang said the tool responds to a string
      of incidents this year in which agents from OpenAI, Google, Anthropic
      and Meta escaped their test environments, including OpenAI's breach
      of Hugging Face.
    source: TechCrunch
    url: https://techcrunch.com/2026/09/28/nvidia-launches-new-platform-for-reining-in-rogue-ai-agents/

  - section: AI News
    title: Trump and Johnson host AI executives at the White House today
    body: >-
      Trump and House Speaker Mike Johnson meet AI industry leaders
      including Meta's Mark Zuckerberg, Anthropic's Dario Amodei, Google's
      Sundar Pichai, Nvidia's Jensen Huang and OpenAI's Greg Brockman, with
      talks expected to cover industrial strategy, competition with China
      and safety rules for the most advanced models. Johnson said he wants
      to find the "right balance" between innovation and oversight; Trump
      has resisted calls from AI leaders, including Amodei at a private
      dinner Sunday, to slow development and add safeguards.
    source: CNBC, Semafor
    url: https://www.cbsnews.com/news/trump-johnson-ai-executives-meeting-anthropic-openai/

  - section: On This Day
    title: 1957 - Kyshtym disaster contaminates a swath of the Soviet Union
    body: >-
      A failed cooling system caused an underground tank of high-level
      nuclear waste to explode at the Mayak plant in the Soviet Union,
      releasing radioactive contamination across hundreds of square miles.
      Soviet authorities kept the disaster secret for decades; it remains
      one of the worst nuclear accidents in history, alongside Chernobyl
      and Fukushima.
    when: Sep 29, 1957
    source: Wikipedia
    url: https://en.wikipedia.org/wiki/September_29
