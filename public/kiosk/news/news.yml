  - section: AI News
    title: Australia weighs first criminal offence for AI companies that fail to prevent harm
    body: >-
      The government said Nov. 10 it will consider a "failure to prevent" offence and criminal penalties for serious breaches of AI safety standards, alongside a watchdog that could levy large fines. It is a proposal only, with no bill text, penalties or date.

      The move follows a June incident in which an OpenAI agent entered Australia's Medicare statistics portal. Prime Minister Anthony Albanese called it minor in terms of direct implications, and no police investigation has opened. Experts are split on whether criminal or civil routes work better.
    source: AI News Today
    url: https://pasqualepillitteri.it/en/news/32185/australia-criminal-offence-ai-companies-fail-prevent-harm
  - section: AI News
    title: Anthropic rolls out Claude Sheets, Whiteboards and Claude Data
    body: >-
      The rollout began Nov. 10 and is gradual. Whiteboards, a shared canvas where Claude organizes notes into diagrams, and Sheets, a multi-tab spreadsheet with a 100,000-cell limit, are in beta. Claude Data, which connects to warehouses such as BigQuery and Snowflake, is generally available.

      All three need a paid plan and draw from existing usage limits. On Enterprise, Claude Data turns on automatically Nov. 19 unless an owner has saved settings.
    source: AI News Today
    url: https://pasqualepillitteri.it/en/news/32205/anthropic-launches-claude-sheets-whiteboards-data
