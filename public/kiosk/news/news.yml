    title: Street resurfacing starts today on Kirkwood, Rogers, Grimes and Patterson
    body: >-
      The two-week project could run past Thanksgiving week if weather interferes. Patterson Drive is fully closed between Second and Third streets Nov. 16 through Nov. 18. Elsewhere expect lane restrictions, flaggers and delays.

      Work goes Kirkwood between Maple and Rogers first, then Rogers between Second and Third, Rogers between First and Patterson, and finally Grimes Lane and Patterson from Walnut to Third.
    source: City of Bloomington
