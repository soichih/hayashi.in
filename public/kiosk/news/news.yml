    title: IU wins $25 million Lilly Endowment grant to bring AI into teaching
    body: >-
      The money funds IU's Human + AI Learning Ecosystem through 2030 across its nine campuses. Goals include teaching students to use and evaluate AI, helping faculty adapt courses and assessments, and using AI in advising, financial aid and career exploration, with the aim of improving retention and graduation.

      The award is part of $291.71 million Lilly Endowment approved for 35 Indiana colleges. Purdue and the Ivy Tech Foundation also got $25 million each. IU has not said how the money will be split among campuses or projects.
    source: The Bloomingtonian
    url: https://bloomingtonian.com/2026/11/26/iu-receives-25-million-lilly-endowment-grant-for-ai-in-teaching-student-support/
