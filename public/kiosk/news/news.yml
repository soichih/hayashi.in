    title: "Kirkwood shooting: Indianapolis man, 18, arrested; all seven victims stable"
    body: >-
      Seven people ages 17 to 27 were shot around 1:30am Sunday on East Kirkwood Avenue, and all are in stable condition. An 18-year-old Indianapolis man seen running from the scene with a gun was arrested near Dunn Meadow on allegations of resisting law enforcement and unlawful possession of a firearm. Police haven't determined whether he fired. Anyone with information can call Detective Chris Scott at 812-339-4477.
    source: The Bloomingtonian
    url: https://bloomingtonian.com/2026/11/01/update-all-seven-kirkwood-shooting-victims-in-stable-condition-indianapolis-man-arrested/
