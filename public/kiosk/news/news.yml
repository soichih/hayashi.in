    title: US goes ahead with ban on nearly $1 billion in Canadian imports
    body: >-
      The ban covers alcoholic beverages, dairy products and motorcycles,
      among other goods.
    source: Democracy Now
    url: https://www.democracynow.org/2026/9/30/headlines

  - section: World News
    title: North Korean landmine found on South's side of the DMZ
    body: >-
      The UN Command determined North Korea violated the 1953 armistice
      after investigators found an active North Korean anti-personnel mine
      on the southern side of the Demilitarized Zone, days after a similar
      mine badly wounded two South Korean soldiers on patrol Sept 21.
      South Korea's defense ministry called it "a clear violation of the
      armistice agreement" and is demanding an apology; North Korea's Kim
      Yo Jong dismissed the claims as a "conspiratorial farce."
    source: UN Command, Stars and Stripes
    url: https://www.stripes.com/theaters/asia_pacific/2026-09-30/north-korea-mines-dmz-armistice-23012081.html

  - section: World News
    title: Russia hits Kyiv's power grid overnight, killing 4
    body: >-
      Ballistic and cruise missiles backed by drones struck Kyiv's energy
      infrastructure, killing at least four people, including a child in
      Vyshhorod, and causing widespread power outages. Grid operator
      Ukrenergo asked residents to postpone using high-power appliances.
      President Zelensky renewed his appeal for more air-defense
      interceptors ahead of winter.
    source: AP, Kyiv Independent
    url: https://kyivindependent.com/russian-ballistic-missiles-rock-kyiv-disrupt-electricity-as-multi-day-russian-attacks-on-capital-continue/

  - section: World News
    title: France detains 400 students as school protests spread
    body: >-
      More than 400 people, mostly minors, were taken into custody Tuesday
      as protests over overcrowded classes and teacher shortages spread to
      more than 400 schools nationwide. At least 10 teachers and several
      students were hurt, along with 48 law enforcement officers. The
      unrest comes two days before Prime Minister Sebastien Lecornu's
      government presents a 2027 budget with 54 billion euros in planned
      savings.
    source: AP
    url: https://abcnews.com/International/wireStory/french-presidential-campaign-heats-student-protests-fuel-political-136827389

  - section: World News
    title: Israel says it killed senior Hamas commander Izz al-Din al-Beik in Gaza
    body: >-
      An Israeli airstrike in Gaza killed al-Beik, described as a senior
      Hamas commander, according to news reports on Wednesday.
    source: FDD, Democracy Now
    url: https://www.democracynow.org/2026/9/30/headlines

  - section: AI News
    title: Tech CEOs sign voluntary White House accord on "Super Intelligence"
    body: >-
      Jensen Huang, Sundar Pichai, Mark Zuckerberg, Elon Musk, Dario Amodei
      and Greg Brockman signed a roughly 300-word commitment at the White
      House on Tuesday. Frontier AI developers pledge internal controls that
      track risks such as cyber, bio and chemical capabilities, a dedicated
      safety team, an independent outside auditor and a board-level
      committee that reviews audit reports. The accord is voluntary, and
      says it may make sense to write the steps into law later. It follows
      the executive order directing agencies to say "Super Intelligence"
      instead of "AI."
    source: SiliconANGLE, Washington Examiner
    url: https://siliconangle.com/2026/09/30/prominent-tech-ceos-sign-voluntary-white-house-ai-safety-accord/
    image: img/ai-accord.jpg
    image_credit: SiliconANGLE

  - section: AI News
    title: OpenAI launches Dots, always-on agents with their own cloud computers
    body: >-
      Announced at Developer Day on Sept 29, each Dot runs on GPT-6 Astra
      with a dedicated cloud computer and browser, connects to more than
      4,000 apps, and can be reached through ChatGPT, Slack and Microsoft
      Teams. It is rolling out now to Pro, Business Premium and Enterprise
      plans in eligible markets. The launch came a day after OpenAI
      shelved GPT-6.1 Astra over safety and alignment problems found in
      testing.
    source: MarkTechPost
    url: https://www.marktechpost.com/2026/09/29/openai-launches-dots-always-on-gpt-6-astra-agents-that-work-from-their-own-cloud-computers/

