  - section: Local News
    title: Housing Authority buys five apartment complexes, plans $10 million in repairs
    body: >-
      The Bloomington Housing Authority bought Summit Pointe, Basswood, Woodland Springs, Kingston Manor and Northcrest, about 924 units, from Hometown Property Group on Nov. 5. The authority says it wants to preserve affordable rents and fix overdue maintenance. The complexes were built between 1964 and 1989, and occupancy ranges from 69% to 94%.

      Repairs start with work inside apartments this winter and should take about two years, with roughly 70% done in the first year. The authority is seeking more funding to go beyond $10 million and plans to meet residents this winter about the renovations and a new property manager. The purchase price was not disclosed.
    source: The Bloomingtonian
    url: https://bloomingtonian.com/2026/11/09/bloomington-housing-authority-buys-five-apartment-complexes-plans-10-million-in-repairs/
  - section: Local News
    title: Powell Preserve reopens near Gosport after more than five years
    body: >-
      Heavy rain in 2021 cut a new stream channel and washed away part of the parking area, and a June 17 tornado later dropped more than 100 trees across the trail. The reopened 68-acre Sycamore Land Trust preserve has a new footbridge, an expanded loop trail to Beanblossom Creek and about 800 feet of rebuilt stream. A young mudpuppy, a salamander of special concern in Indiana, was found there this summer.

      It is open daily dawn to dusk, with a six-car gravel lot on Brighton Road.
    where: Northern Monroe County
    source: The Bloomingtonian
    url: https://bloomingtonian.com/2026/11/09/powell-preserve-reopens-in-northern-monroe-county-after-more-than-five-years/
  - section: Local News
    title: Temporary all-way stop started Monday at Second and Walker
    body: >-
      The stop went in Nov. 9 and stays about 30 days while crews prepare a new traffic signal as part of the Second Street Improvement Project. Eastbound traffic is already detoured to First Street.
    source: City of Bloomington
    url: https://bloomington.in.gov/news/2026/11/06/6690
  - section: Local News
    title: Bloomington Transit proposes cutting four routes from Dec. 6
    body: >-
      The board voted 5-0 on Nov. 4 to seek public comment on temporary cuts that would remove about 237 driver hours a week from Dec. 6 through May 2027. Routes 2 West and 2 South would merge into one hourly weekday route. Route 7 loses weekday departures at 40 past the hour, Route 11 loses weekend service, and Route 16 drops from three buses to two Monday through Saturday. The cause is a driver shortage.

      Public hearing is Tue Nov. 17, 4:30-5:30pm at the downtown Transit Center, with a final vote expected that day. Comments are open through Dec. 5.
    source: The B Square Bulletin
    url: https://bsquarebulletin.com/possible-bus-service-cuts-bloomington-transit-board-sets-public-hearing/
