  - section: Local News
    title: Bloomington opens new fire operations center on South Walnut
    body: >-
      The center at 3182 S. Walnut St. was dedicated Nov. 6. It will host training drills, supply coordination, gear storage and equipment repair, and can serve as a backup fire station in a disaster. It is the last public safety project funded by the 2022 city bond, which also paid for renovations at Fire Stations 1 and 3.
    source: The Bloomingtonian
    url: https://bloomingtonian.com/2026/11/06/bloomington-opens-new-fire-operations-center-on-south-walnut-street/
  - section: Local News
    title: Bloomington Transit proposes cutting four routes from Dec. 6
    body: >-
      The board voted 5-0 on Nov. 4 to seek public comment on temporary cuts that would remove about 237 driver hours a week from Dec. 6 through May 2027. Routes 2 West and 2 South would merge into one hourly weekday route, Route 11 loses weekend service, and Route 16 drops from three buses to two. The cause is a driver shortage.

      Public hearing is Tue Nov. 17, 4:30-5:30pm at the downtown Transit Center, with a final vote expected that day. Comments are open through Dec. 5.
    source: The B Square Bulletin
    url: https://bsquarebulletin.com/possible-bus-service-cuts-bloomington-transit-board-sets-public-hearing/
  - section: Local News
    title: Ellettsville-Richland merger recount deadline is Tuesday, Nov. 17
    body: >-
      The merger passed 1,493 to 1,001 inside Ellettsville and 1,514 to 1,479 outside, a 35-vote margin where Indiana law requires a majority in both areas. A recount needs petition signatures from 10% of voters on the question plus a $100 deposit, filed by noon Nov. 17. Otherwise Richland Township government folds into the Town of Ellettsville on Jan. 1, 2027.
    source: The B Square Bulletin
    url: https://bsquarebulletin.com/ellettsville-richland-township-reorganization-passes-by-narrow-margin-outside-town-limits/
  - section: Local News
    title: County council again refuses 18% raise for commissioners
    body: >-
      Commissioners asked on Nov. 10 to raise their 2027 pay to $82,955 each from $70,512. No councilor voted for it, citing the 2% raise for other employees and sharply higher health insurance premiums. Councilors voted 6-0 to restart the personnel committee, paused since March 2025, to look at a countywide salary study.
    source: The B Square Bulletin
    url: https://bsquarebulletin.com/monroe-county-council-again-rejects-raise-for-commissioners-citing-2-for-employees/
