  - section: Local News
    title: Council holds Nov. 4 hearing on $6.87 million bond after dispatch tax failure
    body: >-
      The council's 1-4 vote on raising the dispatch tax failed Monday because four absences count as no votes. The proposed bond would put $2.5 million toward replacing the only aerial platform fire truck, out of service for more than four months, and $4.23 million toward transportation, including 10th Street and 3rd Street safety work. A public hearing and possible final vote are set for Nov. 4.
    source: The B Square Bulletin
    url: https://bsquarebulletin.com/bloomington-proposes-6-87m-bond-issue-for-fire-truck-street-safety-plans-for-regular-borrowing/
