  - section: AI News
    title: Banks block AI agents from customer accounts over rogue-agent fears
    body: >-
      JPMorgan and Schwab have blocked agents, Citigroup and Bank of America have restricted them, and the Telegraph reports HSBC, Nationwide, NatWest, Barclays and Lloyds are doing the same, based on unnamed sources. Schwab's CEO said agents try to log in 30 to 50 times a week. Wells Fargo's rule treating agent orders as the customer's own takes effect Nov. 24.

      No source documents a specific customer loss from an agent, and who bears liability for agent errors is unresolved.
    source: AI News Today
