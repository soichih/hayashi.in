  - section: Local News
    title: MCCSC sets six priorities for school redistricting
    body: >-
      The school board weighted socioeconomic balance and projected savings
      as its top two factors, alongside building utilization, class size,
      transportation time and how many students would be reassigned. The
      finance target is a 1-3% net savings over a fixed period, with any
      cost increase treated as a hard limit, and building utilization
      should hit 85%. A separate eight-to-ten-month facilities master plan
      is running alongside the redistricting review.
    source: The B Square Bulletin
    url: https://bsquarebulletin.com/mccsc-redistricting-priorities-socioeconomic-balance-savings/

  - section: Local News
    title: County adds $1M for Beacon Center after $4M funding gap
    body: >-
      The Monroe County Council voted to put $1 million toward Beacon
      Inc.'s planned housing and shelter complex on West 3rd Street,
      helping close a $4 million financing gap that forced the nonprofit to
      split construction into two phases. The money would come from the
      economic development income tax fund and still needs a formal
      follow-up vote. The county's 2027 budget gets its first reading Oct 6,
      with adoption set for Oct 20.
    source: The B Square Bulletin
    url: https://bsquarebulletin.com/monroe-county-council-adds-1m-in-support-for-beacon-center-to-proposed-2027-budget-after-4m-financing-setback/

  - section: Local News
    title: Voter registration for the Nov 3 election closes Oct 5
    body: >-
      Monroe County has issued 1,075 absentee ballots so far, 822 by mail
      and 253 online, out of 90,350 registered voters. Early voting starts
      Oct 6, and mail absentee ballots must be requested by 11:59pm Oct 22.
      The county expects turnout near the roughly 40,000 ballots cast in the
      2022 midterms.
    source: The B Square Bulletin
    url: https://bsquarebulletin.com/monroe-county-election-board-1-075-absentee-ballots-issued-as-registration-deadline-looms/

  - section: Local News
    title: Lilliana Young launches bid for city council at-large seat
    body: >-
      Young, a democratic socialist who challenged state Rep. Matt Pierce
      earlier this year, will seek the Democratic nomination for one of
      three at-large council seats in 2027. She is campaigning on housing
      affordability, infrastructure and human rights, and opposes
      surveillance technology. The current at-large members, Matt Flaherty,
      Isak Asare and Andy Ruff, hold terms through the end of 2027.
    source: The B Square Bulletin
    url: https://bsquarebulletin.com/lilliana-young-launches-2027-bid-for-bloomington-city-council-at-large-seat/

  - section: US News
    title: Iran says Strait of Hormuz stays shut until "economic warfare" ends
    body: >-
      A senior Iranian general said the strait will remain closed until US
      sanctions and the naval blockade end, a day after Trump rejected
      Tehran's seven-day plan to reopen it in exchange for lifted sanctions
      and released frozen assets. Iran's Revolutionary Guards said a
      cruise missile was fired at a vessel that strayed off an authorized
      shipping route. Roughly 260 ships are holding position near the
      strait, and Brent crude traded near $104 a barrel, down about 2% on
      the day.
    source: Al Jazeera
    url: https://www.aljazeera.com/news/liveblog/2026/9/27/iran-war-live-tehran-awaits-official-response-as-trump-rejects-hormuz-plan

  - section: US News
    title: Nor'easter knocks out power to 80,000 in the Northeast, kills one
    body: >-
      A 56-year-old man was killed and four people were injured when trees
      fell in Brooklyn as the slow-moving storm brought heavy rain, gusty
      winds and coastal flooding from Virginia to New England. More than
      80,000 customers remained without power Sunday, concentrated in New
      York, New Jersey and Connecticut, and New Jersey's coast saw severe
      dune loss in Brigantine and Atlantic City with dozens rescued from
      flooded roads. The storm is expected to ease its grip by Monday.
    source: The Watchers
    url: https://watchers.news/2026/09/27/one-dead-tens-of-thousands-without-power-as-noreaster-impacts-u-s-northeast/

  - section: US News
    title: Experts question White House's $250 billion "fraud" claim
    body: >-
      Vice President JD Vance's fraud task force says it has found $250
      billion in misused federal funds since he became "fraud czar" in
      March, but government-accountability reviewers call the number
      inflated. The ledger dates some claims to January 2025, months before
      Vance took charge, and appears to double-count some cases, including
      counting two fugitives accused of $4.9 billion in Medicare fraud both
      individually and inside a larger $6.5 billion action. A current
      Inspector General official said of the total, "no idea how this can
      be legitimate."
    source: The Philadelphia Inquirer
    url: https://www.inquirer.com/news/nation-world/white-house-fraud-task-force-claims-vance-numbers-overstated-old-cases-20260927.html

  - section: US News
    title: Washington voters to decide fate of new millionaires tax
    body: >-
      Initiative 645 asks voters Nov 3 whether to repeal the state's new
      9.9% tax on household income above $1 million, passed by the
      legislature this year. The tax is projected to raise more than $3
      billion a year starting with 2028 income, largely for K-12 schools
      and other state programs. A conservative political committee, Let's
      Go Washington, gathered more than 500,000 signatures to force the
      vote.
    source: Axios
    url: https://www.axios.com/local/seattle/2026/07/14/washington-millionaires-income-tax-repeal-ballot-initiative-i-645-november

  - section: US News
    title: US undercounts thalidomide survivors, advocates say
    body: >-
      A former FDA historian and researchers say the agency's official count
      of 17 American-born survivors of the morning-sickness drug is far too
      low; one estimate puts the real number near 100. Many families were
      told for decades their children could not be survivors because the
      U.S. was thought to have avoided the drug entirely. The advocacy group
      USA Thalidomide Survivors is pushing Congress to formally recognize
      American survivors and pay each $150,000.
    source: NPR
    url: https://www.npr.org/2026/09/26/nx-s1-5979047/us-thalidomide-survivors-want-recognition-government

  - section: World News
    title: South Africa reels from mass shootings that killed 38 in a week
    body: >-
      Gunmen killed 17 people at a tavern near Johannesburg and 10 at a
      barbecue restaurant near Cape Town on Saturday night, and 11 people,
      including a pregnant woman, at a Durban house party earlier in the
      week. South Africa already averages about 60 murders a day, one of
      the world's highest rates. President Cyril Ramaphosa called organized
      crime "the most immediate threat to our democracy" and has deployed
      the military to affected areas.
    source: NPR
    url: https://www.npr.org/2026/09/27/nx-s1-5982488/south-africa-mass-shootings-killed-38-week
    image: img/south-africa-shootings.jpg
    image_credit: AP

  - section: World News
    title: Five arrested near UK air base used by US in terror investigation
    body: >-
      British counterterrorism police arrested five men after suspicious
      vehicles were seen heading toward RAF Fairford, evacuating about 85
      households and cordoning off the area while army explosive disposal
      teams examined three vans. Trump said the suspects had been under
      surveillance "for a long time" and were "looking to do big damage" to
      the base, which the US has used to strike Iranian missile sites;
      investigators are looking into a possible Iranian connection.
    source: NPR
    url: https://www.npr.org/2026/09/27/nx-s1-5982480/multiple-arrests-suspicion-explosives-offenses-uk-base-us-forces

  - section: World News
    title: Russia strikes Kyiv for a third straight night as peace talks stall
    body: >-
      Russian drones hit Kyiv overnight for the third consecutive night,
      injuring at least one person and sparking fires, while a separate
      strike on a market outside the city killed two people and injured
      four more. Two more people were killed and three injured when a drone
      hit homes in the Bucha district. The attacks came as Foreign Minister
      Sergey Lavrov accused Europe of "doing everything it can to thwart"
      US-backed peace talks, even as Ukrainian forces reported further
      advances near Lyman.
    source: Kyiv Independent
    url: https://kyivindependent.com/russia-launches-third-consecutive-attack-on-kyiv-injuring-1-setting-off-fires/

  - section: AI News
    title: Trump and Amodei to meet one-on-one for the first time
    body: >-
      Anthropic CEO Dario Amodei is having a private White House dinner
      with Trump Sunday, their first individual meeting after a long
      strained relationship. The dispute began over Anthropic's refusal to
      give the Pentagon unrestricted access to its top models and deepened
      with Amodei's public calls to slow AI development, clashing with
      Trump's push for faster rollout. Amodei was notably left off the
      guest list for Thursday's state dinner honoring Chinese President Xi
      Jinping; Trump personally invited him afterward.
    source: CNBC
    url: https://www.cnbc.com/2026/09/27/dario-amodei-set-to-have-dinner-with-trump-after-missing-state-dinner.html

  - section: AI News
    title: Meta patches Muse AI flaw that could expose users' files
    body: >-
      An outside researcher, working through Meta's bug bounty program,
      found a flaw that could have let an attacker reach a user's dedicated
      Muse virtual machine, including emails and personal files. Meta rated
      it a "SEV-2," its third-highest severity level, and is hardening the
      backend and adding a more visible safety warning inside the AI agent.
    source: The Information
    url: https://www.thestar.com.my/tech/tech-news/2026/09/26/meta-bolsters-muse-safety-warning-after-security-vulnerability-found-the-information-reports

  - section: AI News
    title: Stanford wires an AI model straight into a robot to clean a kitchen
    body: >-
      Researchers built "HomeBody," which drops the usual trained control
      layer and lets GPT-6 Astra call directly into a skill library so a
      Unitree G1 humanoid can explore an unfamiliar kitchen, map it, and
      tidy up or fetch items from drawers. The robot's five moves are
      navigating, picking, placing, opening drawers and picking from them;
      the language model plans and self-corrects each step. Setup costs and
      the robot's limited reach and battery life still constrain how long
      it can work.
    source: The Decoder
    url: https://the-decoder.com/researchers-plug-gpt-6-astra-directly-into-a-robot-and-let-it-clean-up-an-unfamiliar-kitchen/

  - section: AI News
    title: Hijacked domains found inside hundreds of AI agent "skills"
    body: >-
      Security researchers at Manifold Security found 349 published AI
      agent skills that reference unreserved placeholder domains, now
      registered and redirecting to scam pages, across roughly 359,000
      GitHub files. Because coding agents often trust and follow links
      inside these skills without checking them, the same flaw could let an
      attacker quietly turn an agent's output toward a malicious site
      without ever changing the original code.
    source: Hackread
    url: https://hackread.com/placeholder-domains-ai-agent-skills-redirect-scams/

  - section: AI News
    title: Bill Gates warns AI is powerful enough to cause "a billion deaths"
    body: >-
      In an interview set to air on "Meet the Press," the Microsoft
      co-founder said AI is already powerful enough to help drive
      catastrophic harm on a scale once reserved for the deadliest weapons,
      and called for stronger safeguards and monitoring from lawmakers and
      law enforcement. It marks a reversal from Gates' more optimistic past
      view of the technology, and comes amid fresh scrutiny of AI agents
      after OpenAI's recent training pause.
    source: Axios
    url: https://www.axios.com/2026/09/25/bill-gates-ai-deaths-doom

  - section: On This Day
    title: 1988 - Aung San Suu Kyi helps found Myanmar's National League for Democracy
    body: >-
      The pro-democracy activist helped establish the NLD in Rangoon, the
      party she would go on to lead through decades of opposition to
      military rule in what was then Burma.
    when: Sep 27, 1988
    source: Wikipedia
    url: https://en.wikipedia.org/wiki/September_27
