  - section: AI News
    title: Anthropic's IPO filing says Claude writes over 90% of its code
    body: >-
      The S-1 filed Nov. 2 says over 90% of Anthropic's code contributions in September were written by Claude, and that the value of its internal Claude use at list prices has exceeded monthly personnel costs since April, excluding stock compensation. That value grew more than 250-fold from January to September.

      An amended filing reports revenue of $33.2 billion for the nine months ended Sept. 30, up from $2.5 billion a year earlier, with $17.0 billion in the third quarter. It also says future models "may imminently meet" the company's threshold for AI-accelerated research, though no current model is designated as past it.
    source: AI News Today
    url: https://pasqualepillitteri.it/en/news/29574/anthropic-ipo-s1a-ai-research-threshold
