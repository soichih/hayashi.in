    title: Hurricane Polo heads toward Mexico's Baja California
    body: >-
      The Category 4 Pacific storm, which peaked at 180 mph winds, is
      expected to weaken to about Category 1 before landfall in Baja
      California Sur on Sept 26-27. Its heaviest wind and rain should stay
      offshore, but coastal Guerrero, Michoacan, Colima and Jalisco face
      heavy rain and mudslides.
