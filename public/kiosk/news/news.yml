  - section: Local News
    title: Rollo's superintelligence ban gets its first council hearing Wednesday
    body: >-
      Councilmember Dave Rollo's ordinance would bar deploying superintelligent AI systems in city limits, including systems hosted elsewhere but reached through a browser or API. It is on the Oct. 14 agenda. Because it is an ordinance rather than a resolution, it would carry penalties, which raises questions about the city's authority, enforcement and repeal.
    source: The B Square Bulletin
  - section: Local News
    title: Stinesville ICE decision pushed to November after Rokita letter
    body: >-
      The town board delayed its vote on a 287(g) agreement with ICE after Attorney General Todd Rokita's Oct. 6 letter said the police chief could sign it without board approval. Monroe County commissioners had asked the town to publish the agreement, take public comment and suspend work until a vote.
    source: The Bloomingtonian
