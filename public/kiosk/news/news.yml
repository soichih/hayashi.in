  - section: US News
    title: Trump says Iran war will end "probably right after the midterms"
    body: >-
      Trump said Iran has been "decimated" and faces a choice between "the easy way or the hard way." Iran says two more tankers were hit in the Strait of Hormuz, and its rial has slid past 2.7 million to the dollar. An Iranian deputy parliament speaker said talks with the US are underway.
    source: Iran International
    url: https://www.iranintl.com/en/liveblog/202610033293

  - section: US News
    title: Tennessee pauses executions after Christa Pike survives lethal injection
    body: >-
      Staff gave Christa Pike two doses of pentobarbital Wednesday night at Riverbend Maximum Security Institution, but she still had a heartbeat and was audibly snoring when her attorneys filed an emergency motion. Witnesses described at least seven needle attempts in one arm. She was taken to a hospital and was alive Thursday.

      It is the state's second failed execution in five months. Gov. Bill Lee has paused executions for the rest of the year.
    source: Nashville Banner
    url: https://nashvillebanner.com/2026/09/30/christa-pike-failed-execution-tennessee-pentobarbital/

  - section: World News
    title: Brazil votes in first round; Lula and Flavio Bolsonaro lead polls
    body: >-
      Final polls had Lula at 45% of valid votes and Sen. Flavio Bolsonaro at 40%, short of an outright win. If no candidate clears 50%, a runoff will be held Oct 25.
    source: Al Jazeera
    url: https://www.aljazeera.com/news/2026/10/3/what-to-know-about-brazils-2026-presidential-election

  - section: World News
    title: Israeli officials warned for years about foreign airline crew vetting
    body: >-
      After the Sept 30 flydubai attack, Army Radio reported that internal National Security Council documents show years of warnings that the Transportation Ministry was not meeting its duty to vet foreign crews. Its security division has three civil servants. The ministry calls the claims completely false.
    source: Times of Israel
    url: https://timesofisrael.com/liveblog-october-04-2026

  - section: AI News
    title: AI leaders sign voluntary safety pledge at the White House
    body: >-
      Executives from Anthropic, OpenAI, Google, Meta, xAI and Nvidia signed a one-page "Joint Commitment on Frontier Responsibilities." It promises internal monitoring for cyber, bio and chemical risks, independent auditors and board-level oversight. Trump called it "morally binding."

      Google, OpenAI and Anthropic are reportedly planning an industry-run safety standards body by early 2027. The FTC opened a broad investigation into OpenAI and Anthropic a day after the pledge.
    source: Fortune
    url: https://fortune.com/2026/10/01/trump-ai-regulation-luncheon-huang-amodei-pichai-brockman-zuckerberg-musk-joint-committment-frontier-responsibilities/

