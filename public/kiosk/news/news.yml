  - section: Local News
    title: Mother jailed in Bloomington case of 14-year-old's death
    body: >-
      A 32-year-old woman was booked into the Monroe County Jail Saturday evening on a felony neglect of a dependent warrant, with bond set at $250,000. The girl's father was booked Oct. 20 on a similar warrant. A probable cause affidavit filed Oct. 6 alleges months of restricted food and confinement before the girl died July 2, 2025. A revised autopsy cited complications of severe malnutrition and dehydration. Both defendants are presumed innocent.
    source: The Bloomingtonian
    url: https://bloomingtonian.com/2026/10/25/toris-mayfield-jailed-on-neglect-warrant-in-14-year-old-daughters-death/
  - section: Local News
    title: Monroe County health officer's exit leaves health department limited
    body: >-
