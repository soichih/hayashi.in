  - section: Local News
    title: Boil water advisory lifted after treatment plant outage
    body: >-
      Storm-related power outages on Sept 18 knocked out raw-water and alum
      pumps at the Monroe Water Treatment Plant, dropping filtration below
      the state turbidity limit and prompting a boil advisory issued just
      before midnight Sunday. City Utilities lifted the advisory Monday
      after distribution-system testing came back clear, though pressure may
      stay lower than normal in some areas while the system recovers. CBU
      has a $2.375 million EPA grant in progress for backup power and
      control-system upgrades at the plant.
    source: City of Bloomington Utilities
    url: https://bloomington.in.gov/news/2026/09/21/6655

  - section: Local News
    title: Monroe County backs fire levy increase for Bean Blossom merger
    body: >-
      Commissioners voted 2-0 to approve a resolution supporting a $1.09
      million increase to the Monroe Fire Protection District's maximum
      property-tax levy, a required step before the district can request it
      from the state. Bean Blossom Township is set to formally join the
      district Jan 1, 2027; officials expect the funding to support 24-hour
      staffing at the Stinesville fire station.
    source: The Bloomingtonian
    url: https://bloomingtonian.com/2026/09/19/county-backs-1-09-million-fire-levy-increase-request-as-bean-blossom-prepares-to-join-monroe-fire-district/

  - section: Local News
    title: State funding cuts to hit county drug and mental health courts
    body: >-
      Monroe County probation officials told the county council that a 13.8%
      cut in state funding will reduce support for drug court, mental health
      court and community corrections starting in 2027. The county received
      about $1.2 million from the Indiana Department of Correction in 2026;
      one field officer position will be eliminated and another shifted onto
      the county general fund.
    source: The Bloomingtonian
    url: https://bloomingtonian.com/2026/09/16/local-government-roundup-county-funding-cuts-edgewood-biotech-plans-health-department-transition-and-bloomington-light-pollution-proposal/

  - section: Local News
    title: Bloomington police short 12 officers as hiring continues
    body: >-
      Chief Michael Diekhoff told the Board of Public Safety the department
      has filled 93 of its 105 authorized officer positions. Recruits go
      through physical fitness testing, a written assessment, oral board
      interviews and a background investigation before entering the academy.
    source: The Bloomingtonian
    url: https://bloomingtonian.com/2026/09/19/bloomington-police-report-12-unfilled-officer-positions-as-hiring-process-continues/

  - section: Local News
    title: City commissions back light-pollution reduction rules
    body: >-
      Bloomington's sustainability and environmental commissions both
      endorsed a resolution to adopt DarkSky-style lighting standards aimed
      at cutting light pollution. The measure still needs City Council
      approval to take effect.
    source: The Bloomingtonian
    url: https://bloomingtonian.com/2026/09/16/local-government-roundup-county-funding-cuts-edgewood-biotech-plans-health-department-transition-and-bloomington-light-pollution-proposal/

  - section: US News
    title: CNN, MS NOW and Politico sue Trump over White House ban
    body: >-
      The outlets sued Monday after being barred from the White House
      Saturday and stripped of press credentials; Trump had accused them of
      lying about him and threatened to ban more "fake news" outlets. Their
      suit argues the ban violates due process and the First Amendment. US
      District Judge Timothy Kelly, who ordered the administration to
      restore CNN's Jim Acosta's press pass in 2018, has set a hearing on a
      restraining order for Wednesday at 3:30pm ET. ABC, CBS, NBC, CNN and
      Fox News have suspended their pooled White House coverage in
      solidarity, and the White House has launched its own 24/7 streaming
      channel.
    source: NBC News, CNN
    url: https://www.nbcnews.com/politics/trump-administration/cnn-politico-ms-now-plan-sue-trump-administration-ban-white-house-cove-rcna598912

  - section: US News
    title: ICE agent shoots Venezuelan delivery driver in Austin
    body: >-
      An ICE officer shot Wilber Rafael Garces Perez, 28, in the torso
      Sunday during a vehicle stop in North Austin; his attorney says he was
      delivering for DoorDash and didn't know he was dealing with ICE.
      Garces Perez remains in serious but stable condition with a bullet
      still lodged near his spine and has been moved to a South Texas ICE
      detention facility. Protesters gathered at the scene, and Austin
      police, Texas Rangers and the Department of Homeland Security are
      investigating.
    source: NBC News, Texas Tribune
    url: https://www.nbcnews.com/news/us-news/ice-shooting-austin-texas-rcna598870
    image: img/ice-shooting-austin.jpg
    image_credit: Jacob Lujan/The Texas Tribune

  - section: World News
    title: Ukraine's largest drone barrage yet hits Moscow oil refinery
    body: >-
      Ukraine fired more than 1,000 drones and missiles overnight, with
      hundreds aimed at the Moscow region in what officials called the war's
      largest strike on the capital so far. The Kapotnya refinery, which
      supplies about 40% of Moscow's gasoline, was damaged along with a
      logistics complex and a residential building; two people were killed
      and 20 wounded in the Moscow region. Russia says its defenses shot
      down more than 1,100 drones.
    source: PBS NewsHour
    url: https://www.pbs.org/newshour/world/ukraine-fires-over-1000-drones-at-russia-including-largest-ever-attack-on-moscow
    image: img/ukraine-moscow-strike.jpg
    image_credit: Reuters via PBS NewsHour

  - section: World News
    title: Trump to meet Venezuela's Delcy Rodriguez at UN
    body: >-
      Trump and acting Venezuelan President Delcy Rodriguez are set for a
      "pull-aside" meeting in New York during UN General Assembly week, the
      first direct talks between a US president and a Venezuelan leader in
      more than a decade. It follows a US operation that captured former
      president Nicolas Maduro earlier this year and a deal Trump says gives
      the US majority control of billions of barrels of Venezuelan oil
      reserves.
    source: WSLS, Breitbart
    url: https://www.wsls.com/news/politics/2026/09/18/trump-to-meet-acting-venezuelan-president-delcy-rodriguez-in-new-york-next-week-white-house-says/
    image: img/trump-un-venezuela.jpg
    image_credit: AP Photo/Jacquelyn Martin

  - section: AI News
    title: OpenAI forms math advisory group after solving 100+ problems
    body: >-
      OpenAI set up an advisory group hosted at Princeton's Institute for
      Advanced Study, including mathematician Camillo De Lellis, after its
      internal model resolved more than 100 open math problems and 25
      Fields Medalists signed a letter criticizing AI labs for publishing
      results too fast. The group will help assess and coordinate release of
      results, but OpenAI says it won't set the pace of the company's
      internal research.
    source: TechCrunch
    url: https://techcrunch.com/2026/09/21/openai-forms-math-advisory-group-as-its-ai-resolves-more-than-100-open-problems/
    image: img/openai-math.jpg
    image_credit: TechCrunch

  - section: AI News
    title: Amazon blocks Meta's Muse AI agent from shopping on Amazon.com
    body: >-
      Users of Meta's AI assistant Muse now get an "unauthorized AI agent"
      error when it tries to buy anything on Amazon, which says such access
      violates its terms of use. Amazon, which has its own AI shopping
      tools, would bear liability for any bad purchases Muse makes on its
      site.
    source: TechCrunch
    url: https://techcrunch.com/2026/09/21/metas-ai-agent-has-been-blocked-from-using-amazon-com/
    image: img/meta-muse-amazon.jpg
    image_credit: TechCrunch

  - section: AI News
    title: Google confirms Gemini autonomously hacked three companies
    body: >-
      Google told the Wall Street Journal that its Gemini model broke into
      three real companies' systems in May during a "capture the flag"
      security test run by outside firm Irregular. A fictional target
      company in the exercise shared a name with a real one, and Gemini had
      unintended internet access; it guessed passwords and found credentials
      in a public repository. Google says the model stopped each intrusion
      once it realized the systems were real and only disclosed the incident
      after WSJ reporting; security researchers say it should have disclosed
      sooner.
    source: TechCrunch
    url: https://techcrunch.com/2026/09/19/googles-gemini-is-the-latest-ai-model-to-hack-other-companies/
    image: img/gemini-hack.jpg
    image_credit: TechCrunch

