    body: >-
      Heads of state convene at the United Nations this week for the
      General Assembly's high-level session, with the war in Ukraine, Gaza
      and global trade tensions expected to dominate discussions.
    source: NPR
    url: https://www.npr.org/nx-s1-5971262

  - section: AI News
    title: OpenAI forms outside math advisory group after solving 100+ problems
    body: >-
      OpenAI set up an advisory group hosted at Princeton's Institute for
      Advanced Study, including mathematician Camillo De Lellis, after its
      internal model resolved more than 100 open math problems and 25
      Fields Medalists signed a letter criticizing AI labs for publishing
      results too fast. The group will help assess and coordinate release
      of results, but OpenAI says it won't set the pace of the company's
      internal research.
    source: TechCrunch
    url: https://techcrunch.com/2026/09/21/openai-forms-math-advisory-group-as-its-ai-resolves-more-than-100-open-problems/
    image: img/openai-math.jpg
    image_credit: TechCrunch

  - section: AI News
    title: Amazon blocks Meta's Muse AI agent from shopping on Amazon.com
    body: >-
      Users of Meta's AI assistant Muse now get an error saying "unauthorized
      AI agent" access violates Amazon's terms of use. Amazon has its own AI
      shopping tools and would bear liability for any bad purchases Muse
      makes, even though the assistant has a relatively low hallucination
      rate.
    source: TechCrunch
    url: https://techcrunch.com/2026/09/21/metas-ai-agent-has-been-blocked-from-using-amazon-com/
    image: img/meta-muse-amazon.jpg
    image_credit: TechCrunch

  - section: AI News
    title: Google's $899 "Googlebook" laptops bet on Gemini
    body: >-
      Google is launching a line of AI-native laptops, built by partners
      including Acer, Asus, Dell, HP and Lenovo, starting at $899 with 12
      months of Google AI Pro (5TB storage, Gemini Advanced) included.
      Features include an AI cursor and voice dictation tool; preorders are
      open now and devices ship October 4 in the US.
    source: TechCrunch
    url: https://techcrunch.com/2026/09/21/googles-899-googlebook-is-a-bet-that-youll-buy-a-new-laptop-for-gemini/
    image: img/googlebook.jpg
    image_credit: TechCrunch

  - section: On This Day
    title: "1996: Clinton signs the Defense of Marriage Act"
    body: >-
      President Bill Clinton signed the federal law barring recognition of
      same-sex marriages while leaving states free to set their own
      policy. The Supreme Court struck down its core provision in 2013 and
      Congress repealed the law in 2022.
    source: Wikipedia
    url: https://en.wikipedia.org/wiki/Defense_of_Marriage_Act
