  - section: Local News
    title: Rollo's superintelligence ban gets its first council hearing Wednesday
    body: >-
      Councilmember Dave Rollo's ordinance would bar deploying superintelligent AI systems in city limits, including systems hosted elsewhere but reached through a browser or API. It is on the Oct. 14 agenda for introduction only, with no vote; final action could come Nov. 4.

      Violations carry fines up to $2,500, with daily penalties for continuing violations. Lifting it would require a 99.9999 percent safety assessment and approval from more than 95 percent of registered voters, though a simple council repeal may also be possible. Open questions include whether the city can regulate out-of-town technology and who decides what counts as superintelligent.
    source: The B Square Bulletin
    url: https://bsquarebulletin.com/analysis-bloomingtons-proposed-superintelligence-ban-raises-questions-about-authority-enforcement/
    image: img/rollo.jpg
    image_credit: The B Square Bulletin

