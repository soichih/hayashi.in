    title: Critical PHP flaws force some government sites offline; patch now
    body: >-
      Two PHP flaws, each rated 9.2 of 10, could let attackers run code on servers without logging in. PHP released fixes Oct. 21 for versions 8.2 through 8.5. Palo Alto Networks counts more than 22.6 million potentially vulnerable internet-facing instances. U.S. agencies and partners urged patching, and the FBI and NSA advised taking systems offline if they cannot be updated.
    source: ABC News
    url: https://abcnews4.com/news/nation-world/critical-php-flaws-put-millions-of-websites-at-risk-as-governments-pull-sites-offline
