    title: Hegseth fires Army general overseeing Pentagon strategic planning
    body: >-
      Lt. Gen. Brett Sylvia was removed amid a leak investigation over alleged information about Iran and Ukraine shared with reporters, according to unnamed officials. The Pentagon confirmed an investigation into the release of classified information, referred to the Justice Department, without naming anyone. Hegseth has removed roughly two dozen senior officers, and lawmakers are weighing defense bill language requiring consultation with Congress before such firings.
    source: NPR
    url: https://www.npr.org/nx-s1-6022185
