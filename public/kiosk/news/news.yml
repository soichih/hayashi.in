    title: Ellettsville-Richland merger recount deadline is Tuesday noon
    body: >-
      The merger passed 1,493 to 1,001 inside Ellettsville and 1,514 to 1,479 outside, a 35-vote margin where Indiana law requires a majority in both areas. A recount needs petition signatures from 10% of voters on the question plus a $100 deposit, filed by noon Nov. 17. Otherwise Richland Township government folds into the Town of Ellettsville on Jan. 1, 2027.
    source: The B Square Bulletin
    url: https://bsquarebulletin.com/ellettsville-richland-township-reorganization-passes-by-narrow-margin-outside-town-limits/
  - section: Local News
    title: Council to consider raising trash cart fees nearly 50% by 2029
    body: >-
      The City Council takes up the ordinance Wednesday, Nov. 18, for initial consideration only; passage that night would need unanimous support. The monthly fee for a 64-gallon cart would rise from $16.97 to $19.40 in 2027, $22.64 in 2028 and $25.13 in 2029. The 35-gallon cart goes from $9.28 to $13.89 and the 96-gallon cart from $25.46 to $37.70.

      The increases would end a $1.6 million annual general-fund subsidy of curbside collection over three years. Fees for yard waste, large items and appliances would also go up.
    when: Wed Nov 18
    source: The B Square Bulletin
    url: https://bsquarebulletin.com/bloomington-garbage-headline-city-cart-fees-could-climb-nearly-50-by-2029/
  - section: Local News
    title: Monroe County sues over Stinesville's ICE agreement; commissioners hire outside counsel
    body: >-
      The Stinesville town board voted 2-1 on Nov. 10 to ratify a 287(g) agreement that lets trained local police perform some immigration enforcement under ICE supervision. The police chief signed it in January without a board vote. The board held off on spending $122,500 in federal funds.

      The same day, the county commissioners sued to have the agreement declared invalid. On Nov. 12 they voted 3-0 to hire outside counsel.
    source: The B Square Bulletin
    url: https://bsquarebulletin.com/monroe-county-commissioners-hire-attorney-for-legal-action-over-stinesville-ice-agreement/
