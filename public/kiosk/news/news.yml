  - section: US News
    title: US adds just 29,000 jobs in September; unemployment rises to 4.2%
    body: >-
      Hiring fell well short of the roughly 90,000 economists expected, and July and August were revised down by a combined 60,000 jobs. Unemployment rose from 4.1% as 485,000 more people entered the labor force. Healthcare added only 17,000 jobs, and wage growth slowed to 3% a year. Layoffs remain low, but job seekers report it is hard to get hired.
    source: NPR
    url: https://www.kpbs.org/news/economy/2026/10/02/the-u-s-added-only-29-000-jobs-in-september-as-job-market-lacks-spark
    image: img/jobs-report-sept.jpg
    image_credit: Getty Images via NPR

