    title: Eisenkot has 28 days to form an Israeli government
    body: >-
      President Isaac Herzog picked the opposition candidate after parties holding 67 of the 120 Knesset seats recommended Eisenkot and those with 46 backed Netanyahu. A 14-day extension is possible. Netanyahu stays on as caretaker prime minister.
    source: NPR
    url: https://www.npr.org/g-s1-152536
