  - section: Local News
    title: Griffy Lake closes for controlled deer hunts on two November weekends
    body: >-
      The city will hold controlled hunts Nov. 14-15 and Nov. 21-22, open only to hunters selected through the Parks and Recreation process. All trails, shoreline and the lake close from 11pm Friday, Nov. 13 to 5am Monday, Nov. 16, and again from 11pm Friday, Nov. 20 to 5am Monday, Nov. 23. No watercraft may launch on either weekend.

      The hunts aim to reduce deer browsing on native vegetation. The city has run them since 2017. Questions: 812-349-3700.
    source: City of Bloomington
    url: https://bloomington.in.gov/news/2026/11/04/6687
  - section: Local News
    title: Ellettsville-Richland merger passes by 35 votes outside town limits
    body: >-
      Countywide the reorganization passed 3,007 to 2,480, but Indiana law requires a majority both inside and outside the town. Inside Ellettsville it passed 1,493 to 1,001; outside, 1,514 to 1,479. The plan folds Richland Township government into a larger Town of Ellettsville on Jan. 1, 2027.

      A recount isn't automatic. A voter would need petition signatures equal to 10% of voters on the question, plus a $100 deposit, filed by noon Tuesday, Nov. 17.
    source: The B Square Bulletin
    url: https://bsquarebulletin.com/ellettsville-richland-township-reorganization-passes-by-narrow-margin-outside-town-limits/
  - section: Local News
    title: Democrats lead Monroe County races; voters reject bail question
    body: >-
      In unofficial results, Democrat Tree Martin Lucas leads Republican Julie Hays 69.8% to 30.2% for county clerk, and Democrat Judith Sharp leads independent Jenee Trimble for assessor. Monroe County voters rejected Public Question 1 on denying bail to some defendants, 59% to 41%, and approved Public Question 2 on city and town judge residency, 55% to 45%.

      The tightest local contests were the Richland school board, where Dennis Adams leads by 77 votes, and the Clear Creek Township trustee race, where Democrat Susan Luther leads by 71.
    source: The Bloomingtonian
    url: https://bloomingtonian.com/2026/11/04/democrats-lead-monroe-county-races/
