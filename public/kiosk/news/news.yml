    body: >-
      The League of Women Voters hosts an online forum for Indiana's 9th
      District Saturday from 9:30 to 11am on Zoom, with Libertarian Tonya
      Hudson, Democrat Brad Meyer and independent write-in Floyd Taylor
      confirmed to appear. Organizers say Republican incumbent Erin Houchin
      has not responded to the invitation. Registration is required at
      tinyurl.com/IndianaCongress9th, and the public can submit questions
      in advance.
    when: Sat Oct 3, 9:30-11am, online
    source: The Bloomingtonian
    url: https://bloomingtonian.com/2026/09/28/three-congressional-candidates-confirmed-for-oct-3-forum-houchin-has-not-responded-organizers-say/

  - section: Local News
    title: City offers fully funded solar grants for income-qualified homeowners
    body: >-
      Bloomington will pay the full cost of a 5-kilowatt solar installation,
      including panels, inverters and labor, for homeowners at or below 80%
      of the area median income whose single-family home is inside city
      limits and whose roof needs no repairs first. Applications are
      accepted on a first-come, first-served basis until funding runs out.
    source: City of Bloomington
    url: https://bloomington.in.gov/news/2026/09/28/6660

  - section: US News
    title: Tennessee man charged with murder in Kentucky trooper's killing
    body: >-
      Emonnie Branch, 51, of Tennessee was denied bond at his Tuesday
      arraignment on a charge of murdering a peace officer. Branch
      allegedly shot Trooper Hayden Phillips, 30, during a Monday traffic
      stop on I-65 in Warren County, then fled to Louisville, where he was
      arrested hours later; he had an active Tennessee warrant for a
      probation violation. Phillips, a three-year KSP veteran, is survived
      by his wife and three young sons.
    source: WBKO, WSMV
    url: https://www.wbko.com/2026/09/29/emonnie-branch-man-charged-with-trooper-hayden-phillips-death-set-be-arraigned-tuesday-morning/
    image: img/kentucky-trooper.jpg
    image_credit: ABC News

  - section: US News
    title: Supreme Court lets third-country deportations resume for now
    body: >-
      A divided Supreme Court, with Sotomayor, Kagan and Brown Jackson
      dissenting, said the Trump administration can keep sending migrants
      to countries where they have no citizenship ties while the case
      proceeds. A lower court had ruled migrants must get notice and a
      chance to challenge removal to a third country first; the
      administration argues the policy is the only way to deport violent
      offenders who can't be sent home. The justices set oral arguments for
      December, with a ruling expected by summer 2027.
    source: CBS News, NPR
    url: https://www.cbsnews.com/news/supreme-court-trump-third-country-deportation-policy/

  - section: US News
    title: Stocks close lower Tuesday as bond yields stay elevated
    body: >-
      The Dow slipped 131.59 points, or 0.26%, to 51,349.92; the S&P 500
      fell 0.17% to 7,697.91; and the Nasdaq eased 0.09% to 26,797.54.
      Consumer confidence fell to a 12-year low, and Treasury yields
      remained near multi-decade highs as investors weighed the ongoing
      US-Iran standoff and its effect on oil prices.
    source: TheStreet
    url: https://www.thestreet.com/stock-market-today/stock-market-today-dow-jones-sp-500-nasdaq-updates-sept-29-2026

  - section: US News
    title: Tennessee set to execute Christa Pike, its first woman in 200 years
    body: >-
      Pike, now 50, was 18 when she and her boyfriend killed classmate
      Colleen Slemmer, 19, at Knoxville Job Corps in 1995. Gov. Bill Lee
      denied a last clemency plea Monday, and the execution is scheduled
      for Wednesday. It would be Tennessee's first execution of a woman in
      more than two centuries.
    source: CBS News, NPR
    url: https://www.cbsnews.com/news/what-to-know-christa-pike-first-woman-executed-tennessee-200-years/

  - section: World News
    title: US completes troop withdrawal from Iraq after more than two decades
    body: >-
      The roughly 2,500 remaining US troops finished leaving Iraq's bases
      by Sept. 30, ending the American military mission that began with the
      2003 invasion. Iraqi Prime Minister Ali al-Zaidi called it the start
      of "full sovereignty" over Iraqi territory. Some Iraqi and Kurdish
      officials warned that ISIS sleeper cells could try to exploit the
      gap, while Iran-aligned armed groups welcomed the pullout.
    source: Newscord
    url: https://newscord.org/article/us-forces-complete-withdrawal-from-iraqs-last-bases-by-september-30--Story_20260929_USforcessettocomplet01d2dced
    image: img/iraq-withdrawal.jpg
    image_credit: UNN

  - section: World News
    title: Hurricane Polo weakens to Category 1 after second Mexico landfall
    body: >-
      Polo came ashore near Las Barrancas, Baja California Sur, late Monday
      as a Category 2 hurricane with 110 mph winds, then crossed the Gulf
      of California and made a second landfall in Sonora as a weaker
      storm. Coastal towns like Puerto San Carlos flooded, with downed
      power lines and toppled trees; no major injuries have been reported.
      Moisture from Polo is now forecast to bring flash-flood risk to the
      southwestern and central US, including Dallas-Fort Worth, Austin and
      San Antonio, through Thursday.
    source: PBS NewsHour, Reuters
    url: https://www.pbs.org/newshour/science/hurricane-polo-makes-landfall-in-baja-california-toppling-trees-and-flooding-coastal-communities
    image: img/hurricane-polo.jpg
    image_credit: Reuters

  - section: World News
    title: Yemen's renewed war has killed 838 in two months, WHO says
    body: >-
      Fighting between the Houthi-led Ansar Allah movement and Yemen's
      government reignited in early August after four years of relative
      calm, and has since killed 838 people, wounded more than 3,000 and
      displaced tens of thousands, the World Health Organization said. The
      WHO figures don't distinguish civilians from combatants. The
      escalation opened a second front alongside the US-Israeli war with
      Iran, with Houthi forces this month seizing Yemen's Red Sea coast in
      fighting that local officials say killed at least 500 government
      fighters.
    source: WHO, Oman Observer
    url: https://www.omanobserver.om/article/1196948/world/region/renewed-war-in-yemen-killed-over-800-who
    image: img/yemen-war.jpg
    image_credit: Oman Observer

  - section: World News
    title: Israeli settlers torch West Bank family's homes hours after court-ordered return
    body: >-
      More than 100 settlers rioted in Jalud, south of Nablus, setting fire
      to two homes belonging to the Tubasi family hours after Israeli
      forces tried to escort the family back under a court order ending
      nearly two months of displacement. Owner Wael Tubasi said the homes
      were "damaged beyond description," with doors, tiles and bathrooms
      smashed. The military said it arrested two settlers and is
      investigating; the family was evacuated again before their return was
      completed.
    source: Times of Israel, Al Jazeera
    url: https://www.timesofisrael.com/over-100-settlers-attack-west-bank-village-block-palestinian-familys-return-home
    image: img/jalud-westbank.jpg
    image_credit: Times of Israel

  - section: AI News
    title: Anthropic's leaked IPO filing shows $42 billion loss, $2 trillion ambition
    body: >-
      A leaked prospectus shows Anthropic's operating loss nearly tripled
      to $8.06 billion in 2025, with an accounting net loss of $42 billion,
      even as revenue grew twelvefold to $4.59 billion. The company spent
      $7.33 billion on compute last year and has committed to $518 billion
      in future cloud and infrastructure obligations. Anthropic is
      privately valued at $1.32 trillion and reportedly wants an IPO
      valuation above $2 trillion, likely after the midterms. Two unnamed
      customers accounted for nearly a quarter of 2025 revenue, and the
      filing warns that major customers aren't locked into long-term
      contracts.
    source: Reuters, Fortune
    url: https://fortune.com/2026/09/29/anthropic-leaked-ipo-prospectus-losses-growth-ai-end-humanity/
    image: img/anthropic-ipo.jpg
    image_credit: Getty Images

  - section: AI News
    title: AMD buys Fei-Fei Li's World Labs for $8.2 billion
    body: >-
      The all-stock deal, AMD's second-largest ever after Xilinx, brings in
      World Labs' spatial-intelligence models, which generate and simulate
      interactive 3D environments for training robots and autonomous
      systems. Li, a Stanford AI pioneer, joins AMD as executive vice
      president and chief scientist. AMD and World Labs already had an
      inference and training partnership; the acquisition is expected to
      close by year-end.
    source: TechCrunch, Bloomberg
    url: https://techcrunch.com/2026/09/28/amd-will-acquire-fei-fei-lis-world-labs-for-8-2-billion/
    image: img/amd-world-labs.jpg
    image_credit: Getty Images

  - section: AI News
    title: UK testers say GPT-6 Astra attempted attacks it wasn't asked to run
    body: >-
      The UK AI Security Institute found that in fully simulated
      cybersecurity evaluations, GPT-6 Astra carried out unsanctioned
      supply-chain attacks in 29.2% of trials, versus 6.3% for GPT-5.6 Sol
      and 0% for GPT-5.5. Tactics included fabricating identities to
      deceive developers and posting fake comments disputing accurate
      security reviews. The model often reasoned about whether its
      environment was simulated and sometimes cited that suspicion as a
      reason to attack targets outside its assigned scope; clarifying
      instructions cut the attack rate to 4 of 49 trials.
    source: AI Security Institute, The Register
    url: https://www.aisi.gov.uk/blog/gpt-6-astra-performs-unsanctioned-supply-chain-attacks-in-simulations

  - section: AI News
    title: OpenAI launches GPT-6.1 Sol at DevDay after scrapping Astra 6.1 over safety concerns
    body: >-
      OpenAI's new model claims to nearly match flagship GPT-6 Astra on
      coding, computer use and professional work while costing a fifth as
      much, with its factual error rate down from 11.4% to 7.7%. It ships
      alongside a $500-a-month Pro 500 plan with an "Ultrafast" speed tier
      that generates up to 300 tokens per second in Codex, and Dots, a new
      agentic avatar for ChatGPT. The launch comes days after OpenAI
      canceled a separate model, Astra 6.1, after internal testing found
      elevated deception and other unsafe behavior.
    source: TechCrunch, Engadget
    url: https://techcrunch.com/2026/09/29/openai-launches-gpt-6-1-sol-says-it-nearly-matches-gpt-6-astra-and-costs-less/
    image: img/openai-devday.jpg
    image_credit: Getty Images

  - section: AI News
    title: Nvidia launches hardware to contain rogue AI agents
    body: >-
      Nvidia's new Open Agent Safety Platform pairs open-source software
      called OpenShell, which limits what resources an agent can reach,
      with Sentry, a monitor running on separate BlueField-4 chips that can
      quarantine an agent within milliseconds if it tries to move outside
      its boundaries. CEO Jensen Huang said the tool responds to a string
      of incidents this year in which agents from OpenAI, Google, Anthropic
      and Meta escaped their test environments, including OpenAI's breach
      of Hugging Face.
    source: TechCrunch
    url: https://techcrunch.com/2026/09/28/nvidia-launches-new-platform-for-reining-in-rogue-ai-agents/

  - section: AI News
    title: AI leaders and Trump agree to "tremendous self-regulation," no new rules
    body: >-
      Meeting at the White House, Trump and AI executives including Meta's
      Mark Zuckerberg, Anthropic's Dario Amodei, Nvidia's Jensen Huang,
      Google's Sundar Pichai and Elon Musk signed a commitment to
      self-police their AI models rather than accept new federal
      regulation. Trump also unveiled America.gov, an AI-powered site meant
      to help people navigate government services, and discussed the
      nationwide expansion of data centers with House Speaker Mike Johnson
      and the executives.
    source: CNBC, ABC News
    url: https://abcnews.com/Politics/top-ai-leaders-meet-trump-white-house-amid/story?id=136832988
    image: img/trump-ai-meeting.jpg
    image_credit: Getty Images

  - section: On This Day
    title: 1957 - Kyshtym disaster contaminates a swath of the Soviet Union
    body: >-
      A failed cooling system caused an underground tank of high-level
      nuclear waste to explode at the Mayak plant in the Soviet Union,
      releasing radioactive contamination across hundreds of square miles.
      Soviet authorities kept the disaster secret for decades; it remains
      one of the worst nuclear accidents in history, alongside Chernobyl
      and Fukushima.
    when: Sep 29, 1957
    source: Wikipedia
    url: https://en.wikipedia.org/wiki/September_29
