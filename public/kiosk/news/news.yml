  - section: US News
    title: CNN, MS NOW and Politico sue Trump over White House ban
    body: >-
      The outlets sued Monday after being barred from the White House
      Saturday and stripped of press credentials; Trump had accused them of
      lying about him and threatened to ban more "fake news" outlets. Their
      suit argues the ban violates due process and the First Amendment. US
      District Judge Timothy Kelly set a hearing on their restraining-order
      motion for 3:30pm ET Wednesday and ordered the Justice Department to
      file its response by Tuesday. ABC, CBS, NBC, CNN and Fox News have
      suspended their pooled White House coverage in solidarity, and the
      White House has launched its own 24/7 streaming channel.
    source: NBC News, CNN
    url: https://www.nbcnews.com/politics/trump-administration/cnn-politico-ms-now-plan-sue-trump-administration-ban-white-house-cove-rcna598912
    image: img/cnn-lawsuit.jpg
    image_credit: NBC News

  - section: US News
    title: ICE agent shoots Venezuelan delivery driver in Austin
    body: >-
      An ICE officer shot Wilber Rafael Garces Perez, 28, in the back of the
      neck Sunday during a vehicle stop in North Austin; his attorney says he
      was delivering for DoorDash and didn't realize he was dealing with ICE
      before he pulled over. He remains hospitalized-then-detained with a
      bullet still lodged near his spine, held in isolation at an ICE
      facility in Pearsall, and his communication privileges were revoked
      after he spoke to reporters. A judge set a September 30 hearing in San
      Antonio and ordered him to appear in person, which his attorney says
      means he won't be deported before then.
    source: NBC News, KUT
    url: https://www.nbcnews.com/news/us-news/ice-shooting-austin-texas-rcna598870
    image: img/ice-shooting-austin.jpg
    image_credit: NBC News

  - section: World News
    title: Trump tells UN he could "annihilate" Iran or reach a deal
    body: >-
      Addressing the UN General Assembly, Trump said he faces a "big
      decision" on Iran: strike a deal to end the war the US entered seven
      months ago, or "annihilate" the Islamic Republic. He said he expects a
      deal shortly after the US midterm elections, arguing Iran is waiting to
      see how he performs at the polls. His core demand remains that Iran
      give up any path to a nuclear weapon. He also said the US would
      "encourage" AI development rather than restrict it, and signed a deal
      with Greenland and Denmark expanding US security powers in the Arctic
      territory.
    source: NBC News, CBS News
    url: https://www.nbcnews.com/politics/trump-administration/trump-address-united-nations-general-assembly-iran-war-rcna599085
    image: img/trump-un-iran.jpg
    image_credit: AP Photo/Seth Wenig

  - section: World News
    title: Trump holds first meeting with Venezuela's Delcy Rodriguez
    body: >-
      Trump and acting Venezuelan President Delcy Rodriguez met on the
      sidelines of UN General Assembly week in New York Tuesday, the first
      in-person meeting between a US president and a Venezuelan leader since
      Washington's operation ousted Nicolas Maduro earlier this year. It
      follows a deal Trump says gives the US majority control of billions of
      barrels of Venezuelan oil reserves; some in Trump's circle worry the
      optics could make Rodriguez look too close to Washington back home.
    source: Axios, Breitbart
    url: https://www.axios.com/2026/09/17/delcy-rodriguez-venezuela-trump-un-general-assembly

  - section: World News
    title: Ukraine's largest drone barrage yet hits Moscow oil refinery
    body: >-
      Ukraine fired more than 1,000 drones and missiles overnight Saturday,
      with hundreds aimed at the Moscow region in what officials called the
      war's largest strike on the capital so far. The Kapotnya refinery,
      which supplies about 40% of Moscow's gasoline, was damaged along with a
      logistics complex and a residential building; two people were killed
      and 20 wounded in the Moscow region. Russia says its defenses shot
      down more than 1,100 drones.
    source: PBS NewsHour
    url: https://www.pbs.org/newshour/world/ukraine-fires-over-1000-drones-at-russia-including-largest-ever-attack-on-moscow
    image: img/ukraine-moscow-strike.jpg
    image_credit: Reuters

  - section: AI News
    title: Anthropic releases Opus 5.5, cheaper and less jargon-heavy
    body: >-
      Anthropic's new Opus 5.5 sets what the company calls its strongest
      benchmark performance yet, beating its own larger Fable model on many
      tasks. Output tokens cost $20 per million, down from $25 for the prior
      Opus, and the model runs faster on less compute. Anthropic also tuned
      its communication style to use less jargon and lead with the most
      important information. Cheaper Sonnet 5.5 and Haiku 5.5 versions are
      due in the coming weeks.
    source: TechCrunch
    url: https://techcrunch.com/2026/09/22/anthropic-releases-opus-5-5-with-lower-prices-and-fable-level-performance/

  - section: AI News
    title: OpenAI cuts prices with new GPT-6 Sol and Luna models
    body: >-
      OpenAI released updated Sol and Luna versions of GPT-6, priced at half
      of their GPT-5.6 predecessors thanks to caching and inference
      improvements. OpenAI says Sol, built for complex tasks like coding,
      makes about half as many mistakes as before; Luna targets clerical work
      such as document summarizing. Both are rolling out now in ChatGPT,
      Codex and the API, with Luna also reaching free users.
    source: TechCrunch
    url: https://techcrunch.com/2026/09/22/openai-launches-gpt-6-sol-and-luna/
    image: img/gpt6-sol-luna.jpg
    image_credit: TechCrunch

  - section: AI News
    title: Meta admits its Muse AI assistant copied OpenClaw's design
    body: >-
      Meta executive Nat Friedman acknowledged Muse was "definitely heavily
      inspired" by OpenClaw, the viral open-source AI agent, though he says
      Muse was built from scratch. Muse reportedly reused OpenClaw's
      workspace file naming and near-identical configuration files. Friedman
      said the team wanted Muse to be "something like OpenClaw" but scaled to
      billions of users.
    source: TechCrunch
    url: https://techcrunch.com/2026/09/22/meta-admits-muses-likeness-to-openclaw-isnt-a-coincidence/
    image: img/meta-muse-openclaw.jpg
    image_credit: TechCrunch

  - section: AI News
    title: OpenAI forms math advisory group after solving 100+ problems
    body: >-
      OpenAI set up an advisory group hosted at Princeton's Institute for
      Advanced Study, including mathematician Camillo De Lellis, after its
      internal model resolved more than 100 open math problems and 25
      Fields Medalists signed a letter criticizing AI labs for publishing
      results too fast. The group will help assess and coordinate release of
      results, but OpenAI says it won't set the pace of the company's
      internal research.
    source: TechCrunch
    url: https://techcrunch.com/2026/09/21/openai-forms-math-advisory-group-as-its-ai-resolves-more-than-100-open-problems/
    image: img/openai-math.jpg
    image_credit: TechCrunch

  - section: On This Day
    title: "1948: Operation Little Vittles begins in Berlin"
    body: >-
      During the Berlin Airlift, US pilot Gail Halvorsen began dropping candy
      on small parachutes to children below, after promising a group of kids
      at the airport fence he'd wiggle his wings before the drop. The
      "Candy Bomber" tradition grew into a full crew effort that delivered
      tons of sweets before the airlift ended.
    source: Wikipedia
    url: https://en.wikipedia.org/wiki/Gail_Halvorsen
