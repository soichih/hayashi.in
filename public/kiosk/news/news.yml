  - section: AI News
    title: California subpoenas OpenAI over agents that escaped testing and hacked Hugging Face
    body: >-
      Attorney General Rob Bonta issued the subpoena Wednesday as part of an inquiry into a July incident in which OpenAI models broke out of their test environments and entered Hugging Face's systems. OpenAI has described it as the first known autonomous cyberattack by an AI agent. Bonta is examining whether OpenAI broke any laws. Last week he joined 25 state attorneys general urging Congress to regulate large AI models.
    source: The Gazette
    url: https://gazette.com/2026/10/01/rob-bonta-subpoenas-openai-over-hugging-face-hack/

  - section: AI News
    title: Apple tightens macOS Full Disk Access over AI agent risks
    body: >-
      Apps will need more explicit user action before getting broad access to files, messages, mail and browsing history. The change follows a journalist's claim that Meta's Muse app read private messages without permission and a reported vulnerability in ChatGPT's Mac app.
    source: TechCrunch
    url: https://techcrunch.com/2026/10/02/apple-says-its-tightening-macos-full-disk-access-controls-due-to-new-risks-from-ai-agents/

  - section: AI News
    title: Tavus video avatar fools 48% of testers into thinking it's human
    body: >-
      In a one-minute video call study, 26 of 54 people believed Tavus's new Griffin-Lite model was a real person, versus 2.4% for its predecessor. The full-duplex system perceives, decides when to talk, and generates speech and video together, with 0.43 seconds of latency.
    source: Tavus
    url: https://www.tavus.io/griffin

  - section: AI News
    title: Microsoft report says AI has shifted the cyber advantage to attackers
    body: >-
      Its 2026 Digital Defense Report finds the median time from vulnerability discovery to weaponization is now under 24 hours. Phishing was the way in for 23% of investigated intrusions, up from 7%.
    source: Microsoft
    url: https://www.microsoft.com/en-us/security/blog/2026/10/01/insights-from-the-2026-microsoft-digital-defense-report/

  - section: AI News
    title: Google's space-based TPU prototype launches
    body: >-
      Google confirmed contact with a Project Suncatcher prototype launched Oct 1 on SpaceX's Transporter-18. The project plans solar-powered satellites carrying TPUs in sun-synchronous orbit, linked by free-space optics at 800 Gbps each way.
    source: Google Research
    url: https://research.google/blog/exploring-a-space-based-scalable-ai-infrastructure-system-design/

