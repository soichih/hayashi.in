  - section: AI News
    title: Colossal unveils GenoMorph AI to speed dodo revival work
    body: >-
      The platform combines 3D skull morphology, comparative genomics and developmental biology to find editable genes in species with little genetic data. The dodo has one known genome, versus about 100 for the woolly mammoth. GenoMorph has flagged about 2,300 candidate DNA edits tied to dodo skull and face structure, which Colossal plans to test in the lab.


      CEO Ben Lamm says the tool does not edit genes itself. Colossal also reports its Nicobar pigeon colony, the dodo's closest living relative, now has 36 birds.
    source: TechCrunch
    url: https://techcrunch.com/2026/10/14/colossal-biosciences-announces-new-ai-platform-to-help-accelerate-de-extinction-efforts/
    image: img/colossal-genomorph.jpg
    image_credit: TechCrunch
