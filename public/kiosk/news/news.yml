  - section: World News
    title: UAE calls flydubai cockpit attack a "terrorist act"
    body: >-
      The UAE attorney general says the copilot attacked the captain with a cockpit emergency axe on the Sept 30 Dubai-Tel Aviv flight. The injured captain still opened the cockpit door, and passengers subdued the attacker. The plane landed safely in Saudi Arabia with more than 180 people aboard. Social media accounts linked to the copilot posted videos featuring al-Qaeda figures after the attack, and Trump warned Iran would be hit hard if it is found to be behind it.
    source: Times of Israel
    url: https://timesofisrael.com/liveblog-october-03-2026

