    title: Gunmen kill seven at funeral in Jordan church
    body: >-
      Gunmen opened fire during a funeral at a church in Jordan's Karak governorate, killing seven and wounding 40, Jordanian authorities said. King Abdullah II called it a terrorist act. No group has claimed it, and the U.S. embassy in Amman said security was increased across Jordan.
    source: NPR
    url: https://www.npr.org/nx-s1-6015414
