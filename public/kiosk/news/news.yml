  - section: Local News
    title: Three 9th District candidates debate; Houchin skips the forum
    body: >-
      At a League of Women Voters forum on Saturday, Democrat Brad Meyer,
      Libertarian Tanya Hudson and write-in independent Floyd Taylor spoke on
      cost of living, health care, corporate influence, immigration and war
      powers. Republican incumbent Erin Houchin declined to attend.

      All three candidates called the Iran war unauthorized. Meyer backed
      universal coverage, Hudson focused on drug costs, and Taylor proposed
      repealing the Affordable Care Act while keeping private insurers.
    source: The Bloomingtonian
    url: https://bloomingtonian.com/2026/10/05/cost-of-living-corporate-influence-and-war-powers-dominate-9th-district-forum/

