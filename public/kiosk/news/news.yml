  - section: Local News
    title: Federal judge bars state investigator from threatening Bloomington man over "86" post
    body: >-
      U.S. District Judge Sarah Evans Barker issued a preliminary injunction Oct. 20 in a suit by Bloomington resident Lee Lawmaster against Kurt Spivey, director of investigations for the Indiana Attorney General's office. Spivey may not coerce or threaten legal sanctions to suppress Lawmaster's past or future political posts, including those using the "86" phrase.

      Lawmaster posted "86 Todd Rokita" on the attorney general's Facebook page April 29. Spivey visited his home May 1 and said the office "could easily indict" him. The judge denied a motion to dismiss, so the case continues. Because Spivey did not argue the posts were true threats, the court treated them as protected speech. The order does not stop the office from assessing reported threats.
    source: The Bloomingtonian
    url: https://bloomingtonian.com/2026/10/22/federal-judge-blocks-indiana-attorney-general-investigator-from-threatening-bloomington-man-over-political-posts/
  - section: Local News
    title: Council votes 7-0 to ban city use of license plate readers
    body: >-
      Bloomington's council passed an ordinance Oct. 14 barring the city from acquiring or operating automated license plate readers, or from requesting plate data collected by other agencies or private companies. Conventional security cameras stay legal, and permitted cameras cannot use facial recognition or automated tracking of people unless the council authorizes it.

      An amendment passed 5-2 allows police body cameras and lets police receive surveillance recordings tied to a case number. If the mayor signs, the city has 60 days to post guidelines for permitted cameras.
    source: The B Square Bulletin
    url: https://bsquarebulletin.com/bloomington-council-votes-7-0-to-ban-license-plate-readers-after-debate-over-some-exceptions/
  - section: Local News
    title: County inspector examines site of North Bryan Street deck collapse
    body: >-
      A deck collapsed at 135 N. Bryan St. at about 10:30pm Friday, Oct. 16. Firefighters helped with patient care and transport alongside IU Health Lifeline; the fire department did not say how many people were hurt. A Monroe County building inspector was scheduled to look at the site Wednesday, and the cause is not yet known. The fire department does not enforce building codes for single-family homes.
    source: The Bloomingtonian
    url: https://bloomingtonian.com/2026/10/19/county-inspector-to-examine-site-of-bloomington-deck-collapse/
  - section: Local News
    title: Convention center expansion on track; $660,000 demolition bid approved
    body: >-
      The Capital Improvements Board unanimously approved the bid from Denney Excavating on Oct. 21 to demolish five Seminary Pointe structures, a staging area for hotel construction. Demolition runs from November through December. The low bid of $478,800 was rejected.

      The expansion is still due for completion Jan. 8, with a dedication Jan. 12 at 2pm. A 200-room hotel is expected around early 2029.
    source: The B Square Bulletin
    url: https://bsquarebulletin.com/bloomington-convention-center-update-660k-bid-okd-for-seminary-pointe-demolition/
  - section: Local News
    title: County council approves $147 million budget, keeps commissioner pay at 85%
    body: >-
      Monroe County councilors voted 5-0 for a $147,020,534 spending plan for 2027, up 12.3%. They rejected Commissioner Julie Thomas's request to raise commissioners' pay to the full $82,955 base, so each will receive $70,512. Councilor David Henry said the question should wait until January, when the board's makeup changes.
    source: The B Square Bulletin
    url: https://bsquarebulletin.com/monroe-county-council-sticks-with-proposed-2027-salaries-keeps-commissioners-at-85/
  - section: Local News
    title: City proposes $6.87 million bond for aerial fire truck and street safety
    body: >-
      The package includes $2.5 million to replace the city's only aerial platform truck, out of service for more than four months, and $4.23 million for transportation, including $1.7 million for 10th Street between College and Park and $1.5 million for 3rd Street safety.

      Repayment would take a little over six years and cost about $33.70 a year per $100,000 of taxable assessed value, before credits. The council holds a public hearing and possible final vote Nov. 4.
    source: The B Square Bulletin
    url: https://bsquarebulletin.com/bloomington-proposes-6-87m-bond-issue-for-fire-truck-street-safety-plans-for-regular-borrowing/
