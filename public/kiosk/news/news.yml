  - section: Local News
    title: Indianapolis man, 18, arrested after Kirkwood shooting; all seven victims stable
    body: >-
      The seven people shot around 1:30am Sunday on East Kirkwood Avenue are four males and three females, ages 17 to 27, and all are in stable condition. Police believe three needed surgery. Six gave Indianapolis addresses and one a Greenwood address, and none are believed to be IU students.

      An 18-year-old Indianapolis man seen running from the scene with a gun was arrested near Dunn Meadow on allegations of resisting law enforcement and unlawful possession of a firearm. Police haven't determined whether he fired. Casings from two calibers were found, and investigators are reviewing surveillance video. Anyone with information can call Detective Chris Scott at 812-339-4477.
    source: The Bloomingtonian
    url: https://bloomingtonian.com/2026/11/01/update-all-seven-kirkwood-shooting-victims-in-stable-condition-indianapolis-man-arrested/
