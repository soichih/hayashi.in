  - section: Local News
    title: Council votes 7-0 to ban city use of license plate readers
    body: >-
      Bloomington's council passed an ordinance Oct. 14 barring the city from acquiring or operating automated license plate readers, or from requesting plate data collected by other agencies or private companies. Conventional security cameras stay legal, and permitted cameras cannot use facial recognition or automated tracking of people unless the council authorizes it.

      An amendment passed 5-2 allows police body cameras and lets police receive surveillance recordings tied to a case number. If the mayor signs, the city has 60 days to post guidelines for permitted cameras.
    source: The B Square Bulletin
    url: https://bsquarebulletin.com/bloomington-council-votes-7-0-to-ban-license-plate-readers-after-debate-over-some-exceptions/
    image: img/council-alpr.jpg
    image_credit: The B Square Bulletin
  - section: Local News
    title: Convention center expansion on track; $660,000 demolition bid approved
    body: >-
      The Capital Improvements Board unanimously approved the bid from Denney Excavating on Oct. 21 to demolish five Seminary Pointe structures, a staging area for hotel construction. Demolition runs from November through December. The low bid of $478,800 was rejected.

      The expansion is still due for completion Jan. 8, with a dedication Jan. 12 at 2pm. A 200-room hotel is expected around early 2029.
    source: The B Square Bulletin
    url: https://bsquarebulletin.com/bloomington-convention-center-update-660k-bid-okd-for-seminary-pointe-demolition/
  - section: Local News
    title: County council approves $147 million budget, keeps commissioner pay at 85%
    body: >-
      Monroe County councilors voted 5-0 for a $147,020,534 spending plan for 2027, up 12.3%. They rejected Commissioner Julie Thomas's request to raise commissioners' pay to the full $82,955 base, so each will receive $70,512. Councilor David Henry said the question should wait until January, when the board's makeup changes.
    source: The B Square Bulletin
    url: https://bsquarebulletin.com/monroe-county-council-sticks-with-proposed-2027-salaries-keeps-commissioners-at-85/
  - section: Local News
    title: Second Bloomington detainee wins bond after federal court order
    body: >-
      A federal judge ruled that Manuel Alejandro Nadal Ortiz, a Venezuelan man detained in Bloomington on Sept. 1, could not be held under the government's mandatory-detention reading, and ordered a bond hearing. He was granted a $15,000 bond on Oct. 19. A second man arrested the same day received a $10,000 bond Oct. 2. Both rulings lean on a 6th Circuit decision the U.S. Supreme Court has agreed to review, and neither settles their immigration cases.
    source: The B Square Bulletin
    url: https://bsquarebulletin.com/second-bloomington-immigration-detainee-wins-federal-court-order-for-bond-hearing/
