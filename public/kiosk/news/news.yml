    title: Israel launches multi-day Hebron operation after checkpoint attack
    body: >-
      The army began an operation in Hebron after Thursday's shooting attack by gunmen from the city. The IDF says it is limited to the area the attackers operated from and will last several days. Palestinians report all city entrances closed and dozens of residents forced from their homes. Israel votes Oct. 27.
    source: Times of Israel
    url: https://www.timesofisrael.com/liveblog-october-24-2026/
