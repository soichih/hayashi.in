    title: Tesla in self-driving mode hits I-70 work-zone signs; driver arrested for OWI
    body: >-
      A 57-year-old Brazil, Indiana woman was arrested after her 2016 Tesla, reportedly in self-driving mode, struck two arrow boards on eastbound I-70 in Vigo County around 10:30pm Thursday. No one was hurt. Police say her blood alcohol concentration was 0.14%. She faces preliminary charges including intoxicated and reckless driving in a work zone; the charges are allegations.
    source: The Bloomingtonian
    url: https://bloomingtonian.com/2026/11/20/brazil-indiana-woman-arrested-after-tesla-in-self-driving-mode-hits-construction-equipment-on-i-70/
