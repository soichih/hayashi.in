  - section: Local News
    title: Bloomington Transit proposes cutting four routes from Dec. 6
    body: >-
      The board voted 5-0 on Nov. 4 to seek public comment on temporary cuts that would remove about 237 driver hours a week from Dec. 6 through May 2027. Routes 2 West and 2 South would merge into one weekday route running hourly. Route 7 loses its weekday departures at 40 past the hour, Route 11 loses weekend service, and Route 16 drops from three buses to two Monday through Saturday.

      The cause is a driver shortage: overtime hit 1,100 hours in the latest two-week pay period, against a typical 300 to 500.

      Public hearing is Tue Nov. 17, 4:30-5:30pm at the downtown Transit Center, with a final vote expected that day. Comments are open Nov. 5 through Dec. 5.
    source: The B Square Bulletin
    url: https://bsquarebulletin.com/possible-bus-service-cuts-bloomington-transit-board-sets-public-hearing/
  - section: Local News
    title: Ellettsville-Richland merger passes by 35 votes outside town limits
    body: >-
      Countywide the reorganization passed 3,007 to 2,480, but Indiana law requires a majority both inside and outside the town. Inside Ellettsville it passed 1,493 to 1,001; outside, 1,514 to 1,479. The plan folds Richland Township government into a larger Town of Ellettsville on Jan. 1, 2027.

      A recount isn't automatic. A voter would need petition signatures equal to 10% of voters on the question, plus a $100 deposit, filed by noon Tuesday, Nov. 17.
    source: The B Square Bulletin
    url: https://bsquarebulletin.com/ellettsville-richland-township-reorganization-passes-by-narrow-margin-outside-town-limits/
