  - section: Local News
    title: Mayor won't sign Bloomington's ban on artificial superintelligence
    body: >-
      Mayor Kerry Thomson said Thursday she will not sign Ordinance 2026-29, which the City Council passed 7-0 on Nov. 4. The ordinance, sponsored by Councilmember Dave Rollo, would prohibit distributing or deploying artificial superintelligence in the city. Thomson cited unclear enforcement and city authority, concerns about monitoring private digital activity, and the risk of discouraging investment. She said Rollo is open to revisions.

      If she neither signs nor vetoes within 10 days, the ordinance counts as vetoed, and the council could override with a two-thirds vote.
    source: The Bloomingtonian
    url: https://bloomingtonian.com/2026/11/19/mayor-thomson-declines-to-sign-bloomingtons-artificial-superintelligence-ban/
