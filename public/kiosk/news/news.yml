  - section: US News
    title: Supreme Court opens new term with climate liability case
    body: >-
      With eight justices hearing arguments Monday, the court takes up
      whether Boulder, Colorado, and Boulder County can sue Exxon Mobil and
      Suncor Energy over climate damages. The county says the companies
      deceived the public about fossil fuel harms and wants to recover costs
      from disasters, including the 2021 Marshall Fire that destroyed more
      than 1,100 homes. The companies argue only the federal government can
      address climate change, and the Trump administration backs them.

      Justice Alito stepped aside because of fossil fuel investments. A 4-4
      tie would leave the Colorado Supreme Court ruling in place and let the
      suit proceed. The outcome could affect more than two dozen similar
      cases.
    source: NPR
    url: https://www.kpbs.org/news/politics/2026/10/05/supreme-courts-new-term-kicks-off-with-blockbuster-climate-change-case
    image: img/scotus-climate.jpg
    image_credit: NPR / KPBS

  - section: World News
    title: Brazil's presidential race heads to Lula-Bolsonaro runoff
    body: >-
      Right-wing Senator Flavio Bolsonaro finished first on Sunday with about
      47 percent to President Lula's 45 percent, short of the majority needed
      to win outright. The two meet in a runoff on October 25. Bolsonaro is a
      Trump ally and the son of former president Jair Bolsonaro, who is
      serving a 27-year sentence under house arrest for plotting to overturn
      the 2022 election.
    source: NPR
    url: https://www.npr.org/2026/10/04/nx-s1-5981181/brazil-presidential-lula-bolsonaro

  - section: AI News
    title: Trump names Jay Clayton AI czar, creates Super Intelligence Force
    body: >-
      The director of national intelligence will chair a new White House task
      force with FTC Chair Andrew Ferguson, Pentagon research chief Emil
      Michael and OPM Director Scott Kupor. It has 120 days to report on AI
      risks and opportunities and recommend the federal government's role.

      Clayton rejected pausing development of advanced models, calling
      superintelligence a national security issue.
    source: NPR
    url: https://www.npr.org/2026/10/04/nx-s1-5990781/jay-clayton-ai-czar-trump

  - section: On This Day
    title: 2000 - The Bulldozer Revolution in Serbia
    body: >-
      During protests over disputed election results, a heavy-equipment
      operator drove a loader into the Radio Television of Serbia building in
      Belgrade, giving the uprising its name.
    source: Wikipedia
    url: https://en.wikipedia.org/wiki/October_5
