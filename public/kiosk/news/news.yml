    title: Jury convicts Bryce Leighton of murder in 2023 killing of Tara Langley
    body: >-
      The Monroe County Prosecutor's Office says the jury reached its verdict this week. Deputies were called to a home on East State Road 45 around 1:30am on Nov. 4, 2023, and found Langley dead in the attached garage. Leighton told investigators the shot came in a blur after she approached him with a stun gun. A sentencing date was not given.
    source: The Bloomingtonian
