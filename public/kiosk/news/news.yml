  - section: US News
    title: Nvidia CEO Jensen Huang stays on as board probes his ties to a suspected Chinese spy
    body: >-
      Huang acknowledged an affair with an executive at Chinese AI company Megaspeed, whom the Trump administration suspects of passing information to China's Ministry of State Security. China denies the accusation. Nvidia's independent directors, with outside counsel, are investigating and say they have no reason to believe national security or company secrets were compromised.

      Nvidia shares fell about 6% Monday. President Trump called Huang an honorable guy, and House Republican committee chairs have asked him for a closed-door briefing on Nov. 18. The espionage claims are unverified.
    source: Axios
    url: https://axios.com/2026/11/09/jensen-huang-spy-scandal-ai
  - section: US News
    title: Supreme Court lets Big Bend border wall construction resume
    body: >-
      In an unsigned opinion on Nov. 9, the Court paused a federal judge's order that had halted wall construction in West Texas's Big Bend region while the case continues. The justices said the government is exceedingly likely to prevail on the argument that the judge could not weigh the challengers' major-questions claim. Justice Ketanji Brown Jackson would have denied the request.

      Opponents include environmental groups and Republican Sen. John Cornyn. The administration says the wall is needed to stop cartel activity, and says no steel walls are planned inside Big Bend National Park.
    source: SCOTUSblog
    url: https://www.scotusblog.com/2026/11/supreme-court-allows-trump-administration-to-continue-border-wall-construction/
