  - section: Local News
    title: Monroe County ends notice rule before clearing belongings from county land
    body: >-
      Commissioners voted unanimously to drop the requirement for three
      days' warning before removing belongings from county land. Owners now
      get seven days after removal to recover items. The county attorney said
      belongings kept being added while crews cleared sites, forcing repeat
      notices.

      The county is spending about $100,000 on cleanup, with $35,000 more
      approved for 10 days of work at the Thompson property. Commissioners
      also approved $162,378.82 for the Streets to Stability rental
      assistance program. About 150 people are unhoused in Monroe County.
    source: The Bloomingtonian
    url: https://bloomingtonian.com/2026/09/24/monroe-county-ends-three-day-warning-requirement-before-removing-belongings-from-county-land/

  - section: Local News
    title: MCCSC starts facilities master plan as 2027 budget shrinks
    body: >-
      The school district begins an 8-10 month facilities master plan
      review with input from teachers, parents and students. The proposed
      2027 budget is $3.07 million below 2026, and the board votes on it
      Oct 27. The district serves 9,937 students in 23 schools.

      Elementary iPads are now restricted at lunch and recess without direct
      staff supervision, and more behavioral therapists were added.
    source: The Bloomingtonian
    url: https://bloomingtonian.com/2026/09/23/mccsc-begins-facilities-master-plan-process-as-proposed-2027-budget-decreases/

  - section: US News
    title: Senate again rejects Iran war powers resolution, 49-50
    body: >-
      Republicans blocked the resolution by one vote, the 13th Senate vote
      on the issue as the war enters its fifth month. Republican Sens.
      Collins, Murkowski, Paul and Tillis voted for it; Democrat John
      Fetterman voted no and Sen. Angela Alsobrooks missed the vote.
    source: NPR
    url: https://www.npr.org/2026/09/24/nx-s1-5980318/senate-iran-war-powers-vote

  - section: US News
    title: 30-year mortgage rate tops 7% for first time since January 2025
    body: >-
      The average 30-year fixed rate reached 7.03%, up from 6.95% last
      week. The Federal Reserve raised its target rate a quarter point on
      Sept 16 to 3.75%-4.00%, and inflation worries and high oil prices are
      adding pressure. Experts expect rates to keep rising in the next month
      or two.
    source: CBS News
