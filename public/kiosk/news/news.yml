    title: Monroe County sues over Stinesville's ICE agreement; commissioners hire outside counsel
    body: >-
      The Stinesville town board voted 2-1 on Nov. 10 to ratify a 287(g) agreement that lets trained local police perform some immigration enforcement under ICE supervision. The police chief signed it in January without a board vote. The board held off on spending $122,500 in federal funds.

      The same day, the county commissioners sued to have the agreement declared invalid. On Nov. 12 they voted 3-0 to hire outside counsel.
    source: The B Square Bulletin
    url: https://bsquarebulletin.com/monroe-county-commissioners-hire-attorney-for-legal-action-over-stinesville-ice-agreement/
