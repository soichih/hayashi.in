    source: NPR
    url: https://www.npr.org/nx-s1-6039357
  - section: World News
    title: Nine months into the Iran war, Trump appears to be holding the status quo
    body: >-
      Qatar-mediated talks are stalled. Iran offers a short pause on ship attacks but demands seven conditions, including sanctions relief and an end to the U.S. blockade, which Secretary of State Marco Rubio called absurd. The U.S. is sending a third aircraft carrier and escorting tankers through the Strait of Hormuz.

      The IMF says Gulf economies are in recession. Separately, full-scale fighting between Saudi Arabia and the Houthis has resumed, with about 330,000 Yemenis displaced, the UN says.
    source: NPR
    url: https://www.npr.org/g-s1-153578
