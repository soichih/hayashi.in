  - section: Local News
    title: Monday is the last day to register for the Nov 3 election
    body: >-
      Registration closes Oct 5. In-person early voting in Monroe County opens Tuesday, Oct 6, and absentee ballot requests are running ahead of the 2022 pace.
    source: The B Square Bulletin
    url: https://bsquarebulletin.com/monroe-county-early-in-person-voting-starts-tuesday-absentee-ballot-pace-ahead-of-2022/

  - section: Local News
    title: City council votes Oct 7 on 2027 budget with staffing cuts in play
    body: >-
      After a Sept 30 work session, council members are weighing cuts to the mayor's office, including a vacant public engagement director post, a communications coordinator and a legislative affairs specialist. Council president Isak Asare also proposed funding Economic and Sustainable Development positions for only part of 2027 to force restructuring.

      Amendments with clearer support include a $600,000 cut to the sanitation subsidy, offset by higher trash cart fees, and removing a $2.5 million parking meter fund placeholder. Final adoption is likely Oct 14.
    source: The B Square Bulletin
    url: https://bsquarebulletin.com/2027-budget-talks-for-bloomington-city-council-turn-to-potential-staffing-cuts/

