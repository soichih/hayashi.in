  - section: AI News
    title: AI-found PHP flaws prompt NSA warning
    body: >-
      The NSA warned Wednesday of two critical PHP vulnerabilities that could expose a server's files or databases. OpenAI's "Patch the Planet" effort and Google's Wiz team used AI tools to find them. Patches are out, and OpenAI reports no known exploits.

      The flaws reach back to PHP 5. Sites on PHP 8.1 or older, which are no longer supported, need to move to 8.5.12, and the NSA advises taking unpatchable sites offline.
    source: TechCrunch
    url: https://techcrunch.com/2026/10/21/php-armageddon-openai-googles-wiz-find-ancient-holes-panicking-the-internet/
  - section: AI News
    title: Recursive releases Flint, a free coding model that runs on a laptop
    body: >-
      Flint is a mixture-of-experts model that activates 2.5 billion of its 40 billion parameters per task. It is free on Hugging Face under Apache 2.0. Recursive says it generated about 131 tokens per second on an M4 Pro MacBook Pro and beat other sub-50-billion-parameter models on SWE-Bench Verified. The company says it was developed largely with its automated research system.
    source: TechCrunch
    url: https://techcrunch.com/2026/10/21/recursive-launches-flint-a-laptop-coding-model-it-says-was-largely-built-by-ai/
  - section: AI News
    title: Anthropic circulates draft bill letting regulators block risky AI releases
    body: >-
      Politico reports Anthropic's draft would let regulators halt a model's release if there is a foreseeable, imminent risk of more than 50 deaths or $1 billion in property damage. Evaluators registered with the Commerce Department would flag such risks within 72 hours, and Commerce would ask a federal judge to stop the release. Anthropic confirmed the draft reflects its Advanced AI Framework.
    source: TechCrunch
    url: https://techcrunch.com/2026/10/20/anthropic-pitches-ai-safety-bill-that-may-block-a-model-if-50-people-could-be-killed/
  - section: AI News
    title: Walmart opens its store to AI shopping agents as Amazon blocks them
    body: >-
      Walmart's Agent Gateway lets approved agents search inventory and buy for shoppers. Agent Profiles, due next month, will track an agent's purchases separately, with per-purchase approval or spending limits. Noncompliant agents will be blocked.
    source: TechCrunch
    url: https://techcrunch.com/2026/10/21/while-amazon-blocks-ai-agents-walmart-rolls-out-the-welcome-mat/
  - section: AI News
    title: Meta's Muse app tops 10 million users
    body: >-
      Meta said on its earnings call that about 25% of people who set up Muse use it daily. Shopping is a top use, and Meta plans to take a cut of commerce and charge power users for advanced models while keeping the app free for most.
    source: TechCrunch
    url: https://techcrunch.com/2026/10/21/meta-says-muse-has-over-10m-users-with-shopping-a-top-activity/
