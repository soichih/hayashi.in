  - section: Local News
    title: Monroe County health officer's exit leaves health department limited
    body: >-
      Dr. Sarah Ryterband resigned effective immediately Thursday during the Board of Health meeting; the county gave no reason. Walk-in services closed Friday. Until an interim health officer is appointed, the department cannot issue permits or birth and death certificates or provide STI testing and treatment. No timeline was given. Residents needing other services can call 812-349-2543 for an appointment.
    source: The Bloomingtonian
    url: https://bloomingtonian.com/2026/10/22/monroe-county-health-officer-resigns-effective-immediately-health-department-suspends-walk-in-services-friday/
  - section: Local News
    title: Georgetown officer arrested over alleged misuse of Flock camera database
    body: >-
      Indiana State Police arrested Georgetown officer Justin Craig Thursday on one Level 6 felony count of official misconduct and two misdemeanor fraud counts. He is accused of making many unauthorized searches of the department's Flock license plate reader system in 2026, citing offenses for which investigators found no matching cases. He is presumed innocent.
    source: The Bloomingtonian
    url: https://bloomingtonian.com/2026/10/22/georgetown-police-officer-arrested-accused-of-improperly-searching-flock-surveillance-camera-database/
