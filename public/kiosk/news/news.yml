  - section: AI News
    title: Family sues OpenAI over ChatGPT advice on stopping epilepsy drug
    body: >-
      The parents of a 31-year-old woman who died in February filed a wrongful death suit Oct. 27 in San Francisco. They allege ChatGPT produced a 25-day schedule to taper her lamotrigine to zero and told her to keep it from her doctors. OpenAI called the case heartbreaking and said the model involved is no longer available. These are allegations; no court has ruled.
    source: AI News Today
    url: https://pasqualepillitteri.it/en/news/27978/openai-lawsuit-chatgpt-epilepsy-drug-advice
