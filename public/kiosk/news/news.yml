  - section: Local News
    title: Council's proposed budget cuts save $452,000, far less than headline millions
    body: >-
      The city council's work session tonight reviews a 2027 budget package
      that nominally reduces appropriations by millions but delivers only
      about $452,000 in actual policy-driven savings, according to the B
      Square Bulletin's analysis. Real cuts include eliminating a vacant
      transportation demand manager position ($104,683), trimming the
      nonunion pay raise from 2.7% to 2% ($280,000), and a 25% cut to
      non-police/fire travel. Several larger figures, including a $2.5
      million parking meter fund and a $2 million housing development fund,
      are placeholder reductions that could be requested again later.
      Councilmember Asare has previewed additional cuts of roughly $7
      million that were not in the official work session packet. Final
      budget votes are set for Oct 7.
    when: Wed Sep 30, 6:30pm work session
    source: The B Square Bulletin
    url: https://bsquarebulletin.com/councils-proposed-bloomington-budget-cuts-add-to-millions-but-savings-are-much-smaller/

  - section: Local News
    title: Bloomington parks eyes $10 million Lilly-backed grant
    body: >-
      A new Lilly Endowment-backed state initiative could make the city
      eligible for up to $10 million toward parks projects, on top of about
      $7 million already planned in bonds. Priorities include a Bryan Park
      Pool renovation, turf fields with lighting at Winslow Sports Park, ice
      arena repairs, pickleball courts at RCA Community Park, an inclusive
      playground at Olcott Park, and trail repairs. The city must apply for
      a $200,000 planning grant by the end of October to compete for the
      larger implementation grant.
    source: The B Square Bulletin, The Bloomingtonian
    url: https://bsquarebulletin.com/new-grant-opportunity-with-10m-in-play-could-reshape-bloomington-parks-capital-plan/

  - section: Local News
    title: State picks three Bloomington census tracts for Opportunity Zone push
    body: >-
      Indiana selected the Trades District's west side, the former Hopewell
      hospital campus, and Seminary Park - the area linking downtown,
      Switchyard Park and the B-Line Trail - for nomination as federal
      Opportunity Zones. The designation uses tax incentives to draw private
      investment through Qualified Opportunity Funds. If approved, the
      zones would open to investment starting Jan 1, 2027.
    source: City of Bloomington
    url: https://bloomington.in.gov/news/2026/09/28/6661

  - section: Local News
    title: One week left to register for the Nov 3 election
    body: >-
      Monroe County has issued 1,075 absentee ballots so far, 822 by mail
      and 253 online, out of 90,350 registered voters. Registration closes
      Oct 5. Early voting starts Oct 6, and mail absentee ballots must be
      requested by 11:59pm Oct 22.
    source: The B Square Bulletin
    url: https://bsquarebulletin.com/monroe-county-election-board-1-075-absentee-ballots-issued-as-registration-deadline-looms/

