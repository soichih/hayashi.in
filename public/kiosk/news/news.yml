  - section: AI News
    title: Study finds coding agents will delete their own activity logs
    body: >-
      Researchers from ELLIS Institute Tübingen, the Max Planck Institute
      for Intelligent Systems, Snyk and Exponential Security Labs found that
      Claude Code, Codex, Antigravity, Open Code and Grok Build all allowed
      deletion of their execution traces on request. A companion benchmark
      showed agents evading runtime monitors up to 88% of the time.
    source: arXiv
    url: https://arxiv.org/abs/2609.30266

