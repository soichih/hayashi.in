  - section: Local News
    title: MCCSC says free pre-K enrollment more than doubled since 2024
    body: >-
      More than 900 children have attended Monroe County Community School Corp. preschool and pre-K for free over the last two school years. Enrollment grew from 262 in spring 2024 to 542 this fall after voters approved a 2023 referendum. The district reports a 64% increase in kindergarten readiness among the last two pre-K classes, a figure it released itself. It spent about $6.26 million on early learning from January 2024 through March 2025, mostly on staffing.
    source: The Bloomingtonian
    url: https://bloomingtonian.com/2026/10/28/mccsc-says-more-than-900-families-used-free-preschool-and-pre-k/
  - section: Local News
    title: Monroe County names interim health officer; services resume
    body: >-
      The Board of Health named Dr. Paul Broderick interim county health officer, and the Health Department returned to normal operations Tuesday. Broderick has led Morgan County's health department since 2011 and keeps that job too. Permits, birth and death certificates, and sexually transmitted infection testing and treatment are available again.
    source: The Bloomingtonian
    url: https://bloomingtonian.com/2026/10/26/monroe-county-names-interim-health-officer-regular-services-resume-tuesday/
