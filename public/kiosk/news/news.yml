  - section: US News
    title: Trump hosts Xi Jinping for state visit; trade truce extended
    body: >-
      Trump and Xi met at the White House on Thursday and held a state
      dinner, discussing trade, AI, Taiwan and the Iran war. Treasury
      Secretary Scott Bessent said the two countries agreed to extend their
      temporary trade truce, which lowered U.S. tariffs and suspended
      Beijing's export controls on rare earths and critical minerals. The
      visit ends Friday with a tea session and a trip to the National
      Archives.
    source: CNBC
    url: https://www.cnbc.com/2026/09/24/trump-xi-meeting-china-washington.html

