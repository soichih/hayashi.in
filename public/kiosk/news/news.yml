  - section: Local News
    title: Incoming clerk hires former election supervisor Karen Wheeler as chief deputy
    body: >-
      Clerk-elect Tree Martin-Lucas, a Democrat who won the Nov. 3 election, named Republican Karen Wheeler to the post, starting in January. Wheeler ran Monroe County elections from 2017 to early 2023, overseeing eight of them, and now works as office manager for the county parks board.

      She left the clerk's office in 2023 under Clerk Nicole Browne, after about 6,600 early-voting ballots were missing from the initial totals in the November 2022 election. Browne did not publicly cite that as the reason. Martin-Lucas also left the office in 2023, over disagreements with Browne about how employees were treated.
    source: The B Square Bulletin
    url: https://bsquarebulletin.com/former-election-supervisor-to-return-to-monroe-county-clerks-office-as-chief-deputy/
  - section: Local News
    title: Council can try to override mayor's superintelligence ban veto Dec. 2
    body: >-
      Mayor Kerry Thomson declined to sign Ordinance 2026-29, which the City Council passed 7-0 on Nov. 4; under Indiana law an unsigned ordinance counts as vetoed. An override takes six of nine votes at the council's Dec. 2 meeting at 6:30pm. Sponsor Dave Rollo says he would rather work with the mayor on a revised version.
    source: The B Square Bulletin
    url: https://bsquarebulletin.com/bloomington-mayor-vetoes-ai-superintelligence-ban-citing-research-enforcement-and-surveillance-concerns/
