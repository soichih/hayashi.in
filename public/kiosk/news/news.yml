  - section: US News
    title: Justice Department sues to block Alaska from certifying Senate result
    body: >-
      The suit asks a federal court to stop Alaska from automatically certifying its Senate race if Republican Sen. Dan Sullivan loses, until the government investigates whether votes for Daniel J. Sullivan, a retired teacher with a nearly identical name on the Nov. 3 ballot, were meant for the senator. Attorney General Todd Blanche defended the suit and denied it lays groundwork for challenging the midterms. Sullivan faces Democrat Mary Peltola.
    source: NPR
    url: https://www.npr.org/nx-s1-6016212
