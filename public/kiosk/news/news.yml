  - section: Local News
    title: Ellettsville-Richland merger recount deadline is Tuesday, Nov. 17
    body: >-
      The merger passed 1,493 to 1,001 inside Ellettsville and 1,514 to 1,479 outside, a 35-vote margin where Indiana law requires a majority in both areas. A recount needs petition signatures from 10% of voters on the question plus a $100 deposit, filed by noon Nov. 17. Otherwise Richland Township government folds into a larger Town of Ellettsville on Jan. 1, 2027.
    source: The B Square Bulletin
    url: https://bsquarebulletin.com/ellettsville-richland-township-reorganization-passes-by-narrow-margin-outside-town-limits/
