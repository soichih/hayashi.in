    title: City proposes $6.87 million bond for aerial fire truck and street safety
    body: >-
      The package includes $2.5 million to replace the city's only aerial platform truck, out of service for more than four months, and $4.23 million for transportation, including $1.7 million for 10th Street between College and Park and $1.5 million for 3rd Street safety. The council holds a public hearing and possible final vote Nov. 4.
    source: The B Square Bulletin
