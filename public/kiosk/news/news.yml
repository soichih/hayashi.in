    title: City Council takes up trash cart fee increase tonight
    body: >-
      The ordinance gets initial consideration only on Wednesday, Nov. 18; passage that night would need unanimous support. The monthly fee for a 64-gallon cart would rise from $16.97 to $19.40 in 2027, $22.64 in 2028 and $25.13 in 2029. The 35-gallon cart goes from $9.28 to $13.89 and the 96-gallon cart from $25.46 to $37.70.

      The increases would end a $1.6 million annual general-fund subsidy of curbside collection over three years.
    when: Wed Nov 18
    source: The B Square Bulletin
