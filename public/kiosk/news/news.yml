  - section: Local News
    title: Stinesville board ratifies ICE agreement as Monroe County sues to void it
    body: >-
      The Stinesville town board voted 2-1 on Nov. 10 to ratify a 287(g) agreement that lets trained local police officers perform some immigration enforcement under ICE supervision. The police chief signed it in January without a board vote. The board held off on spending $122,500 in federal funds, wanting written assurance the town would not have to repay it if it withdraws.

      The same day, the Monroe County commissioners sued to have the agreement declared invalid, arguing that ratification after the fact may not fix it. On Nov. 12 they voted 3-0 to hire outside counsel for the case. The suit also asks the court to block the Indiana attorney general from pursuing penalties against the commissioners over a resolution calling for public review.
    source: The B Square Bulletin
    url: https://bsquarebulletin.com/stinesville-town-board-votes-2-1-to-ratify-ice-agreement-but-holds-off-on-spending-122-500/
    image: img/stinesville.jpg
    image_credit: The B Square Bulletin
