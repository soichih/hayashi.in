  - section: Local News
    title: Council could enact zoning changes for duplexes, cottages and ADUs Wednesday
    body: >-
      The Nov. 4 city council agenda includes changes to the development ordinance that loosen standards for duplexes and cottage developments and update accessory dwelling unit rules. The plan commission recommended the package Oct. 12. Because it is a zoning ordinance, the council can enact it at the meeting where it is introduced, by simple majority.

      A new state law requires cities to review housing barriers and report to the state by year's end. City staff estimated about 70% of the items the state flagged were already addressed by existing rules or recent changes.
    when: Wed Nov 4
    source: The B Square Bulletin
    url: https://bsquarebulletin.com/bloomington-reviews-housing-barriers-under-new-state-law-more-zoning-changes-on-council-agenda/
  - section: Local News
    title: Council also votes Wednesday on $6.87 million bond for fire truck and street safety
    body: >-
      Final votes are due on general obligation bonds, a proposed ban on superintelligence and a removal from the historic preservation commission. The bond would put $2.5 million toward replacing the only aerial platform fire truck, out of service for more than four months, and $4.23 million toward transportation work including 10th Street and 3rd Street safety.
    when: Wed Nov 4
    source: The B Square Bulletin
    url: https://bsquarebulletin.com/nov-2-2026-kirkwood-shooting-jail-population-food-and-beverage-tax-health-board-shakeup-iu-homecoming-parade/
  - section: Local News
    title: FBI and ATF join Kirkwood shooting investigation; one victim still hospitalized
    body: >-
      Federal agents are helping Bloomington police collect evidence and witness statements and process seized firearms and shell casings. One 27-year-old man remains hospitalized in stable condition. The seven victims, ages 17 to 27, were shot around 1:30am Sunday in the 400 block of East Kirkwood Avenue; police say none were believed to be IU students.

      An 18-year-old Indianapolis man seen running from the scene with an AR-15-style handgun is jailed on preliminary allegations of resisting law enforcement and unlawful gun possession. Police don't know whether he fired it or how many people did. Anyone with information can call Detective Chris Scott at 812-339-4477.
    source: The Bloomingtonian
    url: https://bloomingtonian.com/2026/11/02/fbi-atf-join-investigation-into-kirkwood-shooting-1-remains-hospitalized/
