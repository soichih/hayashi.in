  - section: Local News
    title: Stinesville ICE decision pushed to November after Rokita letter
    body: >-
      The town board delayed its vote on the 287(g) agreement with ICE after Attorney General Todd Rokita's Oct. 6 letter said the police chief could sign it without board approval. Rokita wrote that the Interlocal Cooperation Act does not apply and warned that interfering could bring civil penalties of up to $10,000 per violation. An immigration attorney disputes his reading, noting the signer was deputy chief, not chief. The board will take it up at its November meeting.
    source: The B Square Bulletin
    url: https://bsquarebulletin.com/rokita-backs-stinesville-ice-agreement-but-town-board-puts-off-up-or-down-decision/
    image: img/stinesville-ice.jpg
    image_credit: The B Square Bulletin
  - section: Local News
    title: Council trims 2027 budget; final vote Wednesday
    body: >-
      Bloomington's council rejected a proposed $2.5 million general fund cut 2-5, but amendments removed more than $6 million in appropriations. They include $3 million withheld from the housing development fund and $2.5 million in parking improvements; both can be restored later with a new appropriation. The sanitation transfer drops $600,000, which assumes higher trash cart fees not yet approved. The final budget vote is Oct. 14.
    source: The B Square Bulletin
    url: https://bsquarebulletin.com/2027-budget-bloomington-council-rejects-2-5m-general-fund-cut-still-withholds-millions-for-housing-parking-projects/
