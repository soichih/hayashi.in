    title: Voter registration closes Oct 5 for the Nov 3 election
    body: >-
      Monroe County has issued 1,075 absentee ballots so far, 822 by mail
      and 253 online, out of 90,350 registered voters. Early voting starts
      Oct 6, and mail absentee ballots must be requested by 11:59pm Oct 22.
    source: The B Square Bulletin
    url: https://bsquarebulletin.com/monroe-county-election-board-1-075-absentee-ballots-issued-as-registration-deadline-looms/

  - section: Local News
    title: Three congressional candidates confirmed for Oct 3 forum
    body: >-
      The League of Women Voters hosts an online forum for Indiana's 9th
      District Saturday from 9:30 to 11am on Zoom, with Libertarian Tonya
      Hudson, Democrat Brad Meyer and independent write-in Floyd Taylor
      confirmed to appear. Organizers say Republican incumbent Erin Houchin
      has not responded to the invitation.
    when: Sat Oct 3, 9:30-11am, online
