  - section: AI News
    title: Nearly two-thirds of teens and tweens use AI chatbots, surveys find
    body: >-
      A JED Foundation survey of 5,500 students aged 9 to 17 found 90% have used a chatbot, and nearly two-thirds use one for both schoolwork and moments of stress or loneliness. Common Sense Media found nearly half of 9- to 12-year-olds have tried one. Students who used AI when distressed reported worse mental health, but researchers say the data cannot show which causes which.
    source: NPR
    url: https://www.npr.org/nx-s1-6022278
