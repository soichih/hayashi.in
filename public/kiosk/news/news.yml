  - section: Local News
    title: Council votes Wednesday on $6.87 million bond for fire truck and street safety
    body: >-
      The Nov. 4 city council meeting at 5:30pm includes final votes on the general obligation bonds, a proposed ban on superintelligence and a removal from the historic preservation commission. The bond would put $2.5 million toward replacing the only aerial platform fire truck, out of service for more than four months, and $4.23 million toward transportation work including 10th Street and 3rd Street safety.

      Introductions of 2027 pay for councilmembers, the mayor and the clerk are also on the agenda; those likely won't get final votes.
    when: Wed Nov 4, 5:30pm
    source: The B Square Bulletin
    url: https://bsquarebulletin.com/nov-2-2026-kirkwood-shooting-jail-population-food-and-beverage-tax-health-board-shakeup-iu-homecoming-parade/
