  - section: World News
    title: Israel exit polls show no clear winner after record turnout
    body: >-
      Exit polls on the main channels give the Eisenkot-led opposition bloc 52 seats and Netanyahu's coalition parties 50, with Arab-led parties at 18. Neither reaches the 61 needed. Turnout was 77.7% as of 10pm, the highest at that hour since 1999. Channel 14, which usually favors Netanyahu, gives his bloc 60.

      Ra'am leader Mansour Abbas says both sides have approached him but "there aren't numbers for a government." Avigdor Liberman says soldiers' votes could lift his party above the 8 seats polled, and final results may not come until Friday.
    source: Times of Israel
    url: https://www.timesofisrael.com/liveblog-october-27-2026/
