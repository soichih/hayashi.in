  - section: AI News
    title: Google launches Gemini Decisions API at $0.10 per million input tokens
    body: >-
      The new endpoint in Google AI Studio runs a model, gemini-decision-1, that answers closed questions instead of writing text. A request takes text, images, audio, video or PDFs up to 256,000 tokens and up to 1,000 yes/no, multiple-choice or scoring questions, each answered with a probability and confidence score. Output tokens are free and there is a free tier for prototypes.

      On Artificial Analysis's Decision Index it scores 66.0, ninth of 18, at a higher cost than several rivals. Google Cloud availability is listed as coming soon.
    source: AI News Today
