  - section: US News
    title: Supreme Court opens new term with climate liability case
    body: >-
      With eight justices hearing arguments Monday, the court takes up
      whether Boulder, Colorado, and Boulder County can sue Exxon Mobil and
      Suncor Energy over climate damages. The county says the companies
      deceived the public about fossil fuel harms and wants to recover costs
      from disasters, including the 2021 Marshall Fire that destroyed more
      than 1,100 homes. The companies argue only the federal government can
      address climate change, and the Trump administration backs them.

      Justice Alito stepped aside because of fossil fuel investments. A 4-4
      tie would leave the Colorado Supreme Court ruling in place and let the
      suit proceed.
    source: NPR
    url: https://www.kpbs.org/news/politics/2026/10/05/supreme-courts-new-term-kicks-off-with-blockbuster-climate-change-case

  - section: US News
    title: Nobel medicine prize goes to optogenetics pioneers
    body: >-
      Karl Deisseroth of the US and Germans Peter Hegemann and Georg Nagel
      won for discoveries on light-gated ion channels and optogenetics, which
      lets researchers switch individual nerve cells in a living brain on and
      off with light. The work began with algae that swim toward light. The
      prize is 12 million Swedish crowns.
    source: NBC News
    url: https://www.nbcnews.com/world/europe/nobel-prize-medicine-2026-karl-deisseroth-peter-hegemann-georg-nagel-rcna601564
    image: img/nobel-medicine.jpg
    image_credit: NBC News

  - section: World News
    title: Spain's Sánchez calls snap election for November 29
    body: >-
      Parliament voted down two government housing decrees on Friday, and
      Sánchez announced the early election Monday. Public anger over housing
      costs has driven protests across Spain. His Socialist Party trails in
      the polls and faces corruption cases involving party figures.
    source: Euronews
    url: https://www.euronews.com/2026/10/05/pedro-sanchez-calls-early-elections-in-spain-after-defeat-of-housing-decrees
    image: img/spain-election.jpg
    image_credit: Euronews

  - section: World News
    title: FlyDubai co-pilot meant to crash plane into Tel Aviv airport
    body: >-
      An investigation source says the co-pilot, an Omani national, attacked
      the captain with a crash axe and tried to take control of the Dubai to
      Tel Aviv flight. The plane dropped more than 14,000 feet in under 30
      seconds before passengers subdued him and the plane landed safely in
      Saudi Arabia. All 172 people aboard survived. Authorities are treating
      it as attempted terrorism.
    source: NPR
    url: https://www.gpb.org/news/2026/10/05/flydubai-attacker-intended-crash-plane-tel-aviv-airport-investigation-finds
    image: img/flydubai.jpg
    image_credit: Getty Images / NPR

