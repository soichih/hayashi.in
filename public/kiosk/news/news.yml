    url: https://bloomingtonian.com/2026/09/28/three-congressional-candidates-confirmed-for-oct-3-forum-houchin-has-not-responded-organizers-say/

  - section: US News
    title: Appeals court halts Christa Pike's execution an hour before it was due
    body: >-
      The 6th Circuit voted 2-1 to stay Tennessee's first execution of a
      woman in about 200 years, saying it wants to review whether Pike's
      allegations of childhood sexual abuse were fully considered at her
      sentencing. Pike, 50, was 18 when she and her boyfriend killed
      19-year-old classmate Colleen Slemmer in Knoxville in 1995. The state
      attorney general immediately appealed to the US Supreme Court. The
      execution order expires at midnight; if the stay holds, the
      Tennessee Supreme Court would have to set a new date.
    source: AP, ABC News
    url: https://abc7ny.com/post/court-halts-execution-christa-gail-pike-tennessee-murder-she-committed-age-18/19891990/
    image: img/pike-stay.jpg
    image_credit: AP

  - section: US News
    title: Iran says it has received a US reply to its offer to end the war
    body: >-
      Foreign Minister Abbas Araghchi presented the US response to President
      Pezeshkian at a Cabinet meeting, Iranian officials said, without
      saying what it contains. President Trump had publicly rejected the
      proposal days earlier, but mediators kept working. An official
      briefed on the talks said the sides largely agree on the steps needed
      but disagree on their order, while the administration presses on with
      economic pressure on Tehran.
    source: AP
    url: https://www.post-gazette.com/news/world/2026/09/30/iran-update-today-latest-september-30-2026/stories/202609300045

  - section: US News
    title: Hurricane Polo's remnants force dam evacuations in New Mexico
    body: >-
      Rain from Polo's remnants swelled desert rivers and normally-dry
      arroyos across the Southwest. Fear that New Mexico's McLeod Dam in
      Dona Ana County could fail prompted a flash-flood emergency and
      evacuation orders for the small Rio Grande towns of Rincon, Salem and
      Garfield, later extended to Hatch and Placitas. Roads flooded and
      debris covered highways statewide, and parts of Arizona saw water
      rescues.
    source: AP, NPR
    url: https://www.npr.org/2026/09/30/g-s1-145590/hurricane-polo-us-southwest

