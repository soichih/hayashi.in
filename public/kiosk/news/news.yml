  - section: AI News
    title: Cisco Talos reports autonomous AI-run malware implant
    body: >-
      Cisco's Talos researchers disclosed CLOSEDQUORUM, described as the first
      reported command-and-control implant run entirely by multiple AI models
      with no human operator. They also released CAIRN, a toolkit for
      detecting such malware.
