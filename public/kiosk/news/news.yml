  - section: Local News
    title: Police arrest driver in Winslow Road hit-and-run that critically hurt pedestrian
    body: >-
      A 34-year-old man was arrested Nov. 4 on a preliminary Level 4 felony charge of leaving the scene of a crash causing catastrophic injury. The Nov. 2 crash at East Winslow Road and South Henderson Street left the pedestrian in critical condition at an Indianapolis hospital. Police tied a Honda Pilot found in a YMCA parking lot to the crash through a recovered wiper part and surveillance video. The man told investigators he hit a deer. The allegations have not been proven in court.
    source: The Bloomingtonian
    url: https://bloomingtonian.com/2026/11/06/man-arrested-after-hit-and-run-left-pedestrian-critically-injured-on-winslow-road/
