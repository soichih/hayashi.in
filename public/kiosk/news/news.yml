    title: GOP spends heavily in House districts it redrew to favor itself
    body: >-
      Republicans have put close to $100 million in ads into districts redrawn by GOP legislatures, according to Punchbowl News and AdImpact figures. Of 14 new strongly Republican seats, only five are seen as sure wins, and nine remain competitive. Election Day is Nov. 3.
    source: NPR
    url: https://www.npr.org/nx-s1-6008167
