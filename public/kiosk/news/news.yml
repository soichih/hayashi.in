  - section: US News
    title: Critical PHP flaws force some government sites offline; patch now
    body: >-
      Two PHP flaws, each rated 9.2 of 10, could let attackers run code on servers without logging in. PHP released fixes Oct. 21 for versions 8.2 through 8.5. Palo Alto Networks counts more than 22.6 million potentially vulnerable internet-facing instances. Agencies in the U.S., U.K., EU, Canada, Australia and Japan urged patching, and the FBI and NSA advised taking systems offline if they cannot be updated. Sites in Finland, the Netherlands, Belgium and France went down or were partly unavailable. Cloudflare reports attack traffic but has not confirmed any success. Visiting an affected site does not infect your device.
    source: ABC News
    url: https://abcnews4.com/news/nation-world/critical-php-flaws-put-millions-of-websites-at-risk-as-governments-pull-sites-offline
  - section: US News
    title: Holiday airfares hit 10-year highs on jet fuel costs
    body: >-
      Hopper puts the average domestic round-trip fare at about $402 for Thanksgiving, up 31% from last year, and about $452 for Christmas, up 23%. High jet fuel prices and fewer low-cost options, after Spirit Airlines left the industry in May, are the main causes. Hopper advises booking before Halloween and staying flexible on dates.
    source: CNN Newsource
    url: https://www.wect.com/2026/09/29/airfares-thanksgiving-christmas-hit-10-year-highs/
