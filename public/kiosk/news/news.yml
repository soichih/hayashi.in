  - section: US News
    title: Storms hit both coasts, postponing the 100th Macy's parade to Saturday
    body: >-
      Hundreds of flights were cancelled or delayed by early Thursday as a multi-hazard storm moved from the Southeast into New England with high winds, heavy rain and coastal flooding. AAA expected 81.5 million travelers between Thursday and Monday.

      New York postponed the parade to Saturday over wind, its first postponement outside wartime. On the West Coast, high tides flooded California shoreline streets and damaged part of Pacifica Pier. Snow was forecast for the Midwest. The East Coast storm should mostly clear by Saturday.
    source: NPR
    url: https://www.npr.org/nx-s1-6054079
  - section: US News
    title: Judge blocks FCC and administration from early reviews of ABC licenses
    body: >-
      US District Judge Loren AliKhan issued a preliminary injunction Wednesday, finding the early license reviews of eight ABC-owned stations were retaliation for speech the administration disliked. She rejected the government's motion to dismiss the suit by ABC and Disney.

      She cited Trump's eleven calls over two years to strip ABC's licenses and said FCC Chair Brendan Carr acted on them. ABC called the ruling an important First Amendment victory; Carr did not comment.
    source: NPR
    url: https://www.npr.org/nx-s1-6000576
  - section: US News
    title: FCC approves SpaceX plan for one million data-center satellites
    body: >-
      The FCC authorized a constellation called Starmind of up to one million "orbital compute modules." SpaceX must deploy at least one by 2033 and add more through 2040. The FCC said the plan meets debris rules and dismissed environmental concerns as outside its authority.

      The American Astronomical Society, Viasat and Amazon's Kuiper had urged denial. Astrophysicist Adam Becker called the plan a fantasy, citing heat removal, debris cascades and night-sky pollution.
    source: NPR
    url: https://www.npr.org/g-s1-155940
