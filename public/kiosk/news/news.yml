    title: Georgetown officer arrested over alleged misuse of Flock camera database
    body: >-
      Indiana State Police arrested a Georgetown officer Thursday on one Level 6 felony count of official misconduct and two misdemeanor fraud counts. He is accused of many unauthorized searches of the department's Flock license plate reader system in 2026. He is presumed innocent.
    source: The Bloomingtonian
    url: https://bloomingtonian.com/2026/10/22/georgetown-police-officer-arrested-accused-of-improperly-searching-flock-surveillance-camera-database/
