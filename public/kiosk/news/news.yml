    title: Photon and Restate raise funding for AI agent tools
    body: >-
      Vercel-backed Photon raised $4.5 million in seed funding to put AI
      agents inside messaging apps such as iMessage and WhatsApp. Restate
      added $20 million in Series A funding for infrastructure that keeps
      long-running agent workflows durable.
    source: AI Agents Directory
    url: https://aiagentsdirectory.com/news/ai-agents-news-brief-october-1-2026
  - section: AI News
    title: UCLA system uses light to spot deepfakes with nearly 98% accuracy
    body: >-
      UCLA researchers built an AI system that uses light to analyze more
      than a dozen videos at once, detecting deepfakes with nearly 98%
      accuracy.
    source: AI Agents Directory
    url: https://aiagentsdirectory.com/news/ai-agents-news-brief-october-1-2026
  - section: AI News
    title: Nvidia's agent safety platform lines up Anthropic, Microsoft and SAP
    body: >-
      Nvidia's Open Agent Safety Platform pairs OpenShell, an open-source
      sandbox that limits what files, networks and credentials each agent can
      touch, with Sentry, a BlueField-4 watchdog that can quarantine an agent
      within milliseconds. More than 100 organizations back it. Anthropic has
      connected Claude Managed Agents to both parts, while OpenAI is not among
      the partners.
    source: The Next Web
    url: https://thenextweb.com/news/nvidia-open-agent-safety-platform
