  - section: AI News
    title: Ricursive releases Ripple-65B, an open-weight 65B coding model
    body: >-
      The dense 65-billion-parameter model is released under Apache 2.0 with weights on Hugging Face and a context window up to 1 million tokens. It was trained on 12 trillion tokens, mostly English and code, and tuned lightly for agentic coding. The company reports 80.5 on Terminal-Bench 2.1, a 0.4-point lead over Reflection Beam that is within normal test noise, and 76.5 on SWE-bench Verified, behind Beam's 81.6. These scores are company-reported. Paid API access is available through OpenRouter, Together AI and GMI Cloud.
    source: AI News Today
    url: https://pasqualepillitteri.it/en/news/30248/ripple-65b-preview-ricursive-dense-open-weight-llm
    image: img/ripple-65b.jpg
