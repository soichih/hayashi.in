  - section: Local News
    title: Indiana measles cases reach 86 in 12 counties; none in Monroe
    body: >-
      The state health department's count rose from 66 cases on Oct. 27 to 86 on Oct. 29, with LaGrange (20), Wayne (15), Adams (13) and Miami (10) counties hardest hit. Figures are provisional. Of the earlier 66, 15 were hospitalized and 64 were unvaccinated or of unknown status. The department says two doses of MMR vaccine are the best protection, and anyone who suspects measles should call a provider before going in.
    source: The Bloomingtonian
    url: https://bloomingtonian.com/2026/10/29/indiana-reports-86-measles-cases-across-12-counties-in-2026-none-listed-in-monroe-county/
  - section: Local News
    title: MCCSC pre-K enrollment more than doubled since 2024
    body: >-
      Over 900 children have used the district's free preschool and pre-K, and enrollment grew from 262 in spring 2024 to 542 this fall. The expansion followed the 2023 referendum, with about $6.26 million going to early learning from January 2024 through March 2025. The district plans to extend it to more families with 3-year-olds. The school board also approved a 2027 budget about $3.07 million below 2026.
    source: The Bloomingtonian
    url: https://bloomingtonian.com/2026/10/28/mccsc-says-more-than-900-families-used-free-preschool-and-pre-k/
  - section: Local News
    title: IU partners with Belgian chip research center imec
    body: >-
      The first project, led by IU CREATE, will have imec supply electronic and photonic components that IU researchers test under radiation and in extreme environments, including space. Findings will be shared to support future proposals and papers. No financial terms were given.
    source: The Bloomingtonian
    url: https://bloomingtonian.com/2026/10/28/iu-partners-with-belgian-semiconductor-research-center-imec/
  - section: Local News
    title: Council holds Nov. 4 hearing on $6.87 million bond after dispatch tax failure
    body: >-
      The council's 1-4 vote on raising the dispatch tax failed Monday because four absences count as no votes. The proposed bond would put $2.5 million toward replacing the only aerial platform fire truck, out of service for more than four months, and $4.23 million toward transportation, including 10th Street and 3rd Street safety work. A public hearing and possible final vote are set for Nov. 4.
    source: The B Square Bulletin
    url: https://bsquarebulletin.com/bloomington-proposes-6-87m-bond-issue-for-fire-truck-street-safety-plans-for-regular-borrowing/
