  - section: Local News
    title: Transportation commission weighs two-way College and Walnut tonight
    body: >-
      The commission meets at 5:30pm on whether to endorse two-way traffic on College Avenue and Walnut Street in the city's long-range plan. A consultant study puts the two-way redesign at $109.4 million, against $103.1 million for one-way safety improvements, in 2026 dollars; neither is an approved budget.

      Mayor Kerry Thomson opposes the two-way plan and the Chamber of Commerce questions the cost and disruption. A commission vote would not fund or authorize construction; the plan commission and City Council would still have to act.
    source: The B Square Bulletin
    url: https://bsquarebulletin.com/two-way-college-walnut-proposal-in-front-of-bloomington-commission-monday/
  - section: Local News
    title: Street resurfacing started today on Kirkwood, Rogers, Grimes and Patterson
    body: >-
      The two-week project could run past Thanksgiving week if weather interferes. Patterson Drive is fully closed between Second and Third streets Nov. 16 through Nov. 18. Elsewhere expect lane restrictions, flaggers and delays.

      Work goes Kirkwood between Maple and Rogers first, then Rogers between Second and Third, Rogers between First and Patterson, and finally Grimes Lane and Patterson from Walnut to Third.
    source: City of Bloomington
    url: https://bloomington.in.gov/news/2026/11/12/6696
  - section: Local News
    title: Bloomington Transit hearing on four-route cuts is Tuesday
    body: >-
      The proposal would remove about 237 driver hours a week from Dec. 6 through May 2027 because of a driver shortage. Routes 2 West and 2 South would merge into one hourly weekday route, Route 11 loses weekend service, and Route 16 drops from three buses to two.

      The hearing is 4:30-5:30pm at the downtown Transit Center, with a final vote expected that day. Comments are open through Dec. 5.
    when: Tue Nov 17, 4:30pm
    where: Downtown Transit Center
    source: The B Square Bulletin
    url: https://bsquarebulletin.com/possible-bus-service-cuts-bloomington-transit-board-sets-public-hearing/
