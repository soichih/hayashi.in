  - section: Local News
    title: Wheeler Mission reopens renovated Bloomington shelter
    body: >-
      The men's shelter at 215 S. Westplex Ave. reopens after a renovation
      costing more than $4 million. Additions include a welcome center, a
      modernized kitchen and dining area, lockers, a courtyard and a care
      center.
    source: The Bloomingtonian
    url: https://bloomingtonian.com/2026/09/24/wheeler-mission-to-open-renovated-bloomington-facility-following-more-than-4-million-project/

  - section: Local News
    title: Monroe County ends notice rule before clearing belongings from county land
    body: >-
      Commissioners voted unanimously to drop the requirement for three
      days' warning before removing belongings from county land. Owners now
      get seven days after removal to recover items. The county attorney said
      belongings kept being added while crews cleared sites, forcing repeat
      notices.

      The county is spending about $100,000 on cleanup, with $35,000 more
      approved for 10 days of work at the Thompson property. Commissioners
      also approved $162,378.82 for the Streets to Stability rental
      assistance program. About 150 people are unhoused in Monroe County.
    source: The Bloomingtonian
    url: https://bloomingtonian.com/2026/09/24/monroe-county-ends-three-day-warning-requirement-before-removing-belongings-from-county-land/

  - section: Local News
    title: MCCSC starts facilities master plan as 2027 budget shrinks
    body: >-
      The school district begins an 8-10 month facilities master plan
      review with input from teachers, parents and students. The proposed
      2027 budget is $3.07 million below 2026, and the board votes on it
      Oct 27. The district serves 9,937 students in 23 schools.
    source: The Bloomingtonian
    url: https://bloomingtonian.com/2026/09/23/mccsc-begins-facilities-master-plan-process-as-proposed-2027-budget-decreases/

  - section: US News
    title: Supreme Court blocks Trump-backed Missouri congressional map
    body: >-
      The court blocked the Republican-drawn map for the third time,
      warning that changing districts now would cause electoral chaos.
      Missouri must use the districts voters had in 2022 and 2024. The map
      aimed to unseat Democratic Rep. Emanuel Cleaver by joining parts of
      Kansas City with rural areas.
    source: NPR
    url: https://www.npr.org/2026/09/25/nx-s1-5978875/midterms-redistricting-trump-missouri

  - section: US News
    title: Supreme Court revives citizenship-check data system for voter rolls
    body: >-
      In a 6-3 ruling, the court let states use the federal SAVE database
      for individualized checks of voters' citizenship in the coming
      election, while noting that federal law bars mass purges close to
      Election Day. The tool has mistakenly flagged some eligible voters as
      possible noncitizens. Justice Ketanji Brown Jackson's dissent warned
      that recently naturalized citizens could lose registrations. The
      lawsuit is continuing.
    source: NPR
    url: https://www.npr.org/2026/09/25/nx-s1-5976804/supreme-court-trump-save-noncitizen-voting

  - section: US News
    title: Rare September nor'easter hits East Coast
    body: >-
      More than 40 million people face strong wind, heavy rain and coastal
      flooding through Sunday, with moderate to major flooding likely from
      North Carolina to Nantucket. Roads have flooded in coastal New Jersey
      and thousands are without power. A full moon Saturday night could push
      tides higher.
    source: NPR
    url: https://www.npr.org/2026/09/26/g-s1-145146/roads-flood-in-new-jersey

  - section: US News
    title: Hurricane Nolo nears Hawaii's Big Island
    body: >-
      The Category 2 storm is expected to strengthen as it passes south of
      the islands this weekend without making landfall. Forecasters warn of
      catastrophic, life-threatening flash flooding on the Big Island, where
      10 to 15 inches of rain are possible and up to 25 inches in the
      steepest terrain.
    source: NPR
    url: https://www.npr.org/2026/09/25/nx-s1-5981082/hurricane-nolo-hawaii

  - section: US News
    title: Strategic Petroleum Reserve falls to lowest level since 1982
    body: >-
      The reserve held 284.6 million barrels in the week ending Sept 18,
      about 40% of capacity, after repeated releases since the Iran war
      disrupted oil shipping. Borrowed oil is not due back in full until
      September 2028, leaving less cushion against new price shocks.
    source: NPR
    url: https://www.npr.org/2026/09/25/nx-s1-5965797/strategic-petroleum-reserve-low-level-venezuela

  - section: World News
    title: Delegates walk out as Netanyahu addresses UN General Assembly
    body: >-
      Hundreds of diplomats left the hall as Netanyahu defended Israel's
      strikes on Iran and rejected accusations of genocide in Gaza. He also
      attacked New York Mayor Zohran Mamdani. Analysts say the speech was
      aimed at voters at home, where Netanyahu faces a tight race in the
      Oct 27 election.
    source: NPR
    url: https://www.npr.org/2026/09/25/nx-s1-5979852/israels-prime-minister-addresses-u-n-general-assembly

  - section: World News
    title: Pope Leo warns of a "paradise of machines" as he opens France trip
    body: >-
      In Paris, Pope Leo XIV said societies need education in ethical
      discernment to avoid losing their humanity to AI, and urged AI
      developers and regulators to slow down. He led evening prayers at
      Notre Dame, the first pope to do so since the 2019 fire. The
      four-day trip continues to Lourdes and Metz.
    source: NPR
    url: https://www.npr.org/2026/09/25/nx-s1-5981140/pope-leo-france

