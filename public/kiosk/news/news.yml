  - section: Local News
    title: City council bans distributing or deploying AI superintelligence in Bloomington
    body: >-
      The Common Council voted unanimously on Nov. 4 for an ordinance barring companies and other entities from distributing or deploying artificial superintelligence within city limits. Ordinary end-user access by residents is exempt, and the city can seek civil penalties or court orders.

      Sponsor Dave Rollo called it an interim public safety measure given federal and state inaction. The council could lift the ban after finding broad scientific consensus that such systems can be developed safely, and a comprehensive state law would override it.
    source: The Bloomingtonian
    url: https://bloomingtonian.com/2026/11/10/bloomington-city-council-approved-ordinance-restricting-ai-superintelligence-last-week-lack-of-federal-action-cited/
  - section: Local News
    title: Plan commission backs Hilltop Court switch from condos to rentals
    body: >-
      The commission voted 7-0 on Nov. 9 to send the change to city council with a positive recommendation, after a motion to require a second hearing failed. The developer would replace 10 planned three-bedroom condos at 1237 W. Allen St. with a 24-unit, one-bedroom rental building. Total units rise from 114 to 128.
    source: The B Square Bulletin
    url: https://bsquarebulletin.com/after-failed-vote-recess-plan-commission-backs-hilltop-court-switch-from-condos-to-rentals/
    image: img/hilltop-court.jpg
    image_credit: The B Square Bulletin
  - section: Local News
    title: Housing Authority buys five apartment complexes, plans $10 million in repairs
    body: >-
      The Bloomington Housing Authority bought Summit Pointe, Basswood, Woodland Springs, Kingston Manor and Northcrest, about 924 units, from Hometown Property Group on Nov. 5. The authority says it wants to preserve affordable rents and fix overdue maintenance. Repairs start inside apartments this winter and should take about two years. The purchase price was not disclosed.
    source: The Bloomingtonian
    url: https://bloomingtonian.com/2026/11/09/bloomington-housing-authority-buys-five-apartment-complexes-plans-10-million-in-repairs/
  - section: Local News
    title: Bloomington Transit proposes cutting four routes from Dec. 6
    body: >-
      The board voted 5-0 on Nov. 4 to seek public comment on temporary cuts that would remove about 237 driver hours a week from Dec. 6 through May 2027. Routes 2 West and 2 South would merge into one hourly weekday route, Route 11 loses weekend service, and Route 16 drops from three buses to two. The cause is a driver shortage.

      Public hearing is Tue Nov. 17, 4:30-5:30pm at the downtown Transit Center, with a final vote expected that day. Comments are open through Dec. 5.
    source: The B Square Bulletin
    url: https://bsquarebulletin.com/possible-bus-service-cuts-bloomington-transit-board-sets-public-hearing/
