  - section: Local News
    title: City Council opens hearings on $43.8M levy in 2027 budget
    body: >-
      Bloomington's proposed 2027 budget sets the maximum property-tax levy at
      $43.8 million, a 6% increase matching the state cap. The General Fund
      gets about $30 million and Parks and Recreation $9.9 million. City
      employees would get a 2.7% cost-of-living raise, and police, fire and
      AFSCME units 3%.

      Public hearings opened tonight. The council is scheduled to vote on
      adoption Oct. 7, and a bond proposal for a $2.5 million aerial-platform
      fire truck and other public-safety needs is expected in October.
    source: The Bloomingtonian
    url: https://bloomingtonian.com/2026/09/23/bloomington-city-council-to-open-public-hearings-tonight-on-proposed-2027-budget/

  - section: Local News
    title: MCCSC starts facilities master plan as 2027 budget drops $3M
    body: >-
      Monroe County Community School Corporation is beginning an eight- to
      10-month facilities master plan covering academic needs, building
      conditions and enrollment, which stood at 9,937 students in October 2025.
      Teachers, parents and students will give input at visioning sessions.

      The proposed 2027 budget is about $3.07 million below 2026. The school
      board votes on it Oct. 27.
    source: The Bloomingtonian
    url: https://bloomingtonian.com/2026/09/23/mccsc-begins-facilities-master-plan-process-as-proposed-2027-budget-decreases/

  - section: Local News
    title: Ivy Tech offers free five-day AI academy in October
    body: >-
      Ivy Tech Bloomington and the Mark Cuban Foundation are running a free
      Agentic AI Academy Oct 19-23. The pilot is limited to 30 adults with no
      coding or AI background required, aimed at trade workers, small-business
      owners and people returning to work. Apply at link.ivytech.edu/aitraining.
    source: The Bloomingtonian
    url: https://bloomingtonian.com/2026/09/23/ivy-tech-bloomington-to-offer-free-ai-training-program-with-mark-cuban-foundation/

