    title: Trump says Iran war will end "right after the election" as 9,000 more troops head east
    body: >-
      The USS Theodore Roosevelt carrier strike group and the USS Makin Island amphibious group are heading to the Middle East, bringing US forces in the region to roughly 20,000. Trump said the US "could leave tomorrow" and Iran would need years to rebuild. At least four ships have been hit near the Strait of Hormuz this week, and Iran's parliament is advancing a bill that could charge fees for passage. Europe agreed to release 100 million barrels of diesel over four months to ease fuel prices.
