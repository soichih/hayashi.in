  - section: US News
    title: Trump administration to remove 760,000 ACA enrollees over fraud claims
    body: >-
      The administration says about 760,000 people on Affordable Care Act
      exchanges were fraudulently enrolled or don't exist. Vice President JD
      Vance said removing them would save $2.2 billion. Health policy experts
      question the transparency of the process used to identify them, as
      premiums rise after the expiration of pandemic-era subsidies.
    source: NPR
    url: https://text.npr.org/g-s1-144623

  - section: US News
    title: FDA advisers vote on Grail's multi-cancer blood test
    body: >-
      An FDA advisory committee weighed approval of Grail's Galleri test,
      which screens for up to 50 cancers with a $949 blood draw. Two large
      trials covering more than 175,000 people missed their main goal of
      reducing overall mortality, though Stage IV diagnoses fell over the
      three-year study. Medicare coverage rules make the decision a bellwether
      for multi-cancer screening.
    source: NPR
    url: https://text.npr.org/nx-s1-5978122

  - section: World News
    title: Xi Jinping in Washington for first U.S. state visit in 11 years
    body: >-
      Xi and President Trump are meeting on Taiwan, trade and rare earths, and
      AI governance. Both leaders talk of "constructive strategic stability,"
      but experts call the relationship fragile, with U.S. measures targeting
      Chinese exports and technology firms continuing.
    source: NPR
    url: https://text.npr.org/nx-s1-5978733

  - section: World News
    title: Iran's president tells U.N. he is open to talks, not coercion
    body: >-
      Masoud Pezeshkian spoke a day after Trump threatened to "annihilate"
      Iran. He said Iran is ready to negotiate but will not be forced, and
      listed conditions: halting hostilities, lifting the naval blockade and
      unfreezing Iranian assets. Preliminary talks mediated by Qatar have
      reportedly taken place.
    source: NPR
    url: https://text.npr.org/nx-s1-5978863

  - section: World News
    title: Category 5 Hurricane Polo threatens Mexico's Pacific coast
    body: >-
      Polo has sustained winds of 165 mph, one of the strongest Pacific storms
      in recent decades. It is expected to stay offshore but could bring heavy
      rain, flooding and mudslides to Guerrero, Michoacán and nearby states. It
      is the Pacific season's third Category 5 storm, while the Atlantic
      season has been unusually quiet.
    source: NPR
    url: https://text.npr.org/nx-s1-5978589

  - section: AI News
    title: Senate staff barred from advanced AI tools while writing AI law
    body: >-
      Senate staff can use only basic chat tools like ChatGPT and Gemini. The
      sergeant at arms has not approved agentic tools such as Claude Code,
      citing security. Critics say lawmakers lack hands-on experience with
      what they regulate, and some offices reportedly use the tools anyway.
    source: NPR
    url: https://text.npr.org/nx-s1-5978055

  - section: AI News
    title: Proposed AI slowdown worries smaller companies
    body: >-
      Leaders including Dario Amodei, Sam Altman and Elon Musk have backed
      slowing AI development, but smaller firms fear a pause would cement the
      lead of frontier labs. A federal antitrust suit filed last week accuses
      Anthropic, OpenAI, Google and SpaceXAI of coordinating to slow
      development. Any deal also faces questions about verification and
      China.
    source: NPR
    url: https://text.npr.org/nx-s1-5973306

