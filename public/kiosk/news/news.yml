    title: Rokita says Stinesville police chief could sign ICE agreement alone
    body: >-
      Attorney General Todd Rokita's Oct. 6 letter calls the town's 287(g) agreement with ICE "lawfully executed" and
      rejects the Monroe County commissioners' request for a public vote and suspension. The letter warns that local
      governments discouraging such agreements could face civil penalties.


      The agreement was signed Feb. 10 by then-Deputy Chief Shane Pittman at the police chief's direction; town board
      members say they never authorized it. The board has put off ratifying or ending the agreement until November, and it
      stays in place meanwhile.
    source: The Bloomingtonian
    url: https://bloomingtonian.com/2026/10/10/rokita-says-stinesville-police-chief-had-authority-to-sign-ice-agreement-without-town-board-approval/
