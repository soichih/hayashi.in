    title: US measles cases top 4,580, more than double all of 2025
    body: >-
      The CDC counts more than 4,580 cases as of Oct. 22, and 96% are unvaccinated or of unknown status. Pennsylvania has at least 1,338 cases and 5 deaths. Two MMR doses are nearly 97% effective, per the CDC.
    source: NPR
    url: https://www.npr.org/nx-s1-6016205
