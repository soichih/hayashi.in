  - section: Local News
    title: Council bans license plate readers and data-sharing cameras 7-0
    body: >-
      Ordinance 2026-22 bars the city from using automated license plate readers and from using surveillance camera systems whose data is shared, or could be shared, with outside parties such as vendors and other agencies. City-held closed-circuit systems, such as those in parks, are not covered. The city let its Flock Safety plate-reader contract expire March 5, but Flock contracts remain for four downtown cameras and four mobile security systems.


      The clerk will send the ordinance to Mayor Kerry Thomson. According to sponsor Isabel Piedmont-Smith's release, the 7-0 vote is enough to override a veto.
    source: The Bloomingtonian
    url: https://bloomingtonian.com/2026/10/15/bloomington-council-votes-to-ban-alprs-and-some-surveillance-cameras/
  - section: Local News
    title: Planners favor two-way College and Walnut, a $109 million idea
    body: >-
      Planning staff recommend adding a two-way restoration of College Avenue and Walnut Street to the city's Transportation Plan. It covers about 4.2 miles from the State Road 45/46 Bypass to Allen Street and would cost about $109.4 million; a reconfigured one-way option is about $103.1 million. Neither is funded, and the recommendation is not approval to build.


      The Transportation Commission takes it up Nov. 16 at 5:30pm, with public comment, followed by later hearings before the Plan Commission and City Council.
    source: The Bloomingtonian
    url: https://bloomingtonian.com/2026/10/13/bloomington-planners-recommend-two-way-restoration-of-college-walnut/
