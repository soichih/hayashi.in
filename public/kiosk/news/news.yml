    title: First Monroe County election results expected between 6 and 7pm
    body: >-
      The first batch will likely include only ballots cast before Election Day. No Election Day results will post until a substantial number of ballots arrive from the county's 28 polling locations at Election Central. The B Square Bulletin is tracking the Ellettsville reorganization referendum and selected races live.
