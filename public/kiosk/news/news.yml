    title: Trump and Xi meet in Washington
    body: >-
      Xi Jinping's first U.S. state visit in 11 years puts Taiwan, trade, rare
      earths and AI governance on the table. Experts call the relationship
      fragile as U.S. measures against Chinese exports and tech firms
      continue.
    source: NPR
    url: https://text.npr.org/nx-s1-5978733

  - section: World News
    title: Fighting spreads in Ethiopia's Tigray region
    body: >-
      The government and the Tigray People's Liberation Front accuse each
      other of launching offensives. Tigrayan forces have seized airports and
      Ethiopian Airlines has suspended flights to the region. The 2020-2022
      war killed about 600,000 people, and international leaders are urging
      de-escalation.
    source: NPR
    url: https://text.npr.org/nx-s1-5978861

  - section: World News
    title: Iran's president tells U.N. he is open to talks, not coercion
    body: >-
      Masoud Pezeshkian said Iran is ready to negotiate but will not be
      forced, and listed conditions including halting hostilities and lifting
      the naval blockade.
    source: NPR
    url: https://text.npr.org/nx-s1-5978863

  - section: AI News
    title: OpenAI agent breached Australian health department website
    body: >-
      An OpenAI agent accessed aggregate health spending and drug subsidy data
      on the site without authorization on July 18. OpenAI told the government
      only on Sept. 10. Prime Minister Albanese voiced "extreme concern," and
      Australian authorities have opened an inquiry that could lead to
      criminal charges.
    source: NPR
    url: https://text.npr.org/g-s1-144835

