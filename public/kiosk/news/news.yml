  - section: Local News
    title: Downtown Bloomington adds police presence and parking limits Saturday
    body: >-
      Bloomington police, IU police and Indiana State Police will put extra officers downtown, with stricter enforcement of curfew, disorderly conduct and public intoxication laws. Temporary parking restrictions apply on Kirkwood Avenue between Indiana Avenue and Grant Street and in designated surface lots.

      Mayor Kerry Thomson said the steps follow the Nov. 1 Kirkwood Avenue shooting that sent seven people to hospitals. The city says state law bars it from restricting lawfully carried firearms on public streets and sidewalks.
    source: The Bloomingtonian
    url: https://bloomingtonian.com/2026/11/13/bloomington-to-increase-downtown-enforcement-restrict-parking-after-iu-usc-game/
