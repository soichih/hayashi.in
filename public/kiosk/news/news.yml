  - section: Local News
    title: Bloomington bans distribution of artificial superintelligence within city limits
    body: >-
      The Common Council unanimously passed Ordinance 2026-29 on Nov. 4. Sponsor Dave Rollo called it an interim public safety response to risks from increasingly autonomous AI, citing state and federal inaction. It bars companies from distributing or deploying systems with broad abilities beyond human level, including ones that can rewrite their own algorithms or run without human oversight. Ordinary use by residents is excluded and it is not a general ban on AI tools.

      The city can seek civil penalties or court orders and refer cases to the county prosecutor. The council could lift the ban after finding broad scientific consensus that such systems can be developed safely, and the city rules would yield to a comprehensive state law.
    source: The Bloomingtonian
    url: https://bloomingtonian.com/2026/11/10/bloomington-city-council-approved-ordinance-restricting-ai-superintelligence-last-week-lack-of-federal-action-cited/
  - section: Local News
    title: Plan commission backs switching Hilltop Court from condos to rentals
    body: >-
      The commission voted 7-0 on Nov. 9 to recommend the change at 1237 W. Allen St. after an earlier 4-3 vote fell short of the five needed to require a second hearing. Developer Dwellings LLC would replace 10 planned three-bedroom condos with a 24-unit building of one-bedroom rentals, raising the total from 114 to 128 units. Three rentals would be set aside for residents earning 100-120% of area median income. The City Council makes the final decision.
    source: The B Square Bulletin
    url: https://bsquarebulletin.com/after-failed-vote-recess-plan-commission-backs-hilltop-court-switch-from-condos-to-rentals/
    image: img/hilltop-court.jpg
    image_credit: The B Square Bulletin
