  - section: AI News
    title: AI data center permits face freezes in New York and a possible federal moratorium
    body: >-
      New York's governor paused new permits for data centers drawing 50 MW or more for up to a year. Texas's governor asked regulators to stop issuing new ones, and lawmakers in 15 states have filed moratorium bills. A Sanders-Ocasio-Cortez national moratorium faces a promised Trump veto.

      The Nasdaq fell 5.5% on Nov. 5, and Nvidia reports earnings Nov. 17. An NBC poll found 57% of voters think AI risks outweigh benefits.
    source: AI News Today
    url: https://pasqualepillitteri.it/en/news/31518/new-york-blocks-ai-data-center-permits-congress-moratorium
  - section: AI News
    title: Apple research robot runs on a Mac mini and Qwen models
    body: >-
      The HALO paper puts a Mac mini M4 Pro on the back of a Unitree G1 humanoid, running Qwen models locally with no cloud servers. Apple reports a 91% average success rate across 360 real-world trials of six tasks such as crawling, sitting and opening doors. Chained tasks averaged 70%.

      The results are Apple's own and the robot performs only six tasks. Apple has announced no humanoid product.
    source: AI News Today
    url: https://pasqualepillitteri.it/en/news/31317/apple-halo-unitree-g1-humanoid-mac-mini-qwen
