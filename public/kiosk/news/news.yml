  - section: US News
    title: Tennessee set to execute Christa Pike today, its first woman in 200 years
    body: >-
      Pike, now 50, was 18 when she and her boyfriend killed classmate
      Colleen Slemmer, 19, at Knoxville Job Corps in 1995. Gov. Bill Lee
      denied a last clemency plea Monday, and the execution is scheduled
      for 10am today by lethal injection at Riverbend Maximum Security
      Institution in Nashville. It would be Tennessee's first execution of
      a woman in more than two centuries. Pike has refused to select a last
      meal and wrote that she is "at peace" regardless of the outcome.
    source: AP, NPR
    url: https://abcnews.com/US/wireStory/tennessee-set-execute-woman-time-200-years-136830258

  - section: US News
    title: Hurricane Polo's remnants force dam evacuations in New Mexico
    body: >-
      Rain from Polo's remnants swelled desert rivers and normally-dry
      arroyos across the Southwest. Fear that New Mexico's McLeod Dam in
      Dona Ana County could fail prompted a flash-flood emergency and
      evacuation orders for the small Rio Grande towns of Rincon, Salem and
      Garfield, later extended to Hatch and Placitas. Roads flooded and
      debris covered highways statewide, and parts of Arizona saw water
      rescues.
    source: AP, NPR
    url: https://www.npr.org/2026/09/30/g-s1-145590/hurricane-polo-us-southwest

  - section: World News
    title: North Korean landmine found on South's side of the DMZ
    body: >-
      The UN Command determined North Korea violated the 1953 armistice
      after investigators found an active North Korean anti-personnel mine
      on the southern side of the Demilitarized Zone, days after a similar
      mine badly wounded two South Korean soldiers on patrol Sept 21.
      Forensic analysis of the soldiers' equipment matched materials used
      in North Korean mines. South Korea's defense ministry called it "a
      clear violation of the armistice agreement" and is demanding an
      apology; North Korea's Kim Yo Jong dismissed the claims as a
      "conspiratorial farce."
    source: UN Command, Stars and Stripes
    url: https://www.stripes.com/theaters/asia_pacific/2026-09-30/north-korea-mines-dmz-armistice-23012081.html
    image: img/dmz-mine.jpg
    image_credit: South Korea Ministry of National Defense

  - section: World News
    title: Russia hits Kyiv's power grid overnight, killing 4
    body: >-
      Ballistic and cruise missiles backed by drones struck Kyiv's energy
      infrastructure overnight, killing at least four people, including a
      child in Vyshhorod, and causing widespread power outages. Grid
      operator Ukrenergo asked residents to postpone using high-power
      appliances. Prime Minister Serhii Koretskyi called it the first
      attack of this scale since the heating season ended, and President
      Zelensky renewed his appeal for more air-defense interceptors ahead
      of winter.
    source: AP, Kyiv Independent
    url: https://kyivindependent.com/russian-ballistic-missiles-rock-kyiv-disrupt-electricity-as-multi-day-russian-attacks-on-capital-continue/

  - section: World News
    title: France detains 400 students as school protests spread
    body: >-
      More than 400 people, mostly minors, were taken into custody Tuesday
      as protests over overcrowded classes and teacher shortages spread to
      more than 400 schools nationwide. At least 10 teachers and several
      students were hurt, along with 48 law enforcement officers; images
      showed burning bins and damaged bus stops. The unrest comes two days
      before Prime Minister Sebastien Lecornu's government presents a 2027
      budget with 54 billion euros in planned savings.
    source: AP
    url: https://abcnews.com/International/wireStory/french-presidential-campaign-heats-student-protests-fuel-political-136827389

  - section: World News
    title: Spain moves to ban evictions through 2030 after pensioner's case
    body: >-
      Spain's governing coalition approved a package including a
      moratorium on residential evictions until 2030 and automatic renewal
      of tenant leases, responding to nationwide housing protests. The
      push followed the eviction of 87-year-old Madrid pensioner Maricarmen
      Abascal after her rent nearly tripled to 2,650 euros a month; she
      later got her apartment back under a new lease. The measures, which
      also target speculative investment funds and short-term rentals,
      still need approval from a fragmented parliament that the coalition
      does not control.
    source: France 24, AFP
    url: https://www.france24.com/en/live-news/20260929-spain-aims-to-ban-evictions-until-2030-amid-housing-protests-1

  - section: World News
    title: Rubio ties suspected RAF Fairford plot to a "foreign actor"
    body: >-
      Secretary of State Marco Rubio said the incident near the UK air base
      used by US forces to strike Iran "clearly involves the hands of a
      foreign actor," pointing to Iran without offering evidence. Five
      British men in their 20s remain under investigation with strict
      movement conditions after suspicious vehicles were spotted near RAF
      Fairford, prompting evacuations of dozens of homes. Iran has denied
      any involvement.
    source: Fox News, Al Jazeera
    url: https://www.aljazeera.com/news/2026/9/29/uss-marco-rubio-says-uk-airbase-incident-involved-foreign-actor

  - section: AI News
    title: Trump orders federal government to call AI "Super Intelligence"
    body: >-
      An executive order directs executive-branch agencies to use "Super
      Intelligence" and "SI" instead of "artificial intelligence" in
      correspondence, public communications, websites and policy documents.
      Trump said the term "more appropriately captures the promise,
      potential, and rapidly advancing capabilities" of the technology. The
      State Department's international organizations bureau told diplomats
      to adopt the new terminology, and US representatives used "SI" at a
      UN Security Council meeting the next day. The order also directs
      officials to propose legislation within 60 days defining "super
      intelligence" in federal law.
    source: AP, ABC News
    url: https://abcnews.com/US/wireStory/us-diplomats-told-term-super-intelligence-artificial-intelligence-136698441

  - section: AI News
    title: OpenAI's revenue run rate nears $70 billion, up 70% this quarter
    body: >-
      OpenAI's annualized revenue has climbed to nearly $70 billion, up
      more than 70% since the start of the third quarter, Axios reports.
      Business-to-business revenue has more than doubled since July, and
      consumer revenue added in Q3 alone already exceeds all of 2025's
      consumer haul, driven by ChatGPT subscriptions, Codex and a growing
      advertising business. The jump follows a $40 billion run-rate figure
      reported just last month; OpenAI's actual profitability remains
      unclear since the report has little visibility into its expenses.
    source: Axios
    url: https://finance.yahoo.com/technology/ai/articles/openai-annualized-revenue-nears-70-144152179.html

  - section: AI News
    title: AI agent deleted 100+ Azure accounts in a 7-minute ransomware attack
    body: >-
      Microsoft says a threat actor it tracks as Storm-3168, publicly known
      as JadePuffer, used an AI agent to autonomously map, steal credentials
      from and destroy Azure cloud resources after compromising two service
      principals whose credentials had leaked in a public GitHub issue. The
      destructive phase took about seven minutes and attempted to delete
      more than 100 storage accounts, most of which succeeded; some were
      saved by Azure resource locks. The attacker also removed backup
      protections first, making recovery harder.
    source: Microsoft, BleepingComputer
    url: https://www.bleepingcomputer.com/news/security/jadepuffer-agentic-ai-attacks-target-azure-destroy-cloud-resources/

  - section: On This Day
    title: 1955 - James Dean dies in a car crash at 24
    body: >-
      The actor, who had starred in "East of Eden" and completed filming
      "Giant," died when his Porsche collided with another car near
      Cholame, California, while he was driving to a race. "Rebel Without
      a Cause" was released weeks later, cementing his status as a symbol
      of restless youth.
    when: Sep 30, 1955
    source: Wikipedia
    url: https://en.wikipedia.org/wiki/September_30
