  - section: World News
    title: Israel's president taps Eisenkot, not Netanyahu, to form a government
    body: >-
      NPR reports President Isaac Herzog picked the opposition candidate after consultations in which parties representing 67 of the 120 Knesset seats recommended Eisenkot and those with 46 backed Netanyahu. The nominee has 28 days to build a coalition, with a possible 14-day extension. Both men have ruled out working with the Arab-led parties, which endorsed Eisenkot. Netanyahu stays on as caretaker prime minister, and failure to form a government would force a new election.
    source: NPR
    url: https://www.npr.org/g-s1-152536
