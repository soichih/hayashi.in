stories:
  - section: Local Events
    title: Band in a Hat Showcase
    body: >-
      Eight new bands, formed at random two months ago, debut the original
      songs they wrote in that time.
    when: Sun Sep 27
    source: Visit Bloomington
    url: https://www.visitbloomington.com/event/band-in-a-hat-showcase/59616/
