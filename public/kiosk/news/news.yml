  - section: Local News
    title: Two juveniles admit threats involving Highland Park Elementary students
    body: >-
      The Monroe County Sheriff's Office says two minors admitted posting
      threatening social media messages about three Highland Park Elementary
      students. Deputies learned of the threats Sept 28 and both juveniles
      confessed in interviews. They were referred to Juvenile Probation, and a
      report went to the Department of Child Services. The sheriff's office
      has not said what the messages said or whether any plan existed.
    source: The Bloomingtonian
    url: https://bloomingtonian.com/2026/10/01/two-juveniles-admitted-sending-threats-involving-highland-park-students-sheriffs-office-says/
  - section: Local News
    title: Early voting starts Tuesday as absentee ballots outpace 2022
    body: >-
      In-person early voting in Monroe County begins Oct 6, and absentee
      ballot requests are running ahead of 2022. A court upheld the state's
      sore loser law, blocking Joe Davis's write-in bid for county clerk.
      Voter registration for the Nov 3 election closes Oct 5.
    source: B Square Bulletin
    url: https://bsquarebulletin.com/monroe-county-early-in-person-voting-starts-tuesday-absentee-ballot-pace-ahead-of-2022/
  - section: Local News
    title: Council budget talks turn to staff cuts ahead of Oct 7 vote
    body: >-
      Bloomington City Council discussions of the 2027 budget have moved to
      possible personnel reductions. Proposed cuts add up to millions on paper
      but save far less than the headline figure. The final vote is Wednesday,
      Oct 7.
    source: B Square Bulletin
    url: https://bsquarebulletin.com/2027-budget-talks-for-bloomington-city-council-turn-to-potential-staffing-cuts/
