  - section: Local News
    title: City council votes Wednesday on 2027 budget after 15 proposed cuts
    body: >-
      The Common Council holds a special session at 6:30pm Wednesday in Room 115
      at City Hall for final votes on the 2027 civil city and transit budgets,
      plus first readings of the water and wastewater utility budgets and
      police and fire salary ordinances.

      The civil city levy is capped at $43.76 million, a 6 percent increase over
      2026, with a $63.75 million general fund. Council members filed 15
      amendments to cut spending, including a $2.5 million parking meter
      appropriation and $3 million in housing grant funding. The meeting is
      streamed on CATS and the city's YouTube channel and open on Zoom.
    source: WBIW
    url: https://www.wbiw.com/2026/10/05/bloomington-common-council-to-vote-on-2027-city-budgets-and-tax-levies-at-october-7-special-session/

  - section: Local News
    title: Dillman Road plant filter repairs add $1.125 million
    body: >-
      The Utilities Service Board approved the change order Monday to replace
      underdrains and media at the Dillman Road wastewater plant after filter
      failures, bringing the project to $1.875 million. The manufacturer would
      not warranty repairs unless all the underdrains were replaced, and only
      one of four filters is working, said Capital Projects Manager Dan Hudson.
      Rebidding could have cost two to three months.
    source: The Bloomingtonian
    url: https://bloomingtonian.com/2026/10/06/bloomington-approves-1-125-million-change-order-after-dillman-filters-fail/

  - section: Local News
    title: Monroe County asks Stinesville to suspend ICE agreement
    body: >-
      Commissioners adopted a resolution asking the town to publish its
      287(g) agreement with Immigration and Customs Enforcement, take public
      comment and suspend work until the town council votes on it in public.
      The Stinesville Police Department signed the agreement in February
      without documented public authorization. The resolution is a
      recommendation, not a legal directive.
    source: The Bloomingtonian
    url: https://bloomingtonian.com/2026/10/06/monroe-county-commissioners-ask-stinesville-to-suspend-ice-agreement-pending-public-vote/

