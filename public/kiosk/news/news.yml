  - section: Local News
    title: FBI and ATF join Kirkwood shooting investigation; six of seven victims released
    body: >-
      Federal agents are helping Bloomington police collect evidence and witness statements and process seized firearms and shell casings. One 27-year-old man remains hospitalized in stable condition. The seven victims, ages 17 to 27, were shot around 1:30am Sunday in the 400 block of East Kirkwood Avenue; police say none were believed to be IU students.

      An 18-year-old Indianapolis man seen running from the scene with an AR-15-style handgun is jailed on preliminary allegations of resisting law enforcement and unlawful gun possession. Police don't know whether he fired it or how many people did. Casings from two calibers were found, and investigators are reviewing surveillance video. Anyone with information can call Detective Chris Scott at 812-339-4477.
    source: The Bloomingtonian
    url: https://bloomingtonian.com/2026/11/02/fbi-atf-join-investigation-into-kirkwood-shooting-1-remains-hospitalized/
  - section: Local News
    title: Council holds Nov. 4 hearing on $6.87 million bond after dispatch tax failure
    body: >-
      The council's 1-4 vote on raising the dispatch tax failed because four absences count as no votes. The proposed bond would put $2.5 million toward replacing the only aerial platform fire truck, out of service for more than four months, and $4.23 million toward transportation, including 10th Street and 3rd Street safety work. A public hearing and possible final vote are set for Wednesday.
    source: The B Square Bulletin
    url: https://bsquarebulletin.com/bloomington-proposes-6-87m-bond-issue-for-fire-truck-street-safety-plans-for-regular-borrowing/
