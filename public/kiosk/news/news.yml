  - section: World News
    title: Pope Leo lands in Uruguay on first Latin America trip as pope
    body: >-
      The 12-day tour covers Uruguay (Nov. 6-8), Argentina (Nov. 8-11) and Peru (Nov. 11-17), and comes weeks after lung cancer surgery on Oct. 13. Peru includes a return to Chiclayo, the diocese he led before his election. It is the first papal visit to Argentina since Francis, who never returned during his papacy.
    source: Vatican News
    url: https://www.vaticannews.va/en/pope/news/2026-11/vatican-press-office-presents-pope-leo-s-journey-latin-america.html
  - section: World News
    title: Israel's election leaves no clear winner; Arab-led parties hold balance
    body: >-
      Netanyahu's bloc won 53 of 120 Knesset seats, Gadi Eisenkot's opposition bloc 48, and Arab-led parties 19, a record. Neither bloc reaches 61. Netanyahu rules out working with Arab parties and claims they "stole" the election, which the elections committee says has no basis. Eisenkot has set conditions for partnering with them. The new Knesset is due to be sworn in Nov. 10; repeated failure to form a government would mean a new election early next year.
    source: Associated Press
    url: https://abc30.com/story/won-2026-israel-election-partial-results-indicate-possible-deadlock-prime-minister-netanyahu-alleges-fraud/19996029/
