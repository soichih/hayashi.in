  - section: Local News
    title: Jury convicts Bryce Leighton of murder in 2023 Monroe County shooting
    body: >-
      A Monroe County jury found Leighton guilty in the November 2023 shooting death of Tara Langley, according to the county prosecutor's office. Deputies responded to a home on State Road 45 after a neighbor reported a man yelling and found Langley dead in the attached garage. Leighton told investigators the two had been in a relationship for seven years and that he fired in a blur after she approached with a stun gun. A detective wrote that he was standing just inside the garage doorway when the shot was fired. No sentencing date has been reported.
    source: The Bloomingtonian
    url: https://bloomingtonian.com/2026/10/30/jury-finds-bryce-leighton-guilty-of-murder-in-2023-killing-of-tara-langley/
  - section: Local News
    title: Council holds Nov. 4 hearing on $6.87 million bond after dispatch tax failure
    body: >-
      The council's 1-4 vote on raising the dispatch tax failed Monday because four absences count as no votes. The proposed bond would put $2.5 million toward replacing the only aerial platform fire truck, out of service for more than four months, and $4.23 million toward transportation, including 10th Street and 3rd Street safety work. A public hearing and possible final vote are set for Nov. 4.
    source: The B Square Bulletin
    url: https://bsquarebulletin.com/bloomington-proposes-6-87m-bond-issue-for-fire-truck-street-safety-plans-for-regular-borrowing/
