  - section: Local News
    title: Boil water advisory lifted after treatment plant outage
    body: >-
      Storm-related power outages on Sept 18 knocked out raw-water and alum
      pumps at the Monroe Water Treatment Plant, dropping filtration below
      the state turbidity limit and prompting a boil advisory issued just
      before midnight Sunday. City Utilities lifted the advisory Monday
      after distribution-system testing came back clear, though pressure may
      stay lower than normal in some areas while the system recovers. CBU
      has a $2.375 million EPA grant in progress for backup power and
      control-system upgrades at the plant.
    source: City of Bloomington Utilities
    url: https://bloomington.in.gov/news/2026/09/21/6655

  - section: Local News
    title: Duke Energy expands bill assistance to up to $250 a household
    body: >-
      Duke Energy Indiana's Share the Light Fund is offering up to $250 in
      account credit per qualifying household this year, plus a new Summer
      Energy Credit program, backed by $900,000 in shareholder funding for
      2026, double last year's amount. Credit can cover bills, deposits or
      reconnection charges; eligibility depends on income, family size and
      available funding. Monroe County residents apply through South Central
      Community Action Program at 812-339-6447.
    source: The Bloomingtonian
    url: https://bloomingtonian.com/2026/09/22/duke-announces-more-bill-assistance-eligible-customers-can-receive-up-to-250/

  - section: Local News
    title: Monroe County backs fire levy increase for Bean Blossom merger
    body: >-
      Commissioners voted 2-0 to approve a resolution supporting a $1.09
      million increase to the Monroe Fire Protection District's maximum
      property-tax levy, a required step before the district can request it
      from the state. Bean Blossom Township is set to formally join the
      district Jan 1, 2027; officials expect the funding to support 24-hour
      staffing at the Stinesville fire station.
    source: The Bloomingtonian
    url: https://bloomingtonian.com/2026/09/19/county-backs-1-09-million-fire-levy-increase-request-as-bean-blossom-prepares-to-join-monroe-fire-district/

  - section: Local News
    title: State funding cuts to hit county drug and mental health courts
    body: >-
      Monroe County probation officials told the county council that a 13.8%
      cut in state funding will reduce support for drug court, mental health
      court and community corrections starting in 2027. The county received
      about $1.2 million from the Indiana Department of Correction in 2026;
      one field officer position will be eliminated and another shifted onto
      the county general fund.
    source: The Bloomingtonian
    url: https://bloomingtonian.com/2026/09/16/local-government-roundup-county-funding-cuts-edgewood-biotech-plans-health-department-transition-and-bloomington-light-pollution-proposal/

  - section: Local News
    title: Bloomington police short 12 officers as hiring continues
    body: >-
      Chief Michael Diekhoff told the Board of Public Safety the department
      has filled 93 of its 105 authorized officer positions. Recruits go
      through physical fitness testing, a written assessment, oral board
      interviews and a background investigation before entering the academy.
    source: The Bloomingtonian
    url: https://bloomingtonian.com/2026/09/19/bloomington-police-report-12-unfilled-officer-positions-as-hiring-process-continues/

  - section: Local News
    title: City commissions back light-pollution reduction rules
    body: >-
      Bloomington's sustainability and environmental commissions both
      endorsed a resolution to adopt DarkSky-style lighting standards aimed
      at cutting light pollution. The measure still needs City Council
      approval to take effect.
    source: The Bloomingtonian
    url: https://bloomingtonian.com/2026/09/16/local-government-roundup-county-funding-cuts-edgewood-biotech-plans-health-department-transition-and-bloomington-light-pollution-proposal/

  - section: Local News
    title: IU survey finds Indiana teen vaping and drinking at new lows
    body: >-
      Indiana University's 2026 statewide survey of nearly 54,000 students
      found high school seniors' vaping rate fell to 8.2%, down from 9.6% in
      2024, and binge drinking hit its lowest recorded level at 4.4%.
      Students still badly overestimate their peers' habits: only 1.1% of
      seniors reported smoking cigarettes, but they guessed 22.5% of peers
      did.
    source: The Bloomingtonian
    url: https://bloomingtonian.com/2026/09/22/iu-survey-finds-further-declines-in-teen-vaping-and-drinking-across-indiana/

