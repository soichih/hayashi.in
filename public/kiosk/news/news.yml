  - section: Local News
    title: Indiana Senate Democrats gain five seats, reelect Yoder as leader
    body: >-
      The caucus says it flipped five Republican-held seats and grows from 10 to 15 members for the 2027 session. Sen. Shelli Yoder was reelected leader, with Rodney Pol Jr. as assistant leader and La Keisha Jackson as caucus chair. Democrats list utility bills, grocery and housing costs, school and child care funding, and health care as budget priorities.
    source: The Bloomingtonian
    url: https://bloomingtonian.com/2026/11/06/yoder-reelected-senate-democratic-leader-as-caucus-announces-five-seat-gain/
  - section: Local News
    title: Bloomington Transit proposes cutting four routes from Dec. 6
    body: >-
      The board voted 5-0 on Nov. 4 to seek public comment on temporary cuts that would remove about 237 driver hours a week from Dec. 6 through May 2027. Routes 2 West and 2 South would merge into one hourly weekday route. Route 7 loses weekday departures at 40 past the hour, Route 11 loses weekend service, and Route 16 drops from three buses to two Monday through Saturday. The cause is a driver shortage.

      Public hearing is Tue Nov. 17, 4:30-5:30pm at the downtown Transit Center, with a final vote expected that day. Comments are open through Dec. 5.
    source: The B Square Bulletin
    url: https://bsquarebulletin.com/possible-bus-service-cuts-bloomington-transit-board-sets-public-hearing/
  - section: Local News
    title: Ellettsville-Richland merger passed by 35 votes outside town limits
    body: >-
      Indiana law requires a majority both inside and outside the town. Inside Ellettsville it passed 1,493 to 1,001; outside, 1,514 to 1,479. The plan folds Richland Township government into a larger Town of Ellettsville on Jan. 1, 2027.

      A recount needs petition signatures from 10% of voters on the question plus a $100 deposit, filed by noon Tuesday, Nov. 17.
    source: The B Square Bulletin
    url: https://bsquarebulletin.com/ellettsville-richland-township-reorganization-passes-by-narrow-margin-outside-town-limits/
  - section: Local News
    title: Griffy Lake closes for controlled deer hunts on two weekends
    body: >-
      Hunts run Nov. 14-15 and Nov. 21-22 for hunters selected through the Parks and Recreation process. All trails, shoreline and the lake close from 11pm Friday, Nov. 13 to 5am Monday, Nov. 16, and again from 11pm Friday, Nov. 20 to 5am Monday, Nov. 23. No watercraft may launch either weekend.
    source: City of Bloomington
    url: https://bloomington.in.gov/news/2026/11/04/6687
  - section: Local News
    title: Arrest made in Winslow Road hit-and-run that critically injured pedestrian
    body: >-
      A pedestrian was struck by an SUV at East Winslow Road and South Henderson Street around 8:40pm Monday and flown to an Indianapolis hospital in critical condition. Police identified the vehicle from surveillance video and a broken wiper part.

      A 34-year-old man was arrested Wednesday on a preliminary Level 4 felony charge of leaving the scene of an accident resulting in catastrophic injury. The allegations have not been proven in court.
    source: The Bloomingtonian
    url: https://bloomingtonian.com/2026/11/06/man-arrested-after-hit-and-run-left-pedestrian-critically-injured-on-winslow-road/
