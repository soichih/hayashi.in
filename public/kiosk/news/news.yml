  - section: Local News
    title: Water and AC restored at IU's Tulip Tree Apartments
    body: >-
      Tulip Tree residents went nearly two days without water or air
      conditioning after low tank levels in the city system forced the
      water treatment plant to cut pumping capacity. IU brought in portable
      restrooms and offered temporary housing at Ashton Residence Center
      while crews worked to restore service. Some residents said IU
      Housing's first notice came more than 12 hours after the outage
      began.
    source: Indiana Daily Student
    url: https://www.idsnews.com/article/2026/09/water-air-conditioning-at-iu-s-tulip-tree-apartments-returns-after-nearly-2-days
    image: img/tulip-tree.jpg
    image_credit: Indiana Daily Student

  - section: Local News
    title: IU puts Theta Chi fraternity on cease and desist
    body: >-
      IU barred Theta Chi from recruitment, social and philanthropic
      events over hazing allegations, after police found drug paraphernalia
      at the house while responding to a fire alarm. The fraternity has
      been sanctioned for hazing three times since 2022, most recently a
      suspension in 2022-23 and social restrictions through late 2023.
    source: Indiana Daily Student
    url: https://www.idsnews.com/article/2026/09/iu-places-fraternity-theta-chi-on-cease-and-desist-alleged-hazing

  - section: Local News
    title: IU physicists near completion of 1,600-pound neutrino detector
    body: >-
      A 29-institution team led by IU professor Rex Tayloe is finishing a
      liquid-argon detector to measure how neutrinos scatter off atomic
      nuclei, a precision test of the Standard Model. It will run at Oak
      Ridge National Laboratory alongside the world's most powerful pulsed
      proton beam. Tayloe says the team hopes to have it running by
      December.
    source: Indiana Daily Student
    url: https://www.idsnews.com/article/2026/09/indiana-university-researchers-1600-pound-particle-detector-proton-beam

  - section: US News
    title: CNN, MS NOW and Politico sue Trump over White House ban
    body: >-
      The three outlets were barred from the White House on Saturday after
      Trump accused them of lying about him and threatened to ban more
      "fake news" outlets. Their lawsuit argues the ban violates due
      process and the First Amendment's protections for newsgathering.
      A federal judge has set a hearing for Wednesday. The five networks
      that normally rotate White House pool coverage agreed to suspend it
      in solidarity.
    source: NBC News, CNN
    url: https://www.nbcnews.com/politics/trump-administration/cnn-politico-ms-now-plan-sue-trump-administration-ban-white-house-cove-rcna598912

  - section: US News
    title: Paramount sweetens $110 billion Warner Bros. Discovery bid
    body: >-
      Paramount is paying $31 a share for WBD and has added concessions to
      close the deal: it will cover the $2.8 billion fee WBD owes Netflix
      to exit its prior merger agreement and absorb up to $1.5 billion in
      financing costs. A $7 billion termination fee applies if regulators
      block the deal. Closing is expected in the third quarter.
    source: Warner Bros. Discovery SEC filings, NPR
    url: https://www.npr.org/2026/09/21/nx-s1-5974909/paramount-warner-bros-discovery-merger-concessions

  - section: US News
    title: 18 suspects in Haiti president's assassination extradited to US
    body: >-
      The suspects, including 17 Colombian former soldiers and ex-Haitian
      justice ministry employee Joseph Badio, were flown from Port-au-Prince
      to Florida to face federal charges. They are among 30 people indicted
      in the US over the July 2021 killing of President Jovenel Moise, who
      was shot 12 times at his home; his wife was wounded in the attack.
    source: NPR
    url: https://www.npr.org/2026/09/21/nx-s1-5976026/suspects-killing-haiti-president-extradited

  - section: World News
    title: Ukraine's biggest drone barrage yet hits Moscow oil refinery
    body: >-
      Ukraine fired more than 1,000 drones and missiles overnight, with
      hundreds aimed at the Moscow region in what officials called the war's
      largest strike on the capital so far. The Kapotnia refinery, which
      supplies about 40% of Moscow's gasoline, was damaged along with a
      logistics complex; Russia says its defenses downed 1,110 drones. At
      least two people were killed and 20 wounded in the Moscow region.
    source: PBS NewsHour
    url: https://www.pbs.org/newshour/world/ukraine-fires-over-1000-drones-at-russia-including-largest-ever-attack-on-moscow
    image: img/ukraine-moscow-strike.jpg
    image_credit: Reuters via PBS NewsHour

