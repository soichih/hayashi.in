    title: "Kirkwood shooting: FBI and ATF assist; one victim still hospitalized"
    body: >-
      Federal agents are helping Bloomington police process evidence from the shooting that left seven people aged 17 to 27 wounded around 1:30am Sunday in the 400 block of East Kirkwood Avenue. One 27-year-old man remains hospitalized in stable condition. An 18-year-old Indianapolis man is jailed on preliminary allegations of resisting law enforcement and unlawful gun possession.

      Anyone with information can call Detective Chris Scott at 812-339-4477.
    source: The Bloomingtonian
    url: https://bloomingtonian.com/2026/11/02/fbi-atf-join-investigation-into-kirkwood-shooting-1-remains-hospitalized/
