    title: State counselor says Monroe commissioners broke Open Door Law over jail statement
    body: >-
      In a Nov. 9 advisory opinion, Public Access Counselor Brittney Long found that two commissioners helped draft a May 25 joint statement on a North Park jail in a shared Google Doc without public notice. The county had argued no meeting occurred because only one commissioner opened the document. Long did not decide whether the jail's location was settled in that process. The opinion is advisory, not a court ruling.
    source: The Bloomingtonian
    url: https://bloomingtonian.com/2026/11/17/state-access-counselor-finds-monroe-commissioners-violated-open-door-law-over-google-docs-statement/
  - section: Local News
    title: Park board tabled an earlier 10pm closing time after 300 comments
    body: >-
      Staff proposed moving Bloomington's park closing from 11pm to 10pm, saying it would let police clear camps sooner and save about $15,000 a year in security coverage. The Board of Park Commissioners tabled the idea Nov. 12, and staff reported little public support. Hours stay 5am to 11pm while staff consult the city's legal department on the loitering language.
    source: The Bloomingtonian
    url: https://bloomingtonian.com/2026/11/17/bloomington-weighs-earlier-park-closing-time-after-years-of-using-11-p-m-deadline-to-clear-camps/
  - section: Local News
    title: Council to consider raising trash cart fees nearly 50% by 2029
    body: >-
      The City Council takes up the ordinance Wednesday, Nov. 18, for initial consideration only; passage that night would need unanimous support. The monthly fee for a 64-gallon cart would rise from $16.97 to $19.40 in 2027, $22.64 in 2028 and $25.13 in 2029. The 35-gallon cart goes from $9.28 to $13.89 and the 96-gallon cart from $25.46 to $37.70.

      The increases would end a $1.6 million annual general-fund subsidy of curbside collection over three years.
    when: Wed Nov 18
    source: The B Square Bulletin
    url: https://bsquarebulletin.com/bloomington-garbage-headline-city-cart-fees-could-climb-nearly-50-by-2029/
