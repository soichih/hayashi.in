  - section: AI News
    title: Anthropic's message threads cut Claude Code wait by about 35%
    body: >-
      A Messages API beta opened Nov. 2 lets clients send only new messages plus the previous response ID instead of resending the whole conversation. Anthropic says median time to first token on Claude Code requests of 500,000 to 1 million tokens dropped about 35%.

      Billed tokens, pricing and rate limits don't change. A thread expires five minutes after the last request, and threads aren't covered by zero data retention or available to HIPAA-enabled organizations. Claude Code users need no changes.
    source: AI News Today
    url: https://pasqualepillitteri.it/en/news/29685/anthropic-message-threads-claude-code-faster
    image: img/claude-threads.jpg
    image_credit: AI News Today
  - section: AI News
    title: OpenAI says it will honor a robots.txt signal to opt out of AI training
    body: >-
      Sites would add a group naming the user agent __usage_ai-training with standard Disallow and Allow lines. Support isn't live and OpenAI has given no date; GPTBot rules still apply meanwhile. The syntax comes from an individual IETF draft by an Anthropic author, has no standards status, and covers training only, not crawling. Google and Microsoft are also reported to back it.
    source: AI News Today
    url: https://pasqualepillitteri.it/en/news/29386/openai-robots-txt-signal-ai-training-opt-out
  - section: AI News
    title: Anthropic's IPO filing says Claude writes over 90% of its code
    body: >-
      The S-1 says over 90% of Anthropic's code contributions in September were written by Claude. An amended filing reports revenue of $33.2 billion for the nine months ended Sept. 30, and says future models "may imminently meet" the company's threshold for AI-accelerated research, though no current model is designated as past it.
    source: AI News Today
    url: https://pasqualepillitteri.it/en/news/29574/anthropic-ipo-s1a-ai-research-threshold
