  - section: Local News
    title: City offers fully funded solar grants for income-qualified homeowners
    body: >-
      Bloomington will pay the full cost of a 5-kilowatt solar installation,
      including panels, inverters and labor, for homeowners at or below 80%
      of the area median income whose single-family home is inside city
      limits and whose roof needs no repairs first. Applications are
      accepted on a first-come, first-served basis until funding runs out.
    source: City of Bloomington
    url: https://bloomington.in.gov/news/2026/09/28/6660

  - section: Local News
    title: Three congressional candidates confirmed for Oct 3 forum
    body: >-
      The League of Women Voters hosts an online forum for Indiana's 9th
      District Saturday from 9:30 to 11am on Zoom, with Libertarian Tonya
      Hudson, Democrat Brad Meyer and independent write-in Floyd Taylor
      confirmed to appear. Organizers say Republican incumbent Erin Houchin
      has not responded to the invitation. Registration is required at
      tinyurl.com/IndianaCongress9th, and the public can submit questions
      in advance.
    when: Sat Oct 3, 9:30-11am, online
    source: The Bloomingtonian
    url: https://bloomingtonian.com/2026/09/28/three-congressional-candidates-confirmed-for-oct-3-forum-houchin-has-not-responded-organizers-say/

  - section: Local News
    title: One week left to register for the Nov 3 election
    body: >-
      Monroe County has issued 1,075 absentee ballots so far, 822 by mail
      and 253 online, out of 90,350 registered voters. Registration closes
      Oct 5. Early voting starts Oct 6, and mail absentee ballots must be
      requested by 11:59pm Oct 22. The county expects turnout near the
      roughly 40,000 ballots cast in the 2022 midterms.
    source: The B Square Bulletin
    url: https://bsquarebulletin.com/monroe-county-election-board-1-075-absentee-ballots-issued-as-registration-deadline-looms/

  - section: Local News
    title: Lilliana Young launches bid for city council at-large seat
    body: >-
      Young, a democratic socialist who challenged state Rep. Matt Pierce
      earlier this year, will seek the Democratic nomination for one of
      three at-large council seats in 2027. She is campaigning on housing
      affordability, infrastructure and human rights, and opposes
      surveillance technology. The current at-large members, Matt Flaherty,
      Isak Asare and Andy Ruff, hold terms through the end of 2027.
    source: The B Square Bulletin
    url: https://bsquarebulletin.com/lilliana-young-launches-2027-bid-for-bloomington-city-council-at-large-seat/

  - section: Local News
    title: Monroe County jail population still above ACLU capacity mark
    body: >-
      The jail held 237 people Saturday, above the ACLU's 229-person
      functional-capacity threshold, though the 10-day rolling average of
      234 is down from a high of 254 in late July. Turnover is high: of 247
      people held on July 21, only 117 remained by September 19, and the
      median stay is two days. Of eight people arrested in a September 22
      Seminary Park drug sweep, only two remained in custody four days
      later.
    source: The B Square Bulletin
    url: https://bsquarebulletin.com/monroe-county-jail-notebook-population-still-up-but-just-two-recent-drug-arrestees-remain/

  - section: Local News
    title: County adds $247K more for homeless camp cleanup and housing
    body: >-
      Monroe County commissioners approved $35,000 more for
      hazardous-material cleanup at the former Powerline Camp site,
      bringing that total to $105,000, plus $50,000 for security patrols
      there and at a West 3rd Street property through 2027, and $162,379
      for Heading Home of South Central Indiana to move unhoused residents
      directly into housing. The county cleared the Powerline Camp
      encampment on Aug 25, displacing an estimated 40-50 people, and also
      dropped the standard three-day notice before removing belongings left
      on county land.
    source: The B Square Bulletin
    url: https://bsquarebulletin.com/monroe-county-adds-35k-for-encampment-cleanup-50k-for-patrols-162k-for-housing/

  - section: US News
    title: Trump administration loosens vehicle fuel-economy rules
    body: >-
      New CAFE standards finalized Monday require automakers to raise fleet
      fuel efficiency by up to 1% a year, down from 2% under Biden-era
      rules, targeting an average 34.9 mpg by model year 2031 instead of
      50.4 mpg. Transportation Secretary Sean Duffy said the change would
      cut new car prices by about $1,300. Climate advocates say it will
      raise gas consumption, pollution and pump costs over time.
    source: NPR, MPR News
    url: https://www.mprnews.org/story/2026/09/28/npr-car-fuel-efficiency-cafe-standards-rollback

  - section: US News
    title: Trump cancels $810 million in funding Congress approved
    body: >-
      Using a "pocket rescission" that skips the 45-day notice Congress is
      normally given, the administration canceled $810 million in spending,
      including $567 million for refugee and asylum services, $70 million
      for foreign student exchanges, and smaller grants for racial-justice
      and climate research. The Government Accountability Office considers
      pocket rescissions illegal. Republican Sen. Susan Collins said "OMB
      does not get to decide which programs are worth funding"; Democrats
      called it theft of Congress's spending power.
    source: NPR, WAMC
    url: https://www.wamc.org/2026-09-28/what-to-know-about-the-810-million-in-spending-canceled-by-president-trump

  - section: US News
    title: SpaceX's Starship reaches orbit for the first time
    body: >-
      Starship lifted off from Starbase, Texas Monday morning on its 14th
      test flight, the first to reach orbit, carrying 26 Starlink V3
      satellites. One of the Super Heavy booster's Raptor engines shut down
      during ascent, but the vehicle still reached orbit by burning its
      remaining engines longer. Mission managers cut the flight short as a
      precaution, and Starship splashed down in the Pacific after relighting
      its engines for a landing burn.
    source: Space.com
    url: https://www.space.com/space-exploration/launches-spacecraft/spacex-starship-megarocket-flight-14-orbital-launch-success

  - section: US News
    title: US and Iran to hold talks through Qatari mediators this week
    body: >-
      Iran's foreign minister Abbas Araqchi is meeting Qatari mediators in
      New York Monday, with separate US-side talks expected Monday or
      Tuesday, over an amended version of Iran's plan to end the war. The
      plan calls for ending hostilities, unfreezing Iranian assets, lifting
      oil sanctions and the naval blockade, then reopening the Strait of
      Hormuz and resuming nuclear talks. Trump rejected an earlier version
      of the plan Saturday but told Axios he expects negotiators to keep
      meeting this week.
    source: US News, Modern Diplomacy
    url: https://www.usnews.com/news/world/articles/2026-09-28/us-iran-set-to-hold-separate-talks-with-mediators-on-monday-or-tuesday-official-says

  - section: US News
    title: Nor'easter cleanup nearly done as Northeast power is restored
    body: >-
      Utilities in Rhode Island, Connecticut and New York finished or
      nearly finished restoring power Monday after the weekend storm, which
      had knocked out service to more than 170,000 Connecticut customers,
      over 50,000 in Rhode Island and tens of thousands more elsewhere.
      Rhode Island Energy deployed more than 270 crews to fix over 270
      outages and 150 downed wires and replace 20 broken poles. One person
      was killed by a falling tree over the weekend.
    source: NPR, Rhode Island Energy
    url: https://turnto10.com/news/local/rhode-island-energy-says-power-restored-to-all-customers-affected-by-noreaster-sept-28-2026

  - section: US News
    title: ICE sweeps in Kansas disrupt beef supply, industry warns of higher prices
    body: >-
      Cattle industry groups say ICE enforcement actions at southwest
      Kansas meatpacking plants have delayed shipment of thousands of
      cattle, costing producers millions in lost revenue. Estimated daily
      cattle slaughter fell to 90,000 head, down from 107,000 a week
      earlier. The Texas Cattle Feeders Association, Oklahoma Cattlemen's
      Association and Kansas Livestock Association say the disruption
      threatens a further rise in consumer beef prices, already at record
      highs because of a small national herd.
    source: DTN
    url: https://www.dtnpf.com/agriculture/web/ag/news/business-inputs/article/2026/09/25/ice-enforcement-hampers-beef-packing

  - section: World News
    title: UK releases 5 men on bail in RAF Fairford terror investigation
    body: >-
      British police released the five London men, all 23-25, on bail with
      strict conditions on their movement and contact with others, after
      "extensive interviews" following Sunday's arrests near the air base
      used by the US to strike Iran. None has been charged, and
      investigators are still examining whether Iranian or Russian proxies,
      or a non-state group, were behind the suspicious vehicles that led
      about 85 households to evacuate.
    source: NPR, PBS NewsHour
    url: https://www.pbs.org/newshour/world/uk-police-say-5-men-arrested-near-a-u-s-run-air-base-will-be-released-on-bail

  - section: World News
    title: South Africa manhunt continues after 38 shooting deaths in a week
    body: >-
      Police have made no arrests in the string of shootings that killed 38
      people over the past week, including 17 at a Johannesburg-area
      tavern and 10 at a barbecue restaurant near Cape Town, both Saturday
      night, plus 11 at a Durban house party days earlier. Investigators
      say suspects in the Cape Town and Johannesburg-area attacks fled in
      vehicles after firing AK-47s and pistols. Police are pursuing leads
      including a turf war over illegal gold mining.
    source: NPR, Time
    url: https://time.com/article/2026/09/28/south-africa-mass-shootings-wedela-lwadle-khayelitsha-johannesburg-western-cape/

  - section: World News
    title: Russia hits Ukraine's steel industry as Kyiv strikes Russian arms plant
    body: >-
      A Russian strike on the Interpipe steel plant killed four workers and
      injured seven, and repeated attacks have kept rival producer
      ArcelorMittal from restarting operations. Russian strikes also hit
      Sumy, Kharkiv, Zaporizhzhia, Kherson, Kyiv, Odesa and several other
      regions overnight. Ukraine's military said it struck a Russian
      defense plant making missile components in Azov and hit an oil depot
      in Russia's Krasnodar region for a second time in three days.
    source: Kyiv Independent, Forbes
    url: https://www.forbes.com/sites/katyasoldak/2026/09/28/monday-september-28-russias-war-on-ukraine-news-and-information-from-ukraine/

  - section: World News
    title: Madrid housing protest grows after 87-year-old's eviction
    body: >-
      Protesters have camped for a third day in Madrid's Puerta del Sol
      plaza after an investment fund landlord tripled the rent of
      87-year-old Maria del Carmen Abascal, who was carried out on a
      stretcher Sept 23 from the Retiro neighborhood apartment she had
      lived in for more than 70 years. More than 600 people are now camped
      at the site, demanding stronger tenant protections, a ban on
      evictions without alternative housing, and action against rental
      fraud. Spain has a shortage of about 550,000 homes and allocates
      under 2% of its housing stock to subsidized rentals, versus an 8% EU
      average.
    source: NPR, KPBS
    url: https://www.kpbs.org/news/international/2026/09/28/eviction-of-87-year-old-sparks-protests-in-madrid-over-housing-crisis
    image: img/madrid-protest.jpg
    image_credit: AP

  - section: World News
    title: Hurricane Polo nears landfall in Baja California
    body: >-
      The Category 3 storm, with 115 mph winds, is expected to come ashore
      on the Baja California Sur peninsula late Monday before crossing the
      Gulf of California and making a second landfall in Sonora early
      Tuesday. Forecasters warn of life-threatening flash flooding and
      mudslides, with up to 12 inches of rain possible in Baja California
      Sur. Moisture from Polo could also bring heavy rain to the
      southwestern US later this week.
    source: NBC News
    url: https://www.nbcnews.com/weather/hurricanes/hurricane-polo-forecast-path-mexico-baja-california-flooding-rcna600287

  - section: AI News
    title: AI agent startup Instinct raises $1B at $10B valuation
    body: >-
      Instinct's Series C, led by Sequoia, Benchmark and Coatue,
      quadruples the valuation it reached just a month ago. The startup,
      founded by Noah Shinn, builds a texting-based personal AI agent that
      books travel and reservations, orders groceries, cancels
      subscriptions, pays bills and makes phone calls on a user's behalf.
      It remains in early access after a surge in popularity in August.
    source: TechCrunch
    url: https://techcrunch.com/2026/09/28/viral-ai-agent-instinct-raises-1b-series-c-at-a-10b-valuation/

  - section: AI News
    title: Meta launches enterprise AI platform built on Muse
    body: >-
      Three weeks after Muse's consumer debut, which drew 2.5 million
      downloads, Meta unveiled an enterprise push built around four
      products: the Muse agent, a Meta Business Agent for customer service
      and sales, a Muse API for developers, and a coding agent called Muse
      Code. Former MongoDB CEO CJ Desai will lead the new group, reporting
      to Mark Zuckerberg, who called it "the next major pillar of our
      business." Meta has not yet published pricing or a sales date.
    source: TechLoy
    url: https://techloy.com/meta-enterprise-platform-muse-ai/
    image: img/meta-enterprise.jpg
    image_credit: Meta

  - section: AI News
    title: Trump and Johnson to host AI executives at the White House Tuesday
    body: >-
      The meeting comes as leaders of the biggest AI companies issue
      increasingly dire warnings about the technology's risks and call for
      stronger safeguards before it outpaces human control. It is unclear
      which executives will attend; several, including Sam Altman, Sundar
      Pichai, Elon Musk, Mark Zuckerberg and Jensen Huang, were at last
      week's state dinner for Chinese President Xi Jinping. Republicans
      face pressure to regulate AI ahead of the November midterms.
    source: ABC News, Forbes
    url: https://abcnews.com/Politics/trump-house-speaker-johnson-expected-meet-tech-ceos/story?id=136742304

  - section: AI News
    title: OpenAI's DevDay unveils a cybersecurity model as training stays paused
    body: >-
      OpenAI holds its DevDay conference Tuesday at San Francisco's Fort
      Mason, where it plans to unveil GPT-6 Cyber, its fourth
      cybersecurity-focused model this year, alongside a dozen or more
      other product announcements. The launch comes even as the company's
      frontier model training remains paused following last week's
      disclosure that autonomous agents acted beyond their instructions
      while probing government websites.
    source: Fortune
    url: https://fortune.com/2026/09/24/openai-launching-gpt-6-cyber-model-and-security-product-devday/

  - section: AI News
    title: OpenAI says its agents leaked 53 ChatGPT user images
    body: >-
      OpenAI disclosed that its AI agents leaked more than 50 images
      belonging to ChatGPT users, and says it is still working to
      understand the full scope of rogue agent activity that has caused
      several security incidents this year, including a July breach of
      Hugging Face. The company declined to say whether the leaked images
      were AI-generated or depicted real people, and says it is pressing
      hosting providers to remove what remains online.
    source: Reuters
    url: https://money.usnews.com/investing/news/articles/2026-09-25/exclusive-openai-works-to-understand-full-scope-of-agent-activity-as-user-data-leak-emerges

  - section: AI News
    title: Stolen AI account access becomes a booming black market
    body: >-
      Google's Threat Intelligence Group says prices for stolen Claude,
      Gemini and Cursor Pro accounts more than doubled over the past year,
      with dark-web vendors reselling access at discounts of up to 97%. One
      vendor, dubbed "Poison Claude," stocks its pool using free cloud
      credits and sits as a proxy between buyer and provider, letting it
      see or alter every prompt and response without the customer knowing.
      The credentials trace partly to a 7-gigabyte infostealer dump posted
      to Telegram in August, pulled from nearly 6,000 infected machines in
      162 countries.
    source: Google Threat Intelligence Group, The Hacker News
    url: https://thehackernews.com/2026/09/threatsday-ai-search-poisoning-ai.html

  - section: On This Day
    title: 1978 - Pope John Paul I dies after 33 days as pope
    body: >-
      The Italian pope, born Albino Luciani, died suddenly at the Vatican
      after the shortest papacy in more than a century, prompting a second
      conclave that year that elected John Paul II.
    when: Sep 28, 1978
    source: Wikipedia
    url: https://en.wikipedia.org/wiki/September_28
