<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Weather Info Dashboard</title>

	<!-- External Fonts -->
	<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto">
	<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Noticia+Text">

	<!-- External Libraries -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
	<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns/dist/chartjs-adapter-date-fns.bundle.min.js"></script>

	<!-- Custom Styles -->
	<link rel="stylesheet" href="styles.css">
</head>

<body>
	<div>
		<div class="row g-0">
			<!-- Main Content Column -->
			<div class="col-md-7 main-content">
				<!-- Date Display -->
				<div id="date" class="text-center"></div>

				<!-- Time Display -->
				<div id="time-now"></div>

				<br>

				<!-- Weather Section -->
				<div class="row">
					<div class="col-md-4">
						<p id="weather"></p>
					</div>
					<div class="col-md-8" id="weather-note"></div>
				</div>

				<!-- Weather Chart -->
				<div id="weather-chart-container">
					<canvas id="weather-chart"></canvas>
				</div>
			</div>

			<!-- Marquee/News Column -->
			<div class="col-md-5">
				<div id="marquee"></div>
			</div>
		</div>
	</div>

	<!-- Footer with Sun Times -->
	<footer>
		<div id="sunrise" class="text-center"></div>
		<div id="sunset" class="text-center"></div>
		<div id="noon" class="text-center">Noon</div>
	</footer>

	<!-- Custom Scripts -->
	<script src="app.js"></script>

</body>

</html>
