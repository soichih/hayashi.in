<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Weather Info Dashboard</title>

	<!-- External Fonts -->
	<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto">
	<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Noticia+Text">

	<!-- External Libraries -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
	<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>

	<!-- Custom Styles. Bump ?v= on styles.css and app.js whenever either changes:
	     browsers may reuse a cached copy for 10 minutes, and a new page with the
	     old stylesheet or script renders broken. -->
	<link rel="stylesheet" href="styles.css?v=2026-10-04">
</head>

<body>
	<!-- One grid; styles.css places the areas for the screen shape:
	     landscape = dashboard left, news right, sun times along the bottom;
	     portrait = dashboard on top, news below. -->
	<main id="dash">
		<div id="date"></div>
		<div id="time-now"></div>

		<!-- Current conditions and the two-day forecast -->
		<section id="now">
			<div id="weather"></div>
			<div id="weather-note"></div>
		</section>

		<div id="weather-chart-container">
			<canvas id="weather-chart"></canvas>
		</div>

		<!-- Sun times -->
		<footer id="sun">
			<div id="sunrise"></div>
			<div id="noon">Noon</div>
			<div id="sunset-moon"><span id="sunset"></span><span id="moon"></span></div>
		</footer>

		<!-- News: app.js builds the panes (2x2 grid of groups, or one feed) -->
		<section id="news-panel"></section>
	</main>

	<!-- Custom Scripts -->
	<script src="app.js?v=2026-10-04"></script>

</body>

</html>
