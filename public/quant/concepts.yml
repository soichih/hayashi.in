  - {id: other_distributions, name: "t, chi-square and binomial distributions", domain: stats, tier: 1, level: 2, prereqs: [normal_distribution], certs: [CFA1, FRM1], summary: "Distributions used in testing and in discrete models."}
  - {id: central_limit_theorem, name: Central limit theorem, domain: stats, tier: 1, level: 2, prereqs: [normal_distribution], certs: [CFA1, FRM1], summary: "Sample means are roughly normal for large samples."}
  - {id: sampling_standard_error, name: Sampling and standard error, domain: stats, tier: 1, level: 2, prereqs: [central_limit_theorem], certs: [CFA1, FRM1], summary: "How precise an estimate from a sample is; shrinks with sqrt(n)."}
  - {id: confidence_intervals, name: Confidence intervals, domain: stats, tier: 1, level: 2, prereqs: [sampling_standard_error], certs: [CFA1, FRM1], summary: "A range that captures the true value with a stated frequency."}
  - {id: hypothesis_testing, name: Hypothesis testing, domain: stats, tier: 1, level: 2, prereqs: [confidence_intervals, other_distributions], certs: [CFA1, FRM1], summary: "Null vs alternative, test statistic, p-value, type I and II errors."}
