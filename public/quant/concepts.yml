# Concept graph for a quant asset management learning site.
#
# Each concept is one small, testable idea. The site scores users per concept:
#   coverage = concepts presented / total concepts
#   mastery  = concepts passed (spaced-repetition) / concepts presented
#
# Fields
#   id       stable key (never rename once users have progress on it)
#   name     display name
#   domain   see `domains` below
#   tier     0 market basics .. 7 advanced (suggested learning order)
#   level    1-5 difficulty within its domain, used for placement (1 = new to
#            the area, 5 = expert). A same-domain prerequisite never has a
#            higher level than the concept that needs it.
#   prereqs  ids that should be seen first
#   certs    which syllabi cover it (see `certs` below) - topic-level mapping,
#            written from the 2026/2027 published topic outlines, not from
#            individual learning outcome statements
#   summary  one-line description (our own wording, not curriculum text)

certs:
  SIE:   FINRA Securities Industry Essentials (entry-level US)
  CFA1:  CFA Program Level I
  CFA2:  CFA Program Level II
  CFA3:  CFA Program Level III (core + Portfolio Management pathway)
  FRM1:  GARP FRM Part I
  FRM2:  GARP FRM Part II
  CQF:   Certificate in Quantitative Finance
  CAIA1: CAIA Level I
  CAIA2: CAIA Level II
  CIPM:  CFA Institute CIPM (Levels I-II)

domains:
  markets:      Markets and instruments
  math:         Math foundations
  stats:        Probability and statistics
  econ:         Economics
  fsa:          Financial statements and corporate finance
  equity:       Equity
  fixed_income: Fixed income
  derivatives:  Derivatives
  alternatives: Alternative investments
  portfolio:    Portfolio theory
  factors:      Factor models and factor investing
  quant_pm:     Quantitative portfolio management
  risk:         Risk management
  performance:  Performance measurement and attribution
  ml:           Machine learning and data
  ethics:       Ethics and standards

concepts:

  # ---------------------------------------------------------------- tier 0
  - {id: asset_classes, name: Asset classes, domain: markets, tier: 0, level: 1, prereqs: [], certs: [SIE, CFA1], summary: "Equities, bonds, cash, real assets and alternatives, and what each is for."}
  - {id: stocks_basics, name: What a stock is, domain: markets, tier: 0, level: 1, prereqs: [asset_classes], certs: [SIE, CFA1], summary: "A share of ownership with a claim on residual earnings and voting rights."}
  - {id: bonds_basics, name: What a bond is, domain: markets, tier: 0, level: 1, prereqs: [asset_classes], certs: [SIE, CFA1], summary: "A loan to an issuer that pays coupons and returns principal at maturity."}
  - {id: funds_etfs, name: Mutual funds and ETFs, domain: markets, tier: 0, level: 1, prereqs: [stocks_basics, bonds_basics], certs: [SIE, CFA1], summary: "Pooled vehicles; how ETFs trade intraday and use creation/redemption."}
  - {id: exchanges_trading, name: Exchanges and market structure, domain: markets, tier: 0, level: 1, prereqs: [stocks_basics], certs: [SIE, CFA1], summary: "Primary vs secondary markets, exchanges, dealers, brokers, market makers."}
  - {id: order_types, name: Order types, domain: markets, tier: 0, level: 1, prereqs: [exchanges_trading], certs: [SIE, CFA1], summary: "Market, limit, stop orders and when each fills."}
  - {id: bid_ask_spread, name: Bid-ask spread, domain: markets, tier: 0, level: 1, prereqs: [order_types], certs: [SIE, CFA1], summary: "The cost of immediacy; why liquid assets have tight spreads."}
  - {id: short_selling, name: Short selling, domain: markets, tier: 0, level: 2, prereqs: [order_types], certs: [SIE, CFA1], summary: "Borrow and sell to profit from a price fall; borrow cost and unlimited loss."}
  - {id: margin_leverage, name: Margin and leverage, domain: markets, tier: 0, level: 2, prereqs: [order_types], certs: [SIE, CFA1], summary: "Borrowing to invest magnifies gains and losses; margin calls."}
  - {id: market_indexes, name: Market indexes, domain: markets, tier: 0, level: 1, prereqs: [stocks_basics], certs: [SIE, CFA1], summary: "Price-, cap- and equal-weighted indexes and what each measures."}
  - {id: time_value_of_money, name: Time value of money, domain: math, tier: 0, level: 1, prereqs: [], certs: [SIE, CFA1, FRM1], summary: "A dollar today is worth more than a dollar later; PV and FV."}
  - {id: compounding, name: Compounding, domain: math, tier: 0, level: 1, prereqs: [time_value_of_money], certs: [CFA1, FRM1], summary: "Interest on interest; annual vs continuous compounding."}
  - {id: annuities, name: Annuities and perpetuities, domain: math, tier: 0, level: 2, prereqs: [compounding], certs: [CFA1], summary: "Valuing a stream of equal payments, finite or forever."}
  - {id: holding_period_return, name: Holding period return, domain: math, tier: 0, level: 1, prereqs: [compounding], certs: [CFA1, CIPM], summary: "(End value - start value + income) / start value."}
  - {id: arithmetic_vs_geometric, name: Arithmetic vs geometric mean return, domain: math, tier: 0, level: 2, prereqs: [holding_period_return], certs: [CFA1, CIPM], summary: "Why the geometric mean is lower and is what you actually earn over time."}
  - {id: log_returns, name: Log returns, domain: math, tier: 0, level: 2, prereqs: [compounding, holding_period_return], certs: [CFA1, FRM1, CQF], summary: "ln(1+r); adds across time, used in most quant models."}
  - {id: real_vs_nominal, name: Real vs nominal returns, domain: econ, tier: 0, level: 1, prereqs: [holding_period_return], certs: [SIE, CFA1], summary: "Adjusting returns for inflation."}
  - {id: risk_return_tradeoff, name: Risk-return tradeoff, domain: portfolio, tier: 0, level: 1, prereqs: [asset_classes], certs: [SIE, CFA1], summary: "Higher expected return comes with bearing more risk."}
  - {id: fiduciary_duty, name: Fiduciary duty, domain: ethics, tier: 0, level: 1, prereqs: [], certs: [SIE, CFA1, CAIA1, CIPM], summary: "Acting in the client's best interest: loyalty, prudence, care."}
  - {id: code_of_ethics, name: CFA Code and Standards overview, domain: ethics, tier: 0, level: 1, prereqs: [fiduciary_duty], certs: [CFA1, CFA2, CFA3, CIPM], summary: "Integrity, independence, fair dealing, suitability, disclosure of conflicts."}
  - {id: insider_trading, name: Material nonpublic information, domain: ethics, tier: 0, level: 2, prereqs: [code_of_ethics], certs: [SIE, CFA1], summary: "Why trading on MNPI is prohibited and the mosaic theory exception."}

  # ---------------------------------------------------------------- tier 1
  - {id: probability_basics, name: Probability rules, domain: stats, tier: 1, level: 2, prereqs: [], certs: [CFA1, FRM1], summary: "Addition and multiplication rules, conditional probability, independence."}
