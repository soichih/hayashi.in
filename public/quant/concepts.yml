  - {id: business_cycle, name: Business cycle, domain: econ, tier: 1, level: 1, prereqs: [supply_demand], certs: [CFA1, CFA3], summary: "Expansion, peak, contraction, trough, and how asset classes behave in each."}
  - {id: monetary_policy, name: Monetary policy, domain: econ, tier: 1, level: 2, prereqs: [business_cycle], certs: [CFA1, CFA3], summary: "Central bank tools and their effect on rates, inflation and assets."}
  - {id: fiscal_policy, name: Fiscal policy, domain: econ, tier: 1, level: 2, prereqs: [business_cycle], certs: [CFA1], summary: "Government spending and taxes as macro levers."}
