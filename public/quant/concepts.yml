  - {id: expected_value_variance, name: Expected value and variance, domain: stats, tier: 1, level: 2, prereqs: [probability_basics], certs: [CFA1, FRM1], summary: "The mean and spread of a random variable."}
  - {id: standard_deviation, name: Standard deviation (volatility), domain: stats, tier: 1, level: 2, prereqs: [expected_value_variance], certs: [CFA1, FRM1], summary: "Square root of variance; the usual risk number for returns."}
  - {id: annualizing_volatility, name: Annualizing volatility, domain: stats, tier: 1, level: 2, prereqs: [standard_deviation], certs: [CFA1, FRM1, CQF], summary: "Scale by sqrt(time), e.g. daily vol x sqrt(252), assuming iid returns."}
  - {id: covariance, name: Covariance, domain: stats, tier: 1, level: 2, prereqs: [expected_value_variance], certs: [CFA1, FRM1], summary: "How two variables move together, in their units."}
  - {id: correlation, name: Correlation, domain: stats, tier: 1, level: 2, prereqs: [covariance, standard_deviation], certs: [CFA1, FRM1], summary: "Covariance scaled to -1..1; measures linear co-movement only."}
  - {id: normal_distribution, name: Normal distribution, domain: stats, tier: 1, level: 2, prereqs: [standard_deviation], certs: [CFA1, FRM1, CQF], summary: "Bell curve; 68/95/99.7 rule; z-scores."}
